# ============================================================
# Workspace Cleanup 配置 - 项目：17_xianyu (XianyuHunter)
# 由 workspace-cleanup skill 生成（2026-08-14）。配置驱动，无硬编码。
# 注意：本配置已吸收首轮人工核查结论，尤其是 .cache/ 的陷阱。
#
# 修订记录：
#   - 2026-09-10（第九轮清理）：修正配置漂移 —— changelog_path 指向不存在的
#     英文文件名、verification 硬校验 release/（第七轮已删除的生成物）、
#     python_imports 为空导致 Phase 5 空转；并补齐 Vite 临时产物模式与隔离区配置。
#
# 轮次编号说明：docs/standards/目录结构.md 记到「第七轮（2026-07-23）」，
#   而 .gitignore 内为「第七轮（2026-08-08）/第八轮（2026-08-11）」，二者不一致。
#   第九轮（2026-09-10）按两者最大值续编。
# ============================================================

workspace:
  root: "."
  script_dir: "scripts"
  docs_dir: "docs"
  logs_dir: "cleanup-logs"
  frontend_dir: "frontend"
  frontend_src_dir: "frontend/src"

# 根目录允许清单（保留项）。命中扩展名或白名单才允许留在根目录。
root_allowlist:
  extensions: [".md",".txt",".yaml",".yml",".toml",".json",".example",".properties",".html",".py",".ico"]
  files:
    - "README.md"
    - "CHANGELOG.md"
    - "Dockerfile"
    - "docker-compose.yml"
    - "pyproject.toml"
    - "requirements.txt"
    - "requirements-build.txt"   # 经核查为构建依赖清单（untracked 但属源码类），保留
    - "package.json"
    - "package-lock.json"
    - ".gitignore"
    - ".dockerignore"
    - ".pre-commit-config.yaml"
    - "sonar-project.properties"
    - "xianyu-hunter.spec"        # 手工维护的 PyInstaller spec，必须随仓库提交
    - "installer.iss"
    # 真实密钥 / 运行配置（绝不删）
    - ".env"
    - "backend/.env"
    - "xiaoya_config.json"
  allowed_root_scripts: []

script_extensions: [".py",".ps1",".bat",".sh",".js",".vbs"]

script_exclude_dirs:
  - "backend/"
  - "frontend/src/"
  - "frontend/public/"
  - "tests/"
  - "scripts/tests/"
  - "node_modules/"
  - ".venv/"
  - "venv/"
  - "env/"

# ---------- 垃圾文件模式（本项目适配） ----------
garbage_patterns:
  compiled_intermediates:
    - "/release/.work/"            # PyInstaller 中间产物（release/.work，可重生成）
    - "*.pyc"
    - "*.class"
  test_outputs:
    - "/**/*.log"              # 含根目录 pytest_*.log / run.stdout.log
    - "/pytest_output*"
    - "/test_result*"
  cache_dirs:
    - ".scannerwork/"
    - ".pytest_cache/"
    - ".ruff_cache/"
    - ".mypy_cache/"
    - "__pycache__/"
    - ".next/cache/"
    - "node_modules/.cache/"
    - "frontend/coverage/"
    - ".coverage"
    - ".trae/"                 # Trae IDE 缓存
    - ".vscode/"
    - ".idea/"
    - ".uploads/"
    - ".worktrees/"
    - "scripts/test_results/"
    - "backend/xianyu_hunter.egg-info/"
    - "config/backups/"
  ide_caches:
    - "*.suo"
  os_junk:
    - "Thumbs.db"
    - ".DS_Store"
    - "*.tmp"
    - "*.bak"
    - "*.orig"
    - "*.swp"
  redirect_artifacts:
    - "/nul"                   # PowerShell `> nul` 误生成的设备名文件（55B）
    - "/_r.json"
  frontend_build_temp:         # 新增（2026-09-10）：Vite/tsc 每次构建重建的临时产物
    - "/frontend/vite.config.ts.timestamp-*.mjs"   # 第九轮发现 6 个曾被误提交入库
    - "/frontend/tsconfig.tsbuildinfo"

# ---------- 释放物 / 依赖确认门（绝不自动删） ----------
# 这些"看起来像垃圾、却可能是依赖或交付物"的模式，走 Phase 3 确认门。
review_categories:
  enabled: true
  require_explicit_confirm: true
  patterns:
    - "/frontend/node_modules/"   # 构建依赖，npm ci 可重建，但删除后需重装才能构建
    - "/.cache/"                  # ⚠️ 陷阱：683MB=Playwright 浏览器(抓取依赖)+92MB=ML 模型，运行时必需，保留
    - "/.venv/"
    - "/.venv-build/"
  reference_probe_extensions: [".py",".js",".ts",".json",".yml",".yaml",".toml",".xml",".ps1",".bat"]

# ---------- 保留根（被实际伺服/交付/运行时依赖，绝不可当垃圾） ----------
preserve_roots:
  - "release/"                             # 统一生成物根：PyInstaller exe + 安装包 + SPA + 中间产物
  - "frontend/"                            # 前端源码 + node_modules（node_modules 见 review）
  - "browser-data/"                        # 运行时登录态/Cookie（Playwright profile）
  - "data/"                                # 运行时模型/SQLite（300 .bin + 75 .pickle）
  - ".cache/"                              # 运行时依赖：Playwright 浏览器 + ML 模型
  - ".venv/"                               # Python 运行环境
  - "backend/config/"                          # 源码配置目录（untracked 但属源码，勿删）
  - "backend/xianyu_hunter/resources/"         # 源码资源目录（untracked 但属源码，勿删）
  - "release/spa/"                         # 前端编译产物（vite outDir；exe 从 release 副本加载；可重建，REVIEW 级）
  - "frontend/public/"                     # favicon 等被 SPA 引用的必要资产（*.png 被全局忽略但必需）
  - "scripts/export_embedding_onnx.py"     # 源码脚本（untracked，勿删）
  - "scripts/quantize_embedding_onnx.py"   # 源码脚本（untracked，勿删）
  - "tests/"                               # 测试源码（untracked，勿删）
  - ".env"
  - "backend/.env"
  - ".workbuddy/"                          # WorkBuddy 技能/记忆（仅删其中的 *.bak 备份）
  - "plugins/"                             # 插件技能内容（勿批量删）

detection:
  enabled: true
  prefix_indicators: ["_",".tmp_"]
  name_keywords: ["debug","diag","investigation","trace","smoke","verify","tmp","bak"]
  infer_confidence_threshold: 0.7
  auto_add_inferred_to_gitignore: true

# 服务检测（Phase 3）：本工作区当前无常驻服务；端口 8000/8001/8080/5173 均无监听。
# 注意（2026-09-10）：logs/ 目录当前不存在，pid_files 因此恒为空。
#   此时必须以 file_occupancy_probes 的【独占打开】结果作为唯一依据，
#   不可仅凭 PID 文件缺失就断定"无服务"。
service_indicators:
  pid_files: ["logs/web.pid"]
  ports: [8000,8001,8080,5173]
  process_names: ["uvicorn","python","node","java"]
  file_occupancy_probes: ["run.stdout.log","data/app.db","run.stderr.log"]

stability_check:
  enabled: true
  wait_seconds: 5
  max_recurrence: 3
  # 第九轮补充 __pycache__ / vite 临时配置：它们最易被导入或前端构建即时重建
  recurrence_patterns: ["*.log","run.stdout.log","__pycache__","vite.config.ts.timestamp-*.mjs"]
  recurrence_action: "warn"

audit:
  hash_algorithm: "sha256"
  targets_file: "cleanup-logs/cleanup-targets.txt"
  slice_size: 200

execution:
  max_external_process_seconds: 0   # 本环境无调度器 kill，跳过时间窗口逻辑
  deadline_cap_seconds: 0
  resume_targets_file: "cleanup-logs/cleanup-targets.resume.txt"
  auto_background_when_overflow: true
  per_file_estimate_seconds: 0.02

platform:
  current: "windows"
  list_files:
    windows: 'Get-ChildItem -Path "{path}" -File | Sort-Object Name'
  file_hash:
    windows: 'Get-FileHash -LiteralPath "{path}" -Algorithm SHA256'
  remove_file_python_s:
    windows: 'python -S -c "import os; os.remove(r"{path}")"'
  remove_dir_python_s:
    windows: 'python -S -c "import shutil; shutil.rmtree(r"{path}")"'
  venv_python:
    windows: ".venv/Scripts/python.exe"

verification:
  # 修正（2026-09-10）：python_imports 原为空 → Phase 5 无实际校验、形同空转。
  # 执行时必须加 -B（或 PYTHONDONTWRITEBYTECODE=1），否则导入会重建 __pycache__
  # 与 .pyc，抵消本阶段的清理成果。
  python_imports: ["from xianyu_hunter import config"]
  command: ""
  # 以下为「清理后必须存在」的硬校验项（缺失即视为清理破坏了应用）
  file_existence_checks:
    - "xianyu-hunter.spec"
    - "backend/xianyu_hunter/web/app.py"
    - "browser-data/"
    - "data/"
    - "frontend/public/favicon-16x16.png"
  # 生成物校验（缺失属正常，仅提示，不判 FAIL）
  # 修正（2026-09-10）：release/ 为 PyInstaller 生成物且已被 gitignore，
  #   第七轮清理删除后未重建，新克隆环境必然不存在 —— 故从硬校验降级至此。
  optional_generated_checks:
    - "release/"
  on_failure:
    - "检查 cleanup-logs/cleanup-*.log 中的 hash 记录"
    - "从 git 恢复：git checkout HEAD -- <file>"
    - "从隔离区恢复：python .cleanup-quarantine/<stamp>/restore.py"

# ---------- 隔离区（移动而非删除，24h 恢复窗口）----------
# 适用对象：中/高风险但与源码相关的文件 —— 一次性脚本、疑似残留、软删除项。
# 目录内会生成 MANIFEST.json（含原路径/hash/过期时间）与 restore.py。
quarantine:
  enabled: true
  dir: ".cleanup-quarantine"
  retention_hours: 24
  write_manifest: true
  write_restore_script: true
  # 隔离区自身纳入 gitignore，避免其内容被提交
  gitignore_pattern: "/.cleanup-quarantine/"

archive:
  # 修正（2026-09-10）：原值 "docs/standards/directory-structure.md" 不存在，
  # 实际文件为中文名 "docs/standards/目录结构.md"（曾导致 Phase 6 写错文件）。
  changelog_path: "docs/standards/目录结构.md"
  gitignore_path: ".gitignore"
  precommit_path: ".pre-commit-config.yaml"
  gitattributes_path: ".gitattributes"     # 新建于第九轮清理（export-ignore 规则）
  auto_update_gitignore: true
  # 保留 false：本项目 hook 需人工评估正则，但 skill 必须【明确提示】
  # "已加 gitignore 未加 pre-commit" 这一半措施，不得静默跳过。
  auto_update_precommit: false

git_integration:
  enabled: true
  tracked_deleted_check: "git ls-files --deleted"
  unstage_command: "git rm --cached --ignore-unmatch {files}"
  delete_index_command: "git rm --cached --ignore-unmatch {file}"
  delete_physical_template: "remove_file_{backend}"
  add_gitignore_patterns: true

safety:
  require_stopped_service: true
  backup_log_format: "cleanup-{YYYYMMDD-HHmmss}.log"
  dry_run: false
  min_confidence_to_delete: 0.8
  max_files_per_batch: 50
  max_files_per_call: 200
  parallel_delete: false
  large_file_sequential: true
  large_file_threshold_mb: 5
  special_filename_handling: "safe"
  verify_after_each_batch: true
  soft_delete: false          # 软删除由上方 quarantine 块统一管理
  # 删除统一走 python -S，绕过 safe-delete 钩子（沙箱会拦截 rm / shutil.rmtree）
  bypass_hook_mode: "python_s"
  # Phase 5 校验用 python -B / PYTHONDONTWRITEBYTECODE=1，避免导入重建 __pycache__
  verify_without_bytecode: true

# ---------- 体积统计方式（Windows 大目录性能）----------
# 实测（2026-09-10）：du -sh 遍历 176k 文件的工作区，15 分钟仍未完成；
#   os.scandir 栈式遍历同一工作区约 25 秒。文件数超过阈值一律用 scandir。
sizing:
  method: "python_scandir"
  fallback_method: "du_sh"
  scandir_threshold_files: 2000
