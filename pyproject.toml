[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-hunter"
version = "0.4.20260910.1"
description = "闲鱼自动捡漏与抢单系统"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",      # FastAPI UploadFile 支持
    # CLI
    "typer>=0.9",
    # 数据层
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",              # SQLite async 驱动（备用）
    # 数据验证与配置
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # 浏览器自动化
    "playwright>=1.60,<1.61",
    # HTTP 客户端
    "httpx>=0.27",                  # AI API 调用
    "aiohttp>=3.9",                 # 通知器渠道推送
    # 调度
    "apscheduler>=3.10",            # cron_utils 使用
    # 基础设施
    "loguru>=0.7",
    "keyring>=24.0",                # Windows DPAPI 密钥存储
    "tenacity>=8.2",                # 重试机制
    "cryptography>=42.0",           # Chrome v80+ Cookie AES-256-GCM 解密
    # Chatbot RAG 向量库
    "chromadb>=1.0.0",              # 1.x 提供 cp39-abi3 预编译 wheel，兼容 Python 3.14 且无需 C++ 编译
    "sentence-transformers>=5.0.0", # 本地 Embedding + 打包阶段预置 bge-small-zh 模型
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# 构建期专用依赖（运行期无需，不进安装包）：
# - onnx：scripts/export_embedding_onnx.py（torch.onnx.export）与 quantize_embedding_onnx.py（int8 量化）必需。
#   运行期仅需 onnxruntime（由 chromadb 间接带入），切勿把 onnx 列入主依赖。
build = [
    "onnx>=1.16",
]
# 系统托盘（EXE 安装包可选启用）
# 启用方式：pip install -e .[tray] 或 build-exe.ps1 中安装
tray = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.scripts]
xianyu-hunter = "xianyu_hunter.__main__:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
xianyu_hunter = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = "--cov=backend/xianyu_hunter --cov-report=xml:coverage.xml --cov-report=term-missing"

[tool.coverage.run]
source = ["backend/xianyu_hunter"]
omit = ["*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "except Exception",
    "except:",
]
