[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-hunter"
version = "0.2.0"
description = "闲鱼自动捡漏与抢单系统"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",      # FastAPI UploadFile 支持
    # CLI
    "typer>=0.9",
    # 数据层
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",              # SQLite async 驱动（备用）
    # 数据验证与配置
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # 浏览器自动化
    "playwright>=1.40",
    # HTTP 客户端
    "httpx>=0.27",                  # AI API 调用
    "aiohttp>=3.9",                 # 通知器渠道推送
    # 调度
    "apscheduler>=3.10",            # cron_utils 使用
    # 基础设施
    "loguru>=0.7",
    "keyring>=24.0",                # Windows DPAPI 密钥存储
    "tenacity>=8.2",                # 重试机制
    "cryptography>=42.0",           # Chrome v80+ Cookie AES-256-GCM 解密
    # Chatbot RAG 向量库
    "chromadb>=1.0.0",              # 1.x 提供 cp39-abi3 预编译 wheel，兼容 Python 3.14 且无需 C++ 编译
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
xianyu-hunter = "xianyu_hunter.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xianyu_hunter = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
