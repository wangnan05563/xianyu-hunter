# ============== 外部命令交互测试（meta-rule #79 落地） ==============
# 对应 xianyu-hunter-dev coding-rules step 216-221 / meta-rule #79
external_command_testing:
  # 是否启用外部命令交互测试
  enabled: true
  _doc: "长时交互式外部命令两阶段异步模式的测试配置（meta-rule #79），所有参数集中管理"
  # 两阶段端点测试：验证 POST /start + GET /status 契约
  two_phase_endpoint_test:
    # start 端点必须返回的必要字段
    start_response_fields:
      - "status"      # waiting | failed
      - "auth_url"    # 关键信息（可为 null）
      - "message"     # 用户可读消息
    # status 端点必须返回的必要字段
    status_response_fields:
      - "status"          # waiting | success | failed | idle
      - "message"         # 用户可读消息
      - "cert_file"       # success 时必须有
      - "checked_paths"   # failed 时必须有（诊断信息）
      - "output"          # failed 时必须有（子进程输出）
    # 必须覆盖的状态转换路径
    state_transitions:
      - "idle → waiting"          # 首次 POST /start
      - "waiting → success"       # 用户完成授权
      - "waiting → failed"        # 进程退出但未找到完成标志
      - "waiting → idle"          # 服务重启后单例重置
  # 多路径检测测试：验证完成标志在所有配置路径下都能被检测到
  multi_path_detection_test:
    # 测试路径列表（与 external_command_interaction.completion_detection 对齐）
    test_paths:
      - "platform_default"     # Path.home()/.cloudflared/cert.pem
      - "localappdata_derived" # %LOCALAPPDATA%/.cloudflared/cert.pem
      - "appdata_derived"      # %APPDATA%/.cloudflared/cert.pem
      - "output_regex_extracted" # 从命令输出正则提取的路径
    # 每条路径的测试策略
    test_strategy: "在对应路径放置 mock cert.pem，验证 status 端点返回 success 并包含正确路径"
  # 子进程清理测试：验证三步协议和幂等性
  cleanup_protocol_test:
    # 必须验证的清理场景
    scenarios:
      - "success_cleanup"      # success 后 reset 调用清理
      - "failed_cleanup"       # failed 后 reset 调用清理
      - "exception_cleanup"    # 异常后 reset 调用清理
      - "idempotent_cleanup"   # 多次调用 reset 不抛异常
    # 清理顺序验证
    expected_order: ["terminate", "wait", "kill"]
  # 前端轮询测试：验证四态处理和定时器清理
  frontend_polling_test:
    # 必须测试的状态分支
    state_branches:
      - "waiting → 继续 setInterval"
      - "success → clearInterval + 成功回调"
      - "failed → clearInterval + 错误展示"
      - "idle → clearInterval + 重新触发提示"
    # 定时器泄漏检测
    leak_detection:
      check_unmount_cleanup: true
      _doc: "组件卸载后验证 clearInterval 已被调用（useEffect cleanup）"
    # 轮询间隔验证（与 async_polling_pattern.interval_ms 对齐）
    expected_interval_ms: 2500

# ============== 后端 Cookie 自愈测试（模式 C） ==============
# 仅在"后端 Cookie 自愈测试模式"下使用，模式 A/B 不需要读取此段
# 对应 xianyu-hunter 历史修复：token 刷新 + cookie 强制注入两级自愈机制
backend_cookie_healing:
  _doc: "后端 Cookie 两级自愈机制的测试配置（模式 C），覆盖单元测试、集成日志序列、登录健康探测与批次预检"
  # 路径基准：以下所有文件路径均相对 project.root_dir
  # 关键代码路径（用于代码变更后回归测试范围判定）
  key_files:
    - "src/xianyu_hunter/modules/collection_service.py"
    - "src/xianyu_hunter/modules/batch_refresh_scheduler.py"
    - "src/xianyu_hunter/web/routes/unified_login.py"
    - "tests/test_collection_service.py"

  # 单元测试配置
  unit_test:
    # 测试文件路径（相对 project.root_dir）
    test_file: "tests/test_collection_service.py"
    # pytest 单个用例命令模板（{test_file} 与 {test_name} 占位符）
    # 为什么用 -v：需要看到每个测试用例的通过/失败状态
    # 为什么用 .venv 中的 python：与 web_process.start_command 保持一致，避免环境污染
    pytest_command_template: ".venv\\Scripts\\python.exe -m pytest {test_file}::{test_name} -v"
    # 运行全部自愈测试的命令模板（{test_file} 占位符）
    pytest_command_all: ".venv\\Scripts\\python.exe -m pytest {test_file} -v"
    # 自愈相关测试用例列表
    healing_test_cases:
      - name: "test_refresh_token_resets_session_invalid_before_retry"
        description: "验证熔断标志重置（重试前重置 session_invalid，重试失败时重新设置）"
      - name: "test_refresh_token_second_level_heal_succeeds"
        description: "验证两级自愈（第一级失败 → 第二级 cookie 注入成功）"
      - name: "test_refresh_token_both_levels_fail_logs_diagnostics"
        description: "验证诊断日志（两级均失败时记录 _log_cookie_diagnostics）"
      - name: "test_refresh_token_skips_when_reason_not_home_title_redirect"
        description: "验证非相关原因跳过（reason 不匹配 home_title_redirect 时不进入自愈）"

  # 集成测试配置（启动服务后验证日志序列）
  integration_test:
    # 日志文件路径（相对 project.root_dir）
    # stdout 纯文本日志：包含所有 logger 输出，便于 grep 匹配中文日志模式
    stdout_log_file: "run.stdout.log"
    # JSON 结构化日志目录（按日滚动，文件名格式 xianyu_YYYY-MM-DD.log）
    data_logs_dir: "data/logs"
    # 日志序列验证（按顺序匹配，用于验证两级自愈流程是否完整触发）
    # 匹配策略：每个 pattern 在日志中按出现顺序检查；非时序强相关用例可单独验证
    expected_log_sequence:
      - pattern: "已强制刷新 _m_h5_tk 后重试"
        description: "第一级自愈日志（token 刷新后重试）"
      - pattern: "跳过 _m_h5_tk 刷新"
        description: "跳过刷新日志（5 分钟内已刷新时跳过 token 刷新）"
      - pattern: "_m_h5_tk 刷新后重试仍失败"
        description: "第二级自愈触发日志（进入 cookie 强制注入分支）"
      - pattern: "cookie 重新注入后重试成功"
        description: "第二级自愈成功日志"
      - pattern: "会话失效诊断"
        description: "诊断日志（两级均失败时记录）"
    # 登录后健康探测（unified_login._post_login_cookie_health_check）
    login_health_check:
      expected_log: "登录后健康探测通过"
      failure_log: "登录后健康探测失败"
    # 批次级预检（batch_refresh_scheduler._sync_cookie_before_batch）
    batch_precheck:
      expected_log: "批次前 Cookie 预检通过"
      failure_log: "批次前 Cookie 预检失败"

# ============== Playwright 超时保护测试（模式 D） ==============
async_timeout_test:
  _doc: "Playwright/async 阻塞调用超时保护测试配置（对应 xianyu-hunter-dev meta-rule #80/#81/#82）"
  enabled: true

  # 关联代码文件（grep 扫描目标）
  key_files:
    - path: "scripts/browser_login.py"
      desc: "浏览器登录主脚本，_prepare_login_cookie_export 和 _collect_settled_cookies 是重点检查区域"
    - path: "scripts/auth_helper.py"
      desc: "认证辅助脚本，可能调用 Playwright API"
    - path: "src/xianyu_hunter/infra/browser.py"
      desc: "浏览器基础设施，Worker 浏览器管理"
    - path: "src/xianyu_hunter/modules/worker.py"
      desc: "Worker 模块，长期轮询场景"
    - path: "src/xianyu_hunter/modules/collector/_search.py"
      desc: "采集器搜索模块，Playwright 采集调用"

  # 需超时保护的 API 列表（按成本分类）
  protected_apis:
    lightweight_read:
      timeout_sec: 5.0
      apis: ["cookies()", "title()", "url()"]
    heavy_serialize:
      timeout_sec: 10.0
      apis: ["storage_state()", "snapshot()"]
    evaluate:
      timeout_sec: 15.0
      apis: ["evaluate()"]

  # 心跳与阶段超时协同验证
  heartbeat_coordination:
    status_file_field: "ts"
    stages:
      - status: "starting"
        timeout_sec: 90.0
      - status: "opening"
        timeout_sec: 90.0
      - status: "running"
        timeout_sec: 90.0
      - status: "waiting"
        timeout_sec: 30.0
      - status: "already_logged"
        timeout_sec: 90.0
    safety_margin: 0.3
    # 阶段内阻塞调用超时之和必须 < 阈值 * (1 - safety_margin)
    max_accumulated_timeout_sec: 30.0

  # 跨代码块一致性检查
  consistency_check:
    min_occurrences: 2
    # 同一 API 在 ≥2 处调用时保护措施必须一致
    protected_measures: ["asyncio.wait_for", "try/except", "fallback"]

  # 测试场景
  scenarios:
    - id: "AT-PT-001"
      name: "async 阻塞调用超时保护验证"
      type: "static_scan"
      desc: "grep 扫描所有 await bc.xxx()/page.xxx() 调用，验证是否有 asyncio.wait_for 包裹"
      grep_pattern: 'await\s+\w+\.(cookies|storage_state|snapshot|title|url|evaluate)\('
      expect: "每个匹配项必须被 asyncio.wait_for(..., timeout=N) 包裹"
      severity: critical

    - id: "AT-PT-002"
      name: "心跳与阶段超时协同验证"
      type: "static_scan"
      desc: "验证子进程心跳架构中每阶段有独立 status + 独立超时阈值"
      grep_pattern: 'subprocess\.Popen.*status_file|set_status\('
      expect: "阶段内所有阻塞调用超时之和 < 心跳阈值 * (1 - safety_margin)"
      severity: critical

    - id: "AT-PT-003"
      name: "跨代码块一致性检查"
      type: "static_scan"
      desc: "统计同一 API 在不同文件的调用次数，对比保护措施是否一致"
      expect: "同一 API ≥2 处调用时保护措施必须一致"
      severity: major

    - id: "AT-PT-004"
      name: "fallback 策略验证"
      type: "static_scan"
      desc: "验证超时后有 fallback 不中断主流程"
      expect: "asyncio.wait_for 的 except 块必须提供 fallback 值（如 best/空列表/None）"
      severity: major

# ============== UI 布局溢出回归测试（模式 F） ==============
# 对应 xianyu-hunter-dev meta-rule #83 + step 236/237/238
# 对应 xianyu-frontend-code-review F-REVIEW-197 / F-REVIEW-198
# 对应 xianyu-backend-code-review B-REVIEW-237
# 阈值与 xianyu-hunter-dev/config/tech-stack.json#hardConstraints.uiLayout 保持一致，避免双重真相源
ui_layout_overflow_test:
  _doc: "UI 操作项分级保留 / 多视图一致性 / 横向滚动 fallback / 接口字段对齐四类回归测试配置（meta-rule #83 落地）"
  enabled: true
  severity: major

  # 关联代码文件（grep 扫描目标，识别哪些文件变更时触发模式 F）
  key_files:
    - path: "frontend/src/pages/TaskList.tsx"
      desc: "任务列表页，表格视图 + 卡片视图双视图组件，操作列按钮分级保留的典型样例"
    - path: "frontend/src/hooks/useTaskActionHandlers.ts"
      desc: "任务操作 handler 共享 Hook，多视图操作集合一致性的核心实现"
    - path: "frontend/src/components/TaskCard.tsx"
      desc: "任务卡片组件，卡片视图操作集合"
    - path: "src/xianyu_hunter/web/api/tasks.py"
      desc: "任务列表/详情接口，ResponseModel 字段与 UI 操作集合对齐的后端契约"

  # 扫描范围（默认覆盖所有页面级 .tsx 文件）
  scan_glob: "frontend/src/pages/**/*.tsx"
  scan_exclude:
    - "**/__tests__/**"
    - "**/*.test.tsx"
    - "**/*.spec.tsx"
    - "**/*.stories.tsx"

  # === 分级保留阈值（与 xianyu-hunter-dev tech-stack.json#uiLayout 保持一致） ===
  action_button_visible_threshold: 5
  low_frequency_threshold_per_month: 1

  # 分级保留容器策略（按钮数 → 收起容器类型）
  collapse_container_strategy:
    le3: "Dropdown"      # 按钮数 ≤ 3 时收入 Dropdown
    "3to6": "Popover"    # 按钮数 4-6 时收入 Popover
    gt6: "Drawer"        # 按钮数 > 6 时收入 Drawer

  # 横向滚动 fallback（Ant Design Table scroll 属性）
  scroll_fallback: "max-content"

  # 视图识别正则（识别哪些 .tsx 包含表格视图 / 卡片视图）
  table_view_matchers:
    - "<Table"
    - "columns="
    - "scroll="
  card_view_matchers:
    - "<Card"
    - "actions="
    - "cover="

  # === 多视图一致性 ===
  multi_view_sync_required: true
  multi_view_sync_scan_glob: "frontend/src/pages/**/*.tsx"

  # === 接口字段与 UI 操作集合对齐（F-04） ===
  api_field_alignment:
    # 列表接口识别正则
    # 用双引号字符串避免单引号中 ' 转义问题；正则中 " 与 ' 均匹配引号字符
    list_response_pattern: "useQuery\\([\"'](/api/tasks).*list[\"']"
    # 详情接口识别正则
    detail_response_pattern: "useQuery\\([\"'](/api/tasks)/\\$\\{.*\\}[\"']"
    # 列表接口允许的最大返回字段数（超过则标记 over-fetching）
    max_fields_per_list_response: 15
    # 详情接口允许的最大返回字段数
    max_fields_per_detail_response: 30
    # 操作按钮分支显示所必需的字段（缺失则按钮无法正确分支）
    required_status_fields_for_action_buttons:
      - "status"
      - "task_id"
      - "seller_id"
      - "is_running"
      - "last_run_at"
    # 后端 ResponseModel 扫描路径（用于抽取返回字段集合）
    backend_response_model_paths:
      - "src/xianyu_hunter/web/schemas/task.py"
      - "src/xianyu_hunter/web/schemas/common.py"
    # ResponseModel 识别正则
    response_model_patterns:
      - 'class\s+\w+Response\b.*BaseModel'
      - 'class\s+\w+Item\b.*BaseModel'

  # === 检测信号（用于自动扫描） ===
  detection_signals:
    button_overflow:
      - "操作列内 <Button 数量 > action_button_visible_threshold"
      - "操作列内 <a> / <Typography.Link 数量 > action_button_visible_threshold"
    multi_view_inconsistency:
      - "同文件中 <Table 与 <Card 并存但 columns.render 与 actions 数组按钮 key 集合不一致"
      - "useTaskActionHandlers Hook 在表格视图与卡片视图中分别实例化（应共享）"
    missing_scroll_fallback:
      - "<Table 未声明 scroll 属性且操作列宽度可能超出容器"
    field_misalignment:
      - "UI 操作按钮 onClick 中引用 record.{field} 但接口 ResponseModel 未声明 {field}"
      - "接口返回字段数 > max_fields_per_list_response / max_fields_per_detail_response"

  # === 修复指引（与 step 236/237/238 一致） ===
  fix_guidance:
    button_overflow:
      action: "将低频按钮收入 Dropdown/Popover/Drawer，保留高频按钮平铺"
      ref_step: 236
      ref_meta_rule: 83
      ref_review: "F-REVIEW-197"
    multi_view_inconsistency:
      action: "抽取 useTaskActionHandlers Hook 共享 action 集合，两视图调用同一 Hook 实例"
      ref_step: 237
      ref_meta_rule: 83
      ref_review: "F-REVIEW-198"
    missing_scroll_fallback:
      action: "在 <Table 上追加 scroll={{ x: 'max-content' }} 或显式像素值"
      ref_step: 238
      ref_meta_rule: 83
      ref_review: "F-REVIEW-197"
    field_misalignment:
      action: "对齐前后端契约：over-fetching 删除冗余字段；under-fetching 补充 ResponseModel 字段；联动 xianyu-backend-code-review B-REVIEW-237 修复"
      ref_meta_rule: 83
      ref_review: "B-REVIEW-237"

  # === 适用场景 ===
  applicable:
    - "Ant Design Table + Card 双视图组件"
    - "操作列含多按钮（≥3 个）的列表页"
    - "使用 useQuery / useMutation 的数据驱动组件"
    - "前后端 ResponseModel 契约明确的接口"

  # === 不适用场景 ===
  not_applicable:
    - "纯展示型组件（无操作列）"
    - "表单页（无列表/卡片视图）"
    - "无后端契约的纯前端组件（如配置面板）"
    - "使用非 Ant Design UI 库的组件（需扩展 *_view_matchers）"

  # === 测试场景（F-01 ~ F-04） ===
  scenarios:
    - id: "F-01"
      name: "操作列按钮数量阈值测试"
      type: "static_scan"
      desc: "扫描所有表格/卡片视图，统计操作列按钮数量，验证超过 action_button_visible_threshold 时是否触发分级保留"
      grep_pattern: '<Button|<a\s|<Typography\.Link'
      expect: "按钮数 > 阈值时必须有 ≥1 个按钮收入 Dropdown/Popover/Drawer"
      severity: major

    - id: "F-02"
      name: "多视图模式一致性测试"
      type: "static_scan"
      desc: "识别同时声明 <Table 与 <Card 的组件文件，比较两视图操作集合是否按 key 严格一致"
      grep_pattern: '(columns=.*render|actions=\[).*(<Button|<a\s|<Typography\.Link)'
      expect: "表格视图与卡片视图操作集合按 key 严格一致，且共享 useTaskActionHandlers Hook"
      severity: major

    - id: "F-03"
      name: "横向滚动 fallback 测试"
      type: "static_scan"
      desc: "验证所有表格视图声明 scroll 属性，避免操作列过宽导致横向溢出无兜底"
      grep_pattern: '<Table[^>]*>'
      expect: "<Table 必须声明 scroll={{ x: 'max-content' }} 或显式像素值"
      severity: minor

    - id: "F-04"
      name: "接口返回字段与 UI 操作集合对齐测试"
      type: "contract_alignment"
      desc: "扫描 UI 操作按钮依赖的字段，对比后端 ResponseModel 字段声明，识别 over-fetching / under-fetching / action 字段缺失"
      expect: "UI 依赖字段必须在 ResponseModel 中声明；返回字段数不超阈值；required_status_fields_for_action_buttons 必须全部存在"
      severity: critical

  # === 关联规范与审查点 ===
  corresponding_meta_rule: 83
  corresponding_steps:
    - 236
    - 237
    - 238
  corresponding_frontend_review:
    - "F-REVIEW-197"
    - "F-REVIEW-198"
  corresponding_backend_review:
    - "B-REVIEW-237"

# ============== 数据透传完整性测试（模式 G） ==============
# 对应 2026-07-18 卖家评估 Bug 复盘 Bug 2A（user_id 传递断裂）
# 验证跨层调用链（如 collect → _evaluate_and_notify → _save_eval_event → upsert_eval_event）
# 的 user_id 等关键字段透传完整性，覆盖静态签名检查 / 运行时追踪 / 多用户隔离三类场景
data_propagation_integrity_test:
  _doc: "跨层数据透传完整性测试配置（模式 G），验证 user_id 等关键字段在多层调用链中正确传递至最底层数据库写入"

  # 需要验证的透传链路列表
  # 新增链路只需追加条目，不改 SKILL.md 流程
  propagation_chains:
    - name: "官方采集评估事件写入链路"
      # 入口方法（用户 API 调用入口）
      entry_method: "ItemCollectionService.collect"
      # 中间方法（透传链路上的层层调用）
      intermediate_methods:
        - "_collect_official_full"
        - "_evaluate_and_notify"
        - "_save_eval_event"
      # 最底层 sink 方法（实际写入数据库的方法）
      sink_method: "upsert_eval_event"
      # 必须从入口透传至 sink 的字段
      required_fields:
        - user_id
      # 测试用用户 ID（必须非默认值 "default"，否则无法检测默认值掩盖断裂的 Bug）
      test_user_id: "test_propagation_user"
      # 触发 API 端点（相对 web_process.host:port）
      trigger_endpoint: "/api/evaluations/official-collect"
      # 验证查询端点（用于检查写入的记录是否能被对应用户查询到）
      verify_endpoint: "/api/evaluations"

    - name: "worker 首次采集评估事件写入链路"
      entry_method: "TaskWorker.run_once"
      intermediate_methods:
        - "_collect_detail_and_seller"
        - "_evaluate_item"
        - "_save_eval_event"
      sink_method: "upsert_eval_event"
      required_fields:
        - task_id
      # worker 是后台任务，user_id 可能为 None（合理场景），需豁免
      exempt_fields:
        - user_id

  # 关键文件（相对 backend_dir）
  # 任一文件被修改后需要回归验证模式 G
  key_files:
    - "modules/collection_service.py"
    - "modules/worker.py"
    - "infra/repo_events.py"
    - "web/routes/evaluations_official.py"

# ============== 快照与最新值一致性测试（模式 H） ==============
# 对应 2026-07-18 卖家评估 Bug 复盘 Bug 1（seller 字段未合并）与 Bug 2B（价格快照缺失）
# 验证评估事件中"快照值"（评估时入库的值）与"最新值"（enrich 后的 items 表最新值）的职责分离
# 覆盖快照保存 / 过滤优先级 / fallback 数据合并三类场景
snapshot_consistency_test:
  _doc: "快照与最新值一致性测试配置（模式 H），验证评估事件快照字段与最新值的职责分离是否正确"

  # 需要验证的快照字段列表
  # 新增字段只需追加条目，不改 SKILL.md 流程
  snapshot_fields:
    - name: "评估时价格"
      # 快照字段名（评估事件 payload 中保存评估时的值）
      snapshot_field: "_eval_snapshot_price"
      # 最新值字段名（items 表中的当前值，enrich 阶段可能覆盖）
      latest_field: "item_price"
      # enrich 覆盖函数（可能用 latest_field 覆盖 snapshot_field 的函数）
      enrich_functions:
        - "_apply_positive_fields"
        - "_enrich_eval_with_item"
      # 过滤函数（应优先用 snapshot_field 而非 latest_field）
      filter_functions:
        - "_filter_price_range"
        - "_filter_market_ratio"

  # fallback 函数验证（验证主源失败时 fallback 是否合并所有可用来源）
  fallback_functions:
    - name: "seller_profile 降级"
      # 主源函数（正常情况下调用的函数）
      primary_function: "collector.seller_profile"
      # fallback 函数（主源失败时调用的降级函数）
      fallback_function: "seller_profile_fallback"
      # 主源成功后是否也必须合并次源字段（补全主源未提供的空字段）
      merge_on_primary_success: true
      # 需要合并的字段列表（主源 + 次源都应提供这些字段的非空值）
      merge_fields:
        - nick
        - credit_score
        - register_days
        - sold_count

  # 测试场景（构造具体数据验证过滤优先级）
  # 每个场景声明 eval_price（评估时值）、latest_price（enrich 后值）、min/max_price（过滤范围）、expected_filtered（预期是否被过滤）
  test_scenarios:
    # 场景 1：评估时价格在范围内，enrich 后超范围 → 不应过滤
    # 因为过滤函数应优先用 snapshot_field（评估时值）而非 latest_field（最新值）
    - name: "评估时在范围内，enrich 后超范围"
      eval_price: 50
      latest_price: 150
      min_price: 10
      max_price: 100
      expected_filtered: false

    # 场景 2：评估时价格超范围，enrich 后在范围内 → 应过滤
    # 即使最新值在范围内，仍按评估时值过滤（保留评估时的判定结果）
    - name: "评估时超范围，enrich 后在范围内"
      eval_price: 200
      latest_price: 50
      min_price: 10
      max_price: 100
      expected_filtered: true

    # 场景 3：评估时无价格，enrich 后有价格 → 不应过滤
    # 评估时无值时 fallback 用最新值，避免误删有效记录
    - name: "评估时无价格，enrich 后有价格"
      eval_price: null
      latest_price: 150
      min_price: 10
      max_price: 100
      expected_filtered: false

  # 关键文件（相对 backend_dir）
  # 任一文件被修改后需要回归验证模式 H
  key_files:
    - "web/routes/evaluations_list.py"
    - "modules/collection_service.py"
    - "modules/worker.py"
    - "modules/collector/_detail.py"

# ============== Cookie-Token 一致性测试（模式 I）==============
# 对应 2026-07-22 FAIL_SYS_ILLEGAL_ACCESS token 不匹配问题复盘
# 验证身份 Cookie 与签名 token（_m_h5_tk）的状态分离与一致性保障
# 覆盖 Cookie 补注入 / Token 重置独立性 / 续期闭环回写 / 日志占位符 / 静默异常禁止五类场景
cookie_token_consistency_test:
  _doc: "Cookie-Token 一致性测试配置（模式 I），验证身份 Cookie 与签名 token 的状态分离、续期闭环完整性及日志规范"

  # === 场景 1：Cookie 补注入测试 ===
  # 浏览器缺身份 Cookie 时必须从 CookieStore JSON 补注入
  cookie_injection:
    # 身份 Cookie 列表（必须全部存在才认为身份 Cookie 完整）
    identity_cookies:
      - unb
      - cookie2
      - sgcookie
      - _tb_token_
      - t
    # 允许补注入的域（只注入这些域的 Cookie，防止跨域污染）
    inject_domains:
      - goofish.com
      - taobao.com
    # 测试用例
    test_cases:
      - id: "I-01"
        name: "缺所有身份 Cookie 时全量补注入"
        desc: "浏览器 Cookie 为空，应从 CookieStore JSON 补注入所有 identity_cookies"
        initial_browser_cookies: []
        expected_injected_cookies: [unb, cookie2, sgcookie, _tb_token_, t]
        expected_inject_domains: [goofish.com, taobao.com]
        severity: critical

      - id: "I-02"
        name: "缺部分身份 Cookie 时增量补注入"
        desc: "浏览器只有 unb，缺 cookie2/sgcookie/_tb_token_/t，应增量补注入缺失项"
        initial_browser_cookies: [unb]
        expected_injected_cookies: [cookie2, sgcookie, _tb_token_, t]
        severity: critical

      - id: "I-03"
        name: "身份 Cookie 完整时不触发补注入"
        desc: "浏览器已有所有 identity_cookies，不应执行补注入"
        initial_browser_cookies: [unb, cookie2, sgcookie, _tb_token_, t]
        expected_injected_cookies: []
        severity: major

  # === 场景 2：Token 重置独立性测试 ===
  # 无论是否执行了 Cookie 补注入，都必须重置 token 刷新时间戳
  token_reset_independence:
    # token 刷新时间戳字段名
    token_refresh_field: "_last_m5tk_refresh"
    # 重置值（强制刷新）
    token_reset_value: 0.0
    # 测试用例
    test_cases:
      - id: "I-04"
        name: "补注入后必须重置 token"
        desc: "执行了 Cookie 补注入后，token_refresh_field 必须被重置为 token_reset_value"
        cookie_injected: true
        expected_token_reset: true
        severity: critical

      - id: "I-05"
        name: "未补注入时也必须重置 token"
        desc: "身份 Cookie 完整未触发补注入，token_refresh_field 仍必须被重置为 token_reset_value"
        cookie_injected: false
        expected_token_reset: true
        severity: critical

  # === 场景 3：续期闭环回写测试 ===
  # 续期回调导航刷新 token 后必须提取完整 Cookie 回写 CookieStore JSON + SQLite
  renewal_loop_writeback:
    # 续期导航 URL
    nav_url: "https://h5.m.taobao.com/"
    # 导航超时（毫秒）
    nav_timeout_ms: 10000
    # 回写域（提取这些域的 Cookie 回写）
    export_domains:
      - goofish.com
      - taobao.com
    # 回写方法标记（用于日志区分回写来源）
    method_tag: "renew"
    # 回写失败是否阻断续期（false 表示只记 warning 不阻断）
    writeback_failure_blocks_renewal: false
    # 测试用例
    test_cases:
      - id: "I-06"
        name: "续期后必须回写 CookieStore JSON"
        desc: "导航成功后必须调用 browser.get_cookies(export_domains) + export_cookies(method=method_tag) 回写 JSON"
        nav_success: true
        expected_json_writeback: true
        expected_sqlite_writeback: true
        severity: critical

      - id: "I-07"
        name: "回写失败不阻断续期"
        desc: "回写失败时只记 logger.warning，不返回 False 阻断续期流程"
        nav_success: true
        writeback_success: false
        expected_renewal_return: "success"
        expected_log_level: "warning"
        severity: major

  # === 场景 4：日志占位符合规性测试 ===
  # loguru 用 {} 占位符，禁止 %s/%d/%f
  loguru_placeholder:
    # 日志库
    logger_library: "loguru"
    # 正确占位符
    correct_placeholder: "{}"
    # 禁止占位符列表
    forbidden_placeholders:
      - "%s"
      - "%d"
      - "%f"
      - "%r"
    # 异常对象日志是否用 {} 而非 f-string
    exceptions_use_brace_not_fstring: true
    # 测试用例
    test_cases:
      - id: "I-08"
        name: "loguru 日志禁止使用 %s 占位符"
        desc: "扫描所有 logger.xxx() 调用，禁止在 loguru 日志中使用 forbidden_placeholders 中的占位符"
        scan_pattern: 'logger\.\w+\(.*%[sdrf].*\)'
        expected: "所有 loguru 日志使用 {} 占位符"
        severity: major

      - id: "I-09"
        name: "异常对象日志用大括号而非 f-string"
        desc: "记录异常对象时应用 logger.exception 占位符传参，而非用 f-string 嵌入异常对象"
        scan_pattern: "logger\\.\\w+\\(f[\"'].*\\{.*\\}.*[\"']"
        expected: "异常日志用大括号占位符传参，禁止 f-string 嵌入异常对象"
        severity: minor

  # === 场景 5：静默异常禁止测试 ===
  # 禁止 except: pass，关键路径必须 logger.exception()
  silent_exception_ban:
    # 关键路径方法名模式（必须用 logger.exception）
    critical_path_patterns:
      - "_on_startup"
      - "run_migrations"
      - "_init_"
      - "_shutdown"
      - "_on_close"
    # 关键路径最小日志级别
    critical_path_min_level: "exception"
    # 辅助路径最小日志级别
    auxiliary_path_min_level: "warning"
    # 禁止的异常处理模式（正则）
    forbidden_patterns:
      - 'except.*:\s*pass'
      - 'except.*:\s*\.\.\.'
      - 'except.*:\s*$'
    # 允许 debug 级别的预期异常类型
    exceptions_allowed_debug:
      - KeyError
      - FileNotFoundError
      - AttributeError
    # 测试用例
    test_cases:
      - id: "I-10"
        name: "禁止 except: pass 静默异常"
        desc: "扫描所有 except 块，禁止完全静默（pass / ... / 空）"
        scan_pattern: 'except.*:\s*(pass|\.\.\.|\s*$)'
        expected: "所有 except 块至少有 logger.warning 或 logger.exception"
        severity: critical

      - id: "I-11"
        name: "关键路径必须用 logger.exception"
        desc: "关键路径方法（_on_startup/run_migrations/_init_ 等）的 except 块必须用 logger.exception 输出完整 traceback"
        scan_pattern: 'def\s+(_on_startup|run_migrations|_init_|_shutdown|_on_close)'
        expected: "关键路径 except 块用 logger.exception，禁止 logger.warning(f'...')"
        severity: critical

  # === 关键文件（相对 backend_dir）===
  # 任一文件被修改后需要回归验证模式 I
  key_files:
    - "modules/api_task_links.py"
    - "modules/login_orchestrator.py"
    - "modules/worker.py"
    - "modules/cookie_store.py"
    - "modules/_search.py"

  # === 关联规范与审查点 ===
  corresponding_meta_rule: 84
  corresponding_steps:
    - 243
    - 244
    - 245
    - 246
  # 注意：B-REVIEW-242~244 和 F-REVIEW-199 已被 meta-rule #85（v4.51.0）占用
  # 模式 I 对应的审查点编号待创建后更新
  corresponding_backend_review: []
  corresponding_frontend_review: []

# ============== 关键路径可观测性与状态同步测试（模式 J） ==============
# 对应 2026-07-22 抢单超时 + image_urls 清空 Bug 复盘（meta-rule #85）
# 覆盖多步骤进度编号日志 / 超时异常用户友好语义 / 组件复用状态重置 / 字段覆盖集合选择四类场景
# 所有参数集中管理，新增检查项只需追加 scenarios 条目
critical_path_observability_test:
  _doc: "关键路径可观测性与状态同步测试配置（模式 J），验证多步骤日志编号、超时异常语义、React 组件复用状态重置、字段覆盖集合选择四类规则"

  # === 场景 1：多步骤进度编号日志测试（step 247 STEP-PROGRESS-LOG-01）===
  # ≥3 步骤的关键路径必须打编号日志 "步骤X/N <描述> <标识>"
  step_progress_log:
    # 触发测试的最小步骤数（少于此次数的不要求编号日志）
    min_steps_threshold: 3
    # 日志编号格式正则（匹配 "步骤X/N" 或 "Step X/N"）
    log_pattern_regex: '(步骤|Step)\s*\d+/\d+'
    # 关键路径方法名模式（必须打编号日志的方法）
    critical_path_method_patterns:
      - "async def _do_"
      - "async def _collect_"
      - "async def _navigate_"
      - "async def _click_"
      - "async def _submit_"
      - "def _run_migrations"
      - "async def _login"
    # 关键标识字段（编号日志中必须包含至少一个）
    required_identifiers:
      - "task_id"
      - "item_id"
      - "user_id"
      - "request_id"
    # 测试用例
    test_cases:
      - id: "J-01"
        name: "关键路径多步骤编号日志验证"
        type: "static_scan"
        desc: "扫描关键路径方法，验证 ≥min_steps_threshold 步骤的方法在每个步骤前有编号日志"
        expect: "每个步骤前有 logger.info/debug 包含 log_pattern_regex 匹配的编号格式"
        severity: major

      - id: "J-02"
        name: "编号日志包含关键标识"
        type: "static_scan"
        desc: "验证编号日志中包含至少一个 required_identifiers 中的标识字段"
        expect: "编号日志格式为 '步骤X/N <描述> <标识>=<值>'"
        severity: minor

  # === 场景 2：超时异常用户友好语义测试（step 248 TIMEOUT-ERROR-SEMANTICS-01）===
  # asyncio.wait_for 的 except 块必须先捕获 TimeoutError 再捕获 Exception
  timeout_error_semantics:
    # 超时保护包裹函数名
    timeout_wrapper: "asyncio.wait_for"
    # 必须单独捕获的异常类型
    specific_exception: "asyncio.TimeoutError"
    # 通用异常类型（必须在特定异常之后）
    generic_exception: "Exception"
    # 错误消息必须包含的三要素
    error_message_elements:
      - "timeout_sec"      # 超时秒数
      - "possible_cause"   # 可能原因
      - "suggested_action" # 建议操作
    # 友好错误消息模板示例（供参考，实际消息从 config 读取）
    message_template_examples:
      - "浏览器自动化流程超时（{timeout_sec}秒），请检查闲鱼登录状态后重试"
      - "抢单流程超时（{timeout_sec}秒），可能原因：页面加载缓慢，建议：检查网络后重试"
    # 测试用例
    test_cases:
      - id: "J-03"
        name: "TimeoutError 单独捕获验证"
        type: "static_scan"
        desc: "扫描 asyncio.wait_for 的 try/except 块，验证 except asyncio.TimeoutError 在 except Exception 之前"
        scan_pattern: 'asyncio\.wait_for.*\n.*try:|except\s+(asyncio\.)?TimeoutError|except\s+Exception'
        expect: "except asyncio.TimeoutError 必须在 except Exception 之前单独出现"
        severity: critical

      - id: "J-04"
        name: "超时错误消息三要素验证"
        type: "static_scan"
        desc: "验证 TimeoutError 分支的错误消息包含超时秒数+可能原因+建议操作"
        expect: "错误消息含 timeout_sec 值 + 可能原因描述 + 建议操作描述"
        severity: major

      - id: "J-05"
        name: "超时异常不走通用分支"
        type: "runtime"
        desc: "触发超时场景，验证用户看到的错误消息是友好语义而非 '未知异常'"
        expect: "前端/toast 显示的超时消息包含三要素，不出现 '未知异常' / 'Unknown error'"
        severity: critical

  # === 场景 3：React 组件复用状态重置测试（step 249 COMPONENT-REUSE-STATE-RESET-01）===
  # 被复用的组件在 props 变化时必须重置 useState 状态
  component_reuse_state_reset:
    # 需要检测的组件模式（组件名 → 关键 props）
    # 新增组件只需追加条目
    watched_components:
      - name: "ThumbCell"
        # 状态重置触发 props（这些 props 变化时必须重置内部状态）
        reset_trigger_props:
          - "url"
          - "src"
        # 内部状态字段（需要重置的 useState）
        state_fields_to_reset:
          - "errored"
      - name: "ImagePreview"
        reset_trigger_props:
          - "imageUrls"
          - "currentIndex"
        state_fields_to_reset:
          - "scale"
          - "rotation"
    # 通用检测正则（识别所有可能需要状态重置的组件）
    # 匹配模式：组件同时声明 useState 和接收 props
    component_detection_regex: 'function\s+\w+\(\{.*\}.*\).*\{.*useState'
    # useState 声明正则
    use_state_regex: 'const\s+\[(\w+),\s*set\w+\]\s*=\s*useState'
    # useEffect 依赖数组正则
    use_effect_regex: 'useEffect\(\(\)\s*=>\s*\{.*\},\s*\[(.*?)\]'
    # 测试用例
    test_cases:
      - id: "J-06"
        name: "ThumbCell url 变化时 errored 重置"
        type: "browser"
        desc: "在商品列表中切换商品，验证 ThumbCell 组件的 errored 状态在新 url 时重置为 false"
        expect: "图片加载失败后切换商品，新图片不显示错误占位图"
        severity: critical

      - id: "J-07"
        name: "所有 watched_components 有状态重置 useEffect"
        type: "static_scan"
        desc: "扫描所有 watched_components，验证有 useEffect 监听 reset_trigger_props 并重置 state_fields_to_reset"
        expect: "每个 watched_component 有 useEffect(() => { setX(false) }, [trigger_prop])"
        severity: major

      - id: "J-08"
        name: "通用组件状态重置检测"
        type: "static_scan"
        desc: "扫描所有组件，识别同时使用 useState 和 props 的组件，检查 props 变化时是否重置状态"
        expect: "所有接收 props 且有内部状态的组件，关键 props 变化时有 useEffect 重置逻辑"
        severity: minor

  # === 场景 4：字段覆盖集合选择测试（step 250 OVERWRITE-SET-SELECTION-01）===
  # _ALWAYS_OVERWRITE 集合只放"每次采集必定获取到+新值更准确"的字段
  overwrite_set_selection:
    # 覆盖集合变量名（在代码中搜索此变量名）
    overwrite_set_var: "_ALWAYS_OVERWRITE"
    # 合并策略函数名
    coalesce_function: "_coalesce"
    # 允许放入 _ALWAYS_OVERWRITE 的字段特征
    # 必须同时满足：每次采集必定获取到 + 新值更准确
    allowed_overwrite_field_criteria:
      - "每次采集必定获取到（非 None/非空）"
      - "新值比旧值更准确（如计数器、时间戳）"
    # 禁止放入 _ALWAYS_OVERWRITE 的字段特征
    # 采集可能返回 None/空值但旧值有价值的字段必须走 _coalesce
    forbidden_overwrite_field_criteria:
      - "采集可能返回 None/空值（如图片 URL）"
      - "旧值有历史价值（如首次采集的图片）"
      - "字段来自不稳定数据源（可能间歇性失败）"
    # 已知的正确 _ALWAYS_OVERWRITE 字段（参考）
    known_correct_overwrite_fields:
      - "task_id"
      - "publish_time"
      - "view_cnt"
      - "want_cnt"
      - "region"
      - "seller_id"
    # 已知的应走 _coalesce 的字段（参考）
    known_coalesce_fields:
      - "image_urls"
      - "title"
      - "desc"
    # 测试用例
    test_cases:
      - id: "J-09"
        name: "_ALWAYS_OVERWRITE 字段合规性验证"
        type: "static_scan"
        desc: "扫描 _ALWAYS_OVERWRITE 集合的每个字段，验证是否符合 allowed_overwrite_field_criteria"
        expect: "集合中每个字段都满足'每次必定获取到+新值更准确'，不包含可能返回 None 的字段"
        severity: critical

      - id: "J-10"
        name: "可能返回 None 的字段走 _coalesce"
        type: "static_scan"
        desc: "识别采集可能返回 None 的字段（image_urls 等），验证它们不在 _ALWAYS_OVERWRITE 中而在 _coalesce 逻辑中"
        expect: "known_coalesce_fields 中的字段不在 _ALWAYS_OVERWRITE 集合中"
        severity: major

      - id: "J-11"
        name: "数据合并后旧值保留验证"
        type: "runtime"
        desc: "采集返回 image_urls=None 时，验证数据库中旧的 image_urls 值不被覆盖为 None"
        expect: "采集返回 None 的字段保留数据库旧值，不出现旧值被清空的 Bug"
        severity: critical

  # === 关键文件（相对 backend_dir / frontend_dir）===
  # 任一文件被修改后需要回归验证模式 J
  key_files:
    backend:
      - "modules/buyer.py"
      - "modules/collection_service.py"
      - "modules/worker.py"
      - "web/api/evaluations.py"
    frontend:
      - "src/components/ThumbCell.tsx"
      - "src/components/ImagePreview.tsx"

  # === 关联规范与审查点 ===
  corresponding_meta_rule: 85
  corresponding_steps:
    - 247
    - 248
    - 249
    - 250
  corresponding_backend_review:
    - "B-REVIEW-242"
    - "B-REVIEW-243"
    - "B-REVIEW-244"
  corresponding_frontend_review:
    - "F-REVIEW-199"

# ============== 模式 K：DB 脏值诊断测试（meta-rule #86 落地） ==============
# 对应 xianyu-hunter-dev meta-rule #86（配置字段全链路覆盖检查）
# 复盘来源：2026-07-11 智能客服新建会话乱码 Bug（DB welcome_message 被写入占位串 '??????????!'）
# 适用场景：用户报告"显示乱码/问号/方块/不可读字符"时，先诊断 DB 是否有脏值
mode_k_db_dirty_value_diagnosis_test:
  # 模式标识
  mode_id: "K"
  mode_name: "db_dirty_value_diagnosis_test"
  mode_description: "DB 脏值诊断测试：检查 DB 中是否存在字面占位串（如 '????'）或编码乱码（UTF-8 多字节序列乱序）"

  # === 触发条件 ===
  trigger_conditions:
    # 用户报告关键词（任一命中即触发模式 K）
    user_report_keywords:
      - "乱码"
      - "问号"
      - "方块"
      - "不可读"
      - "显示异常"
      - "garbled"
      - "mojibake"
    # 触发场景（功能层面）
    trigger_scenarios:
      - "用户新建会话/记录后显示异常字符"
      - "配置项值显示为问号或方块"
      - "前端渲染出现未预期字符"

  # === 诊断步骤 ===
  diagnosis_steps:
    - id: "K-01"
      name: "定位脏值字段"
      description: "根据用户报告的功能模块，定位可能存在脏值的 DB 表和字段"
      # 功能模块 → DB 表/字段映射（可扩展）
      module_field_map:
        chatbot:
          table: "chatbot_config"
          fields: ["welcome_message", "system_prompt", "fallback_response"]
        task:
          table: "tasks"
          fields: ["name", "description", "config_json"]
        order:
          table: "orders"
          fields: ["item_title", "seller_name", "notes"]
        evaluation:
          table: "evaluations"
          fields: ["reason", "detail", "summary"]
      # 通用 fallback：扫描所有 TEXT 字段
      fallback_scan_all_text_fields: true

    - id: "K-02"
      name: "hex 字节检查"
      description: "使用 SQLite hex() 函数检查字段值的字节序列，区分编码乱码与字面占位串"
      # SQL 模板（{table}、{field}、{where_clause} 占位符）
      sql_template: "SELECT id, {field}, hex({field}) as hex_bytes FROM {table} {where_clause}"
      # 判断规则
      byte_analysis_rules:
        # 字面占位串：ASCII 0x3F = '?'，连续多个 3F 即为占位串
        literal_placeholder_pattern: "^(3F)+$"
        literal_placeholder_description: "字面占位串（如 '??????????!'），通常由 DB 迁移脚本写入未初始化的默认值"
        # UTF-8 编码乱码：多字节序列乱序（如 EF BF BD = U+FFFD 替换字符）
        utf8_mojibake_patterns:
          - "EFBFBD"           # U+FFFD 替换字符（UTF-8 解码失败时的兜底）
          - "C3A2C282C2AC"    # UTF-8 双重编码的 €
          - "E282AC"           # UTF-8 正确的 €（用于对比）
        utf8_mojibake_description: "UTF-8 编码乱码，通常由编码转换错误导致"
        # GBK 误读为 UTF-8 的常见模式
        gbk_misread_patterns:
          - "CED2C3C7"        # "我们" 的 GBK 编码被误读
        gbk_misread_description: "GBK 编码被误读为 UTF-8，通常由 Windows 中文环境导致"
      # hex 检查命令模板（PowerShell 兼容）
      powershell_sql_template: ".venv\\Scripts\\python.exe -c \"import sqlite3; conn=sqlite3.connect('data/xianyu.db'); cur=conn.cursor(); cur.execute('{sql}'); print(cur.fetchall())\""

    - id: "K-03"
      name: "脏值清理"
      description: "确认脏值后，执行 DELETE 或 UPDATE 清理"
      # 清理策略
      cleanup_strategies:
        # 策略 1：DELETE 整行（适用于配置覆盖行，删除后回退默认值）
        delete_row:
          applicable_when: "字段有默认值回退机制（如 chatbot_config 表的覆盖行）"
          sql_template: "DELETE FROM {table} WHERE key = '{key}'"
        # 策略 2：UPDATE 为 NULL（适用于允许 NULL 的字段）
        update_null:
          applicable_when: "字段允许 NULL 且业务逻辑能处理 NULL"
          sql_template: "UPDATE {table} SET {field} = NULL WHERE id = {id}"
        # 策略 3：UPDATE 为默认值（适用于有明确默认值的字段）
        update_default:
          applicable_when: "字段有明确的默认值"
          sql_template: "UPDATE {table} SET {field} = '{default_value}' WHERE id = {id}"
      # 清理后必须验证
      verify_after_cleanup: true
      verify_sql_template: "SELECT {field} FROM {table} WHERE id = {id}"

    - id: "K-04"
      name: "全链路覆盖回归测试"
      description: "清理脏值后，验证配置字段的 5 层链路是否完整（meta-rule #86）"
      # 5 层链路检查（引用 meta-rule #86）
      full_chain_check:
        enabled: true
        meta_rule_ref: "meta-rule #86"
        layers:
          - name: "db_schema"
            check: "grep '{field}' src/xianyu_hunter/models/ 或 grep 'ALTER TABLE.*{field}' migrations/"
          - name: "get_config_return"
            check: "grep '{field}' src/xianyu_hunter/web/routes/api_chatbot_config.py（get_config 函数返回 dict）"
          - name: "update_config_handle"
            check: "grep '{field}' src/xianyu_hunter/web/routes/api_chatbot_config.py（update_config 函数体）"
          - name: "frontend_types"
            check: "grep '{field}' frontend/src/pages/Chatbot/types.ts"
          - name: "frontend_ui"
            check: "grep '{field}' frontend/src/pages/Chatbot/Config.tsx"
        # 缺失层级的处理建议
        missing_layer_advice:
          db_schema: "需新增迁移脚本 ALTER TABLE ADD COLUMN"
          get_config_return: "需在 get_config 返回 dict 中追加该字段"
          update_config_handle: "需在 update_config 中显式处理该字段（含空值短路）"
          frontend_types: "需在 types.ts 接口中新增字段"
          frontend_ui: "需在 Config.tsx 中新增编辑控件（Input/TextArea + 恢复默认按钮）"

  # === 测试用例模板 ===
  test_cases:
    - id: "K-TC-01"
      name: "字面占位串诊断"
      precondition: "DB chatbot_config 表 welcome_message 字段值为 '??????????!'"
      steps:
        - "执行 K-01 定位字段"
        - "执行 K-02 hex 检查，预期 hex_bytes 为 3F3F3F3F3F3F3F3F3F21"
        - "执行 K-03 DELETE 清理"
        - "执行 K-04 验证 get_config 返回默认值"
      expected_result: "welcome_message 字段返回默认值 'Hi，我是智能客服小蜜...'，前端正常显示"

    - id: "K-TC-02"
      name: "UTF-8 编码乱码诊断"
      precondition: "DB 字段值包含 U+FFFD 替换字符"
      steps:
        - "执行 K-01 定位字段"
        - "执行 K-02 hex 检查，预期 hex_bytes 包含 EFBFBD"
        - "执行 K-03 UPDATE 为 NULL 或默认值"
        - "执行 K-04 验证字段值正确"
      expected_result: "字段值恢复正常，前端无乱码显示"

    - id: "K-TC-03"
      name: "配置字段全链路覆盖回归"
      precondition: "新增配置字段后，验证 5 层链路完整"
      steps:
        - "执行 K-04 全链路检查，grep 5 个位置"
        - "如有缺失层，按 missing_layer_advice 修复"
      expected_result: "5 层链路全部覆盖，无缺失"

  # === 与其他模式的协作 ===
  mode_collaboration:
    # 模式 K 诊断完成后，可触发以下模式做回归
    trigger_after_diagnosis:
      - mode_id: "C"
        description: "单元测试回归（确保清理脏值后业务逻辑正常）"
      - mode_id: "J"
        description: "关键路径测试（确保配置字段链路完整）"
    # 模式 K 不适用于以下场景（应改用其他模式）
    not_applicable_redirect:
      - scenario: "前端渲染乱码但 DB 值正常"
        redirect_to: "模式 F（UI 布局溢出回归测试）或浏览器 console 检查"
      - scenario: "API 返回乱码但 DB 值正常"
        redirect_to: "检查后端响应头 Content-Type 是否含 charset=utf-8"

  # === 输出报告格式 ===
  report_format:
    title: "DB 脏值诊断测试报告（模式 K）"
    sections:
      - "1. 触发条件与用户报告"
      - "2. 脏值定位（表/字段/原始值/hex 字节）"
      - "3. 脏值类型判定（字面占位串 / UTF-8 乱码 / GBK 误读）"
      - "4. 清理操作（SQL 语句 + 影响行数）"
      - "5. 全链路覆盖检查（5 层 grep 结果）"
      - "6. 回归测试结果"
      - "7. 根因分析与预防建议（引用 meta-rule #86/#87）"

  # ============================================================
  # 模式 L：状态机死锁回归测试配置
  # 对应 meta-rule #86 / B-REVIEW-245
  # ============================================================
  mode_l_state_machine_deadlock_test:
    enabled: true
    description: "调度器状态机 pause/resume 闭环验证与死锁回归测试"

    # 关键代码文件（修改后需回归）
    key_files:
      backend:
        - "src/xianyu_hunter/modules/scheduler.py"
        - "src/xianyu_hunter/modules/scheduler.py::_run_loop"
        - "src/xianyu_hunter/modules/scheduler.py::_execute_run_once_locked"
        - "src/xianyu_hunter/modules/scheduler.py::_run_one_iteration"
      api:
        - "src/xianyu_hunter/web/routes/api_tasks.py"

    # 单元测试配置
    unit_test:
      test_file: "tests/test_scheduler_state_machine.py"
      # 单用例超时秒数（与 test_execution.timeout_seconds 解耦，状态机测试通常需要更长超时）
      timeout_seconds: 30
      # pytest 命令模板：{python}/{test_file}/{test_name}/{timeout_seconds} 占位符
      # 为什么用占位符而非硬编码：避免超时值变更时需要同步修改多处
      pytest_command_all: "{python} -m pytest {test_file} -v --timeout={timeout_seconds}"
      pytest_command_template: "{python} -m pytest {test_file}::{test_name} -v --timeout={timeout_seconds}"
      test_cases:
        - name: "test_pause_resume_event_pairing"
          description: "pause_event.set() 有对应 wait()"
        - name: "test_pause_returns_to_loop_top_not_break"
          description: "暂停后 loop 回到顶部阻塞，不 break 退出"
        - name: "test_should_pause_returns_false_not_true"
          description: "should_pause 返回 False（继续循环）而非 True（退出循环）"
        - name: "test_error_count_not_reset_on_session_pause"
          description: "会话失效暂停时不重置 consecutive_errors"
        - name: "test_resume_precheck_root_cause"
          description: "resume 前检查根因消除"
        - name: "test_deadlock_detection_after_resume"
          description: "resume 后 60s 内有周期执行日志"

    # 集成测试配置
    integration_test:
      stdout_log_file: "logs/web.log"
      pause_log:
        expected_pattern: "任务已暂停|session.*pause|should_pause"
        failure_pattern: "任务已停止|loop.*break|return True"
      resume_log:
        expected_pattern: "任务已恢复|resume|pause_event.*set"
        failure_pattern: "无周期执行|deadlock"
      state_machine_checks:
        pause_status_field: "is_paused"
        resume_verification: "周期执行日志"
        deadlock_detection:
          timeout_seconds: 60
          check_interval: 5

    # 状态机校验项清单
    state_machine_checks:
      - id: "SM-01"
        check: "pause_event.set() 有对应 wait()"
        severity: "critical"
      - id: "SM-02"
        check: "暂停后 loop 回到顶部阻塞（continue），不 break 退出"
        severity: "critical"
      - id: "SM-03"
        check: "should_pause 返回 False（继续循环）"
        severity: "critical"
      - id: "SM-04"
        check: "会话失效暂停时不重置 consecutive_errors"
        severity: "warning"
      - id: "SM-05"
        check: "resume 前 precheck 校验根因消除"
        severity: "warning"

    # 报告格式
    report_format:
      title: "状态机死锁回归测试报告（模式 L）"
      sections:
        - "1. 单元测试通过率"
        - "2. 集成测试状态机闭环验证"
        - "3. 死锁检测结果"
        - "4. 发现的问题与修复建议（引用 meta-rule #86）"

  # ============================================================
  # 模式 M：跨层数据契约一致性测试配置
  # 对应 meta-rule #88 / B-REVIEW-248 / F-REVIEW-200
  # ============================================================
  mode_m_cross_layer_contract_test:
    enabled: true
    description: "跨层数据字段覆盖策略、组件复用状态重置、空值语义区分验证"

    # 关键代码文件（修改后需回归）
    key_files:
      backend:
        - "src/xianyu_hunter/web/routes/api_evaluations.py"
        - "src/xianyu_hunter/infra/repo_items.py"
        - "src/xianyu_hunter/modules/collector.py"
      frontend:
        - "frontend/src/pages/Evaluations/index.tsx"
        - "frontend/src/types.ts"

    # 覆盖策略集合定义与字段映射
    overwrite_strategy:
      scan_command: "Select-String -Path 'src/xianyu_hunter/**/*.py' -Pattern '_ALWAYS_OVERWRITE|_coalesce|_NULL_SAFE'"
      field_classification:
        always_overwrite_fields:
          - "title"
          - "price"
          - "updated_at"
          - "status"
        coalesce_fields:
          - "image_urls"
          - "brand"
          - "description"
          - "seller_credit"
        null_safe_fields: []
      empty_value_test_cases:
        - name: "explicit_none_overwrites"
          description: "API 返回 None（显式空值）→ 覆盖旧值"
        - name: "field_missing_keeps_old"
          description: "API 未返回该字段（字段缺失）→ 保留旧值"

    # 前端测试配置
    frontend_test:
      component_scan_command: "Select-String -Path 'frontend/src/pages/**/*.tsx' -Pattern 'useState.*(errored|loaded|loading)'"
      build_command: "cd frontend; npm run build"
      component_reuse_test_cases:
        - name: "thumbcell_errored_reset"
          description: "ThumbCell URL 变化时 errored 状态重置"
          component: "ThumbCell"
          reset_fields: ["errored"]
        - name: "imagepreview_loaded_reset"
          description: "ImagePreview src 变化时 loaded 状态重置"
          component: "ImagePreview"
          reset_fields: ["loaded", "loading"]
      reset_fields: ["errored", "loaded", "loading"]

    # 集成测试配置
    integration_test:
      trigger_endpoint: "/api/items/{item_id}/refresh"
      db_check_query: "SELECT image_urls, brand FROM items WHERE item_id = '{item_id}'"
      api_check_endpoint: "/api/items/{item_id}"
      frontend_check_selector: ".item-image img"
      empty_value_scenario:
        description: "模拟采集未获取到图片"
        mock_command: "UPDATE items SET image_urls = NULL WHERE item_id = '{item_id}'"
        expected_behavior: "前端仍显示旧图片（不应显示占位图）"

    # 报告格式
    report_format:
      title: "跨层数据契约一致性测试报告（模式 M）"
      sections:
        - "1. 后端覆盖策略验证结果"
        - "2. 前端组件复用状态重置验证结果"
        - "3. 集成测试链路验证结果"
        - "4. 发现的问题与修复建议（引用 meta-rule #88）"

# --- 模式 N：登录副作用自动化测试配置（v1.5.0 新增）---
# 配套 B-REVIEW-250 / F-REVIEW-205 / meta-rule #89
# 所有参数通过此节点管理，不硬编码
mode_n:
  enabled: true                          # 模式总开关
  name: "login_side_effect_automation_test"
  description: "登录副作用自动化测试"
  # === 测试步骤配置 ===
  steps:
    n1_helper_call_coverage:
      enabled: true
      grep_pattern: "login.*success|登录成功"
      helper_pattern: "trigger_session_start"
      scope: "src/xianyu_hunter/web/routes/"
      pass_condition: "login_count == helper_count"
    n2_fire_and_forget:
      enabled: true
      forbidden_patterns:
        - "await.*start_session"
        - "await.*token_renewer"
      scope: "src/xianyu_hunter/web/routes/"
      pass_condition: "no_match"
    n3_helper_module_independence:
      enabled: true
      forbidden_scope: "src/xianyu_hunter/web/routes/"
      helper_pattern: "async def trigger_session_start"
      expected_module: "src/xianyu_hunter/web/services/session_starter.py"
      pass_condition: "not_in_routes"
    n4_failure_safety:
      enabled: true
      test_file: "tests/test_login_side_effect.py"
      test_function: "test_login_survives_side_effect_failure"
      pass_condition: "login_returns_200_on_helper_failure"
    n5_frontend_fallback_alert:
      enabled: true
      grep_pattern: "Alert.*warning"
      scope: "frontend/src/pages/AntiCrawl/"
      additional_pattern: "session|side_effect"
      pass_condition: "has_match"
    n6_entry_completeness:
      enabled: true
      test_file: "tests/test_login_side_effect.py"
      entry_points_ref: "backend_code_review.login_side_effect.entry_points"
      pass_condition: "all_entries_trigger_helper"
  # === 引用配置 ===
  refs:
    backend_rule: "B-REVIEW-250"
    frontend_rule: "F-REVIEW-205"
    meta_rule: "#89"
    dev_step: "step 253"
  # === 关键文件（修改后触发回归）===
  key_files:
    backend:
      - "src/xianyu_hunter/web/routes/api_auth.py"
      - "src/xianyu_hunter/web/services/session_starter.py"
      - "src/xianyu_hunter/core/login_orchestrator.py"
      - "src/xianyu_hunter/core/token_renewer.py"
    frontend:
      - "frontend/src/pages/AntiCrawl/index.tsx"
      - "frontend/src/pages/AntiCrawl/SessionManager.tsx"
  # === 适用场景 ===
  applicable_scenarios:
    - "登录成功但会话未启动"
    - "修改登录路由/session_starter/TokenRenewer"
    - "B-REVIEW-250/F-REVIEW-205 审查违规"
    - "登录流程回归测试"

# --- 模式 O：回退构造关联键一致性测试配置（v1.6.0 新增）---
# 配套 B-REVIEW-251 / F-REVIEW-206 / meta-rule #90
# 源自 2026-07-22 price_range 注入 Bug 复盘：回退构造伪 item 时遗漏 task_id 导致下游价格区间查询被跳过
# 同时覆盖 #91（时间窗口全量回退）和 #92（PowerShell 外部命令显式后缀）的测试基础设施
# 所有参数通过此节点管理，不硬编码
mode_o:
  enabled: true                          # 模式总开关
  name: "fallback_preserve_key_consistency_test"
  description: "回退构造关联键一致性测试 + 时间窗口全量回退测试 + PowerShell 外部命令测试基础设施"
  # === 测试步骤配置 ===
  steps:
    # O-1: 回退构造关联键完整性测试（对应 meta-rule #90）
    o1_fallback_key_completeness:
      enabled: true
      description: "回退构造的实体必须包含所有必需关联键"
      test_file: "tests/test_fallback_preserve_key.py"
      test_cases:
        - name: "test_pseudo_item_has_task_id"
          description: "回退构造的伪 item dict 必须包含 task_id"
          scan_files:
            - "src/xianyu_hunter/web/routes/api_ai.py"
            - "src/xianyu_hunter/infra/repo_events.py"
          required_keys: ["task_id", "seller_id"]
          pass_condition: "all_keys_present_in_fallback"
        - name: "test_fallback_no_silent_skip"
          description: "回退构造无 task_id 时下游价格区间查询不应被静默跳过"
          test_scenario: "构造无 task_id 的伪 item，调用 get_eval_payload_by_item，验证价格区间查询仍执行或抛出明确异常"
          pass_condition: "query_executed_or_explicit_exception"
        - name: "test_fallback_logs_missing_key"
          description: "回退构造关联键缺失时必须记录 WARNING 日志"
          pass_condition: "log_contains_WARNING_with_missing_key"

    # O-2: 时间窗口全量回退测试（对应 meta-rule #91）
    o2_time_window_fallback:
      enabled: true
      description: "时间窗口查询返回空时必须回退到全量查询"
      test_file: "tests/test_time_window_fallback.py"
      test_cases:
        - name: "test_30day_window_empty_fallback_to_full"
          description: "30 天窗口查询返回空时回退到 range_days=0 全量查询"
          test_scenario: "mock 数据库中商品数据时间超过 30 天，验证查询回退到全量"
          pass_condition: "fallback_query_executed_with_range_days_0"
        - name: "test_fallback_result_has_source_field"
          description: "全量回退结果应通过 source 字段标识来源"
          pass_condition: "result_has_source_field_equal_full_fallback"
        - name: "test_no_fallback_when_window_has_data"
          description: "窗口查询有数据时不触发全量回退"
          pass_condition: "no_fallback_query_executed"

    # O-3: PowerShell 外部命令测试基础设施（对应 meta-rule #92）
    o3_powershell_command_infra:
      enabled: true
      description: "PowerShell 环境下外部命令调用测试基础设施"
      # 为什么需要：测试脚本本身可能需要在 PowerShell 中执行 curl 等命令
      # 测试基础设施必须遵循 meta-rule #92，否则测试脚本自身会失败
      test_infra_checks:
        - name: "test_no_curl_alias_in_test_scripts"
          description: "测试脚本中不使用 curl 别名（必须用 curl.exe）"
          scan_globs: ["tests/**/*.ps1", ".trae/skills/**/*.md"]
          forbidden_pattern: "(?<!\\.exe)\\bcurl\\b"
          pass_condition: "no_match"
        - name: "test_json_body_via_file_in_test_scripts"
          description: "测试脚本中复杂 JSON 参数通过文件传递"
          scan_globs: ["tests/**/*.ps1"]
          forbidden_pattern: "-d\\s+['\"]\\{.*\\}['\"]"
          pass_condition: "no_match"
        - name: "test_command_length_under_limit"
          description: "测试脚本中单条命令长度不超过限制"
          scan_globs: ["tests/**/*.ps1"]
          max_length: 200
          pass_condition: "all_commands_under_limit"

    # O-4: 跨层一致性测试（后端回退构造 → 前端条件渲染）
    o4_cross_layer_consistency:
      enabled: true
      description: "后端回退构造的关联键与前端条件渲染的一致性"
      test_file: "tests/test_fallback_cross_layer.py"
      test_cases:
        - name: "test_backend_fallback_keys_match_frontend_render"
          description: "后端回退构造的关联键必须与前端条件渲染依赖的字段一致"
          backend_scan_files:
            - "src/xianyu_hunter/web/routes/api_ai.py"
          frontend_scan_files:
            - "frontend/src/pages/Evaluations/index.tsx"
          pass_condition: "backend_keys_subset_of_frontend_render_deps"
        - name: "test_frontend_handles_missing_key_gracefully"
          description: "前端在关联键缺失时应优雅降级（显示占位或隐藏元素），不报错"
          pass_condition: "no_uncaught_error_on_missing_key"

  # === 引用配置 ===
  refs:
    backend_rule: "B-REVIEW-251"
    backend_rule_2: "B-REVIEW-252"
    backend_rule_3: "B-REVIEW-253"
    frontend_rule: "F-REVIEW-206"
    meta_rule: "#90"
    meta_rule_2: "#91"
    meta_rule_3: "#92"
    dev_step: "step 254"
    dev_step_2: "step 255"
    dev_step_3: "step 256"
  # === 关键文件（修改后触发回归）===
  key_files:
    backend:
      - "src/xianyu_hunter/web/routes/api_ai.py"
      - "src/xianyu_hunter/infra/repo_events.py"
      - "src/xianyu_hunter/infra/repo_items.py"
    frontend:
      - "frontend/src/pages/Evaluations/index.tsx"
      - "frontend/src/pages/Evaluations/dimensionLabels.ts"
    test_infra:
      - "tests/test_fallback_preserve_key.py"
      - "tests/test_time_window_fallback.py"
      - "tests/test_fallback_cross_layer.py"
  # === 适用场景 ===
  applicable_scenarios:
    - "修改回退构造逻辑（伪 item、默认响应）"
    - "修改时间窗口查询逻辑"
    - "修改测试脚本中的 PowerShell 命令"
    - "B-REVIEW-251/252/253 或 F-REVIEW-206 审查违规"
    - "price_range 注入相关 Bug 修复后回归"
  # === 报告格式 ===
  report_format:
    title: "回退构造关联键一致性测试报告（模式 O）"
    sections:
      - "1. 回退构造关联键完整性验证（O-1）"
      - "2. 时间窗口全量回退验证（O-2）"
      - "3. PowerShell 测试基础设施验证（O-3）"
      - "4. 跨层一致性验证（O-4）"
      - "5. 发现的问题与修复建议（引用 meta-rule #90/#91/#92）"

# ============== 模式 P：评估去重验证测试 ==============
mode_p_eval_dedup_test:
  # 触发条件与配置引用见 SKILL.md 模式 P
  # 配套 meta-rules #95（UPSERT-DEDUP-DEFENSE）+ #94（DATA-QUALITY-PRE-ASSESSMENT）
  # 配套 B-REVIEW-256（UPSERT-DEDUP-DEFENSE）+ B-REVIEW-255（DATA-QUALITY-PRE-ASSESSMENT）

  key_files:
    backend:
      - "src/xianyu_hunter/infra/repo_events.py"           # upsert_eval_event 函数定义
      - "src/xianyu_hunter/modules/worker.py"              # eval 写入路径 1
      - "src/xianyu_hunter/web/routes/api_task_links.py"   # eval 写入路径 2
      - "src/xianyu_hunter/web/routes/api_evaluations.py"  # eval 写入路径 3
      - "src/xianyu_hunter/web/startup.py"                 # C-05 迁移 + 部分唯一索引

  eval_write_patterns:
    - "save_event"
    - "upsert_eval_event"
    - "eval.scored"

  dedup_unique_index_name: "idx_eval_scored_unique"
  dedup_unique_condition: "type = 'eval.scored'"

  steps:
    p1_upsert_logic:
      description: "验证所有 eval 写入路径使用 upsert 而非 save"
      test_cases:
        - "worker.py 调用 upsert_eval_event"
        - "api_task_links.py 调用 upsert_eval_event"
        - "api_evaluations.py 调用 upsert_eval_event"
      pass_condition: "所有写入路径均使用 upsert_eval_event"

    p2_unique_index:
      description: "验证部分唯一索引存在且条件正确"
      sql_check: "SELECT name, sql FROM sqlite_master WHERE type='index' AND name LIKE '%eval%'"
      pass_condition: "idx_eval_scored_unique 存在且含 WHERE type = 'eval.scored'"

    p3_migration_idempotent:
      description: "验证 C-05 迁移幂等性"
      pass_condition: "多次重启服务后 C-05 迁移不报错"

    p4_no_duplicate_records:
      description: "验证无重复 eval.scored 记录"
      sql_check: "SELECT task_id, item_id, COUNT(*) as cnt FROM events WHERE type='eval.scored' GROUP BY task_id, item_id HAVING cnt > 1"
      pass_condition: "查询结果为空（0 条重复）"

  refs:
    - "meta-rule #95 UPSERT-DEDUP-DEFENSE"
    - "meta-rule #94 DATA-QUALITY-PRE-ASSESSMENT"
    - "B-REVIEW-256 UPSERT-DEDUP-DEFENSE"
    - "B-REVIEW-255 DATA-QUALITY-PRE-ASSESSMENT"

  report_sections:
    - "1. upsert 逻辑状态（P-1）"
    - "2. 部分唯一索引状态（P-2）"
    - "3. 迁移幂等性状态（P-3）"
    - "4. 数据去重状态（P-4）"
    - "5. 发现的问题与修复建议（引用 meta-rule #95）"

# ============== 模式 Q：构建产物验证测试 ==============
mode_q_build_product_test:
  # 触发条件与配置引用见 SKILL.md 模式 Q
  # 配套 meta-rules #98（BUILD-ENVIRONMENT-TOOLCHAIN-CHECK）+ #100（WINDOWS-SCRIPT-ENCODING）
  # 配套 B-REVIEW-261 + B-REVIEW-260 / F-REVIEW-208

  key_files:
    backend:
      - "*.bat"                                # 构建脚本
      - "vite.config.ts"                       # Vite 配置
      - "package.json"                         # Node.js 依赖
    frontend:
      - "frontend/vite.config.ts"
      - "frontend/package.json"

  required_node_version: "18"                  # 最低 Node.js 主版本
  required_python_version: "3.10"              # 最低 Python 主版本

  # 构建产物中期望存在的关键字符串（用于验证 chunk 完整性）
  # 所有参数通过配置文件管理，不硬编码
  expected_chunk_patterns:
    - "XianyuHunter"                           # 应用名（应在 index.html 中）
    - "isMobile"                               # 移动端检测
    - "BrowserRouter"                          # 路由

  # 构建脚本 PATH 设置检测模式
  path_set_pattern: "set PATH=|PATH%="

  # 非 ASCII 字符检测（BAT 文件不应包含）
  non_ascii_pattern: "[^\\x00-\\x7F]"

  steps:
    q1_toolchain_version:
      description: "验证工具链版本符合要求"
      commands:
        - "node --version"
        - "python --version"
      pass_condition: "Node >= required_node_version, Python >= required_python_version"

    q2_build_script:
      description: "验证构建脚本合规性（PATH 设置、版本打印、无乱码）"
      checks:
        - "构建脚本顶部设置 PATH 优先级"
        - "构建前打印 node --version"
        - "BAT 文件无非 ASCII 字符"
      pass_condition: "所有检查通过"

    q3_build_product:
      description: "验证构建产物完整性"
      checks:
        - "build_output_dir 目录存在且有时间戳最新的文件"
        - "index.html 大小在 expected_html_size_range 内"
        - ".js chunk 包含 expected_chunk_patterns 中的关键字符串"
      pass_condition: "所有检查通过"

    q4_e2e_verification:
      description: "端到端验证（页面可访问、核心功能正常）"
      checks:
        - "根路径返回 302/200"
        - "SPA 路径返回 200"
        - "核心页面正常渲染"
      pass_condition: "所有检查通过"

  refs:
    - "meta-rule #98 BUILD-ENVIRONMENT-TOOLCHAIN-CHECK"
    - "meta-rule #100 WINDOWS-SCRIPT-ENCODING"
    - "B-REVIEW-261 BUILD-ENVIRONMENT-TOOLCHAIN-CHECK"
    - "B-REVIEW-260 WINDOWS-SCRIPT-ENCODING"
    - "F-REVIEW-208 BUILD-ENVIRONMENT-TOOLCHAIN-FRONTEND"

  report_sections:
    - "1. 工具链版本状态（Q-1）"
    - "2. 构建脚本状态（Q-2）"
    - "3. 构建产物状态（Q-3）"
    - "4. 端到端验证状态（Q-4）"
    - "5. 发现的问题与修复建议（引用 meta-rule #98/#100）"

# ===== 模式 R：性能优化回归测试（v1.8.0 新增）=====
# 对应 meta-rule #93（性能优化量化验证）/ #94（缓存TTL合理性校验）
# 对应 PS-010~024（performance-and-security-patterns.md）
# 对应 B-REVIEW-262~267 / F-REVIEW-211~213
mode_r_performance_test:
  enabled: true
  description: "性能优化回归测试：验证8类优化方案（SSE/缓存/SQL下推/list+count/优先级锁/useMemo/run_in_executor/批量upsert）的运行时效果"

  # --- 关键文件（变更后触发回归测试）---
  key_files:
    backend:
      - "src/xianyu_hunter/web/routes/api_task_links.py"
      - "src/xianyu_hunter/infra/repo_links.py"
      - "src/xianyu_hunter/container.py"
      - "src/xianyu_hunter/modules/worker.py"
    frontend:
      - "frontend/src/api/task.ts"
      - "frontend/src/pages/Tasks/TaskList.tsx"

  # --- SSE 流式响应验证 ---
  sse_test:
    enabled: true
    # SSE 接口路径（从 web_process 配置拼接）
    endpoint_pattern: "/api/tasks/{task_id}/links/live"
    # 预期阶段事件序列（按执行顺序）
    expected_stages:
      - "checking_cache"
      - "checking_cookies"
      - "acquiring_lock"
      - "searching"
      - "filtering"
      - "writing_db"
      - "done"
    # 预期响应头
    expected_content_type: "text/event-stream"
    expected_transfer_encoding: "chunked"
    # 前置检查应返回的 HTTP 错误码（非 SSE 事件）
    precheck_status_codes: [404, 400, 403]
    # SSE 超时（秒）
    timeout_seconds: 60

  # --- 缓存命中验证 ---
  cache_test:
    enabled: true
    # 缓存 TTL（秒）——必须与代码中的 _LIVE_CACHE_TTL 一致
    ttl_seconds: 60
    # 缓存命中响应时间阈值（ms）——低于此值视为命中
    hit_threshold_ms: 10
    # 被缓存操作的平均耗时阈值（ms）——高于此值才值得缓存
    operation_cost_threshold_ms: 1000
    # 采样次数（计算命中率）
    sample_count: 5
    # 空结果策略：empty_result_cache=false 表示空结果不缓存
    empty_result_cache: false

  # --- SQL 层过滤验证 ---
  sql_filter_test:
    enabled: true
    # 价格区间（用于验证 SQL 过滤）
    price_min: 1500
    price_max: 2000
    # 价格容忍度（浮点比较）
    price_tolerance: 0.01
    # DB 查询日志中应包含的关键字
    expected_sql_keywords:
      - "json_extract"
      - "cast"
    # DB 查询日志路径
    db_log_file: "logs/xianyu_hunter.log"

  # --- list+count 合并查询验证 ---
  list_count_test:
    enabled: true
    # 预期 DB 往返次数（合并查询应为 1）
    expected_db_round_trips: 1
    # 分页参数
    page_size: 20
    # 验证 total 与 list 长度一致（在非末页时）
    verify_total_consistency: true

  # --- 优先级锁验证 ---
  priority_lock_test:
    enabled: true
    # high 优先级最大等待时间（ms）
    high_max_wait_ms: 5000
    # low 优先级让出延迟（ms）——应与代码中的 yield_delay 一致
    yield_delay_ms: 3000
    # high/low 标识
    high_priority: "high"
    low_priority: "low"

  # --- 前端 useMemo 验证 ---
  usememo_test:
    enabled: true
    # 验证方式：performance.mark/measure
    verify_method: "performance_api"
    # 派生计算选择器（用于 hook performance.mark）
    derived_calc_selector: "filteredItems|sortedItems|stats"
    # 依赖项变更后应重新计算的次数
    expected_recompute_on_deps_change: 1

  # --- 性能指标对比表格模板 ---
  metrics_comparison:
    - metric: "SSE 响应时间"
      before: "4240ms"
      after: "<10ms（缓存命中）"
    - metric: "缓存命中率"
      before: "0%"
      after: ">80%"
    - metric: "DB 查询往返次数（list+count）"
      before: "2"
      after: "1"
    - metric: "SQL 过滤方式"
      before: "Python 层全量过滤"
      after: "SQL 层 json_extract+cast"
    - metric: "批量写入 IO 次数"
      before: "N 次（逐条 commit）"
      after: "1 次（单事务 commit）"
    - metric: "事件循环阻塞"
      before: "同步 DB 调用阻塞"
      after: "run_in_executor 异步"
    - metric: "优先级锁等待"
      before: "15-20s（普通 Lock）"
      after: "<5s（优先级锁让出）"

  refs:
    - "meta-rule #93 PERFORMANCE-QUANTITATIVE-VERIFICATION"
    - "meta-rule #94 CACHE-TTL-RATIONALITY-CHECK"
    - "PS-010 async 函数中同步 DB 调用必须用 run_in_executor"
    - "PS-011 优先级锁设计"
    - "PS-012 批量写入必须用单事务批 upsert"
    - "PS-013 分页接口 list+count 必须合并查询"
    - "PS-014 SQL 层过滤优先于 Python 层过滤"
    - "PS-015 缓存 TTL 必须大于被缓存操作平均耗时"
    - "PS-016 缓存策略必须区分空结果与非空结果"
    - "PS-017 SSE 前置检查返回 HTTP 错误码"
    - "PS-018 SSE 阶段事件必须映射真实执行链路"
    - "PS-019 需要自定义 Header 的 SSE 必须用 fetch+ReadableStream"
    - "PS-020 列表派生计算必须用 useMemo"
    - "B-REVIEW-262 ASYNC-SYNC-DB-RUN-IN-EXECUTOR"
    - "B-REVIEW-263 BATCH-UPSERT-SINGLE-COMMIT"
    - "B-REVIEW-264 SQL-FILTER-PUSHDOWN"
    - "B-REVIEW-265 LIST-COUNT-MERGED-QUERY"
    - "B-REVIEW-266 PRIORITY-LOCK-YIELD"
    - "B-REVIEW-267 CACHE-TTL-GT-OPERATION-COST"
    - "F-REVIEW-211 SSE-PRECHECK-HTTP-ERROR-CODE"
    - "F-REVIEW-212 LIST-DERIVED-USEMEMO"
    - "F-REVIEW-213 SSE-FETCH-READABLESTREAM"

  report_sections:
    - "1. SSE 流式响应状态（R-1）"
    - "2. 缓存命中状态（R-2）"
    - "3. SQL 层过滤状态（R-3）"
    - "4. list+count 合并状态（R-4）"
    - "5. 优先级锁状态（R-5）"
    - "6. useMemo 状态（R-6）"
    - "7. 性能优化前/后指标对比（R-7）"

# ============== 模式 U：SPA 白屏回归测试（v1.9.0 新增） ==============
# 对应 meta-rule #95（SPA-WHITE-SCREEN-DEFENSE）
# 对应 F-REVIEW-214~219 / step 254-261
# 复盘来源：2026-07-22 间歇性白屏 Bug 修复（5 类根因）
# 验证 React SPA 渲染容错体系完整性：全局 ErrorBoundary + lazyRetry 包装 + 路由级 ErrorBoundary + API 防御性兜底 + 401 拦截器防抖
# 所有参数通过此节点管理，不硬编码
mode_u_spa_white_screen_test:
  enabled: true
  error_boundary_check:
    scan_command: "grep -c \"<ErrorBoundary\" frontend/src/App.tsx"
    required_files:
      - "frontend/src/components/ErrorBoundary.tsx"
    wrapper_location: "App.tsx"
    min_match_count: 1
  lazy_retry_check:
    scan_command: "grep \"\\blazy(\" frontend/src/ | grep -v lazyRetry"
    required_files:
      - "frontend/src/utils/lazyRetry.tsx"
    max_retries: 3
    retry_storage_key_prefix: "__retry_"
    chunk_error_patterns:
      - "Failed to fetch dynamically imported module"
      - "Loading chunk \\d+ failed"
      - "Loading CSS chunk \\d+ failed"
  route_error_boundary_check:
    scan_command: "grep \"resetKeys\" frontend/src/components/layout/MainLayout.tsx"
    wrapper_location: "MainLayout.tsx"
    reset_key_strategy: "location.pathname"
    allowed_reset_key_types:
      - "string"
      - "number"
    forbidden_reset_key_types:
      - "object"
      - "array"
  api_array_defense_check:
    scan_command: "grep -E \"\\b(res|data|response)\\.(items|tables|list|records|data|results)\\.\" frontend/src/"
    array_field_patterns:
      - "items"
      - "tables"
      - "list"
      - "records"
      - "data"
      - "results"
    required_fallback_pattern: "|| []"
  http_401_debounce_check:
    scan_command: "grep \"401\" frontend/src/api/client.ts"
    debounce_flag: "isRedirecting"
    required_redirect_method: "replace"
    forbidden_redirect_method: "href"
  unit_test:
    error_boundary_test_command: "npx vitest run frontend/src/components/__tests__/ErrorBoundary.test.tsx"
    lazy_retry_test_command: "npx vitest run frontend/src/utils/__tests__/lazyRetry.test.tsx"
    error_boundary_test_cases:
      - "正常渲染不触发错误界面"
      - "子组件抛错显示错误界面"
      - "点击重试按钮清除错误状态"
      - "resetKeys 变化自动重置错误状态"
      - "onError 回调被正确调用"
      - "自定义 fallback 替代默认 UI"
    lazy_retry_test_cases:
      - "isChunkLoadError 识别各类 chunk 错误"
      - "非 chunk 错误不识别"
      - "正常加载不触发重试"
      - "chunk 失败自动重试到上限"
      - "LazyErrorBoundary 兜底渲染"
      - "resetKey 变化触发重置"
    antd_chinese_button_regex: "getByRole('button', { name: /文\\s*案/ })"
    forbidden_antd_button_match: "getByText('文案')"
  key_files:
    frontend:
      - "frontend/src/components/ErrorBoundary.tsx"
      - "frontend/src/utils/lazyRetry.tsx"
      - "frontend/src/App.tsx"
      - "frontend/src/components/layout/MainLayout.tsx"
