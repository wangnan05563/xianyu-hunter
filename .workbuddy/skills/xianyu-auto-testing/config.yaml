# ============== 测试验证三档机制（跨模式通用） ==============
# 对应复盘规范集 C3 / D1 / D2
# 复盘来源：
#   - 2026-07 完整 pytest 测试集（1621 个测试）在 CPU 99% 过载环境下超时
#   - 改用直接 import 测试 5 个改动文件，5/5 通过
#   - PowerShell Tee-Object 缓冲导致日志文件为空，改用 Start-Process -RedirectStandardOutput 绕过
# 适用场景：所有涉及测试验证的模式（A~X）在执行前必须按此机制选择验证档位
# 不适用场景：纯静态扫描类测试（如模式 F/G/H 的 grep 扫描）无需三档机制
tiered_test_verification:
  _doc: "测试验证三档机制配置：根据系统资源与改动类型选择 Tier 1/2/3 验证档位，避免过载环境下完整测试集超时"

  # === 档位定义 ===
  tiers:
    tier_1:
      name: "完整测试集"
      description: "pytest tests/ + tsc --noEmit 全量验证"
      # 适用改动类型（D1 契约）
      applicable_change_types:
        - "refactor"          # 重构类改动必须运行 Tier 1
      # 执行命令模板（{python} 占位符）
      pytest_command: "{python} -m pytest tests/ -v --timeout={timeout_seconds}"
      tsc_command: "npx tsc --noEmit"
      # 预期最大执行时长（秒），超过则触发降级检查
      max_duration_sec: 600
      # 历史参考：完整测试集用例数（用于评估执行规模）
      historical_full_test_count: 1621

    tier_2:
      name: "直接 import 测试"
      description: "系统资源受限时，仅验证改动文件的核心功能（直接 import 改动模块）"
      applicable_change_types:
        - "bugfix"            # Bug 修复运行 Tier 2 即可
      # import 测试脚本模板（{python}/{changed_file} 占位符）
      import_test_template: "{python} -c \"import ast; ast.parse(open(r'{changed_file}', encoding='utf-8').read()); print('OK: {changed_file}')\""
      # 改动文件列表来源：从 git diff 动态获取
      changed_files_source: "git_diff"
      # 单文件 import 超时（秒）
      per_file_timeout_sec: 10

    tier_3:
      name: "改动文件 5/5 验证"
      description: "最小验证，仅验证改动的文件能正确 import（语法+导入链路）"
      applicable_change_types:
        - "feature"           # 新增功能运行 Tier 3 即可
      # 最小验证文件数（D1 契约：改动文件 5/5 验证）
      min_files_to_verify: 5
      # 当改动文件数 < min_files_to_verify 时，验证全部改动文件
      verify_all_when_less_than_threshold: true

  # === 降级触发条件（C3 规范）===
  # 为什么需要降级：CPU 过载时完整测试集会超时无输出，浪费 agent 轮次
  downgrade_triggers:
    # CPU 使用率触发：持续 duration_sec 秒超过 cpu_percent → 降级到 Tier 2
    high_cpu:
      enabled: true
      cpu_percent: 90
      duration_sec: 30
      downgrade_to: "tier_2"
    # 文件 IO 延迟触发：单次文件读写延迟 > latency_sec → 降级到 Tier 2
    high_io_latency:
      enabled: true
      latency_sec: 5
      downgrade_to: "tier_2"
    # 级联降级：Tier 2 失败 → 降级到 Tier 3
    tier_2_failure:
      enabled: true
      downgrade_to: "tier_3"

  # === 测试覆盖契约（D1 规范）===
  coverage_contract:
    # 改动类型 → 最低档位要求
    change_type_to_min_tier:
      refactor: "tier_1"   # 重构类改动必须运行 Tier 1 完整测试集
      bugfix: "tier_2"     # Bug 修复运行 Tier 2 直接 import 测试即可
      feature: "tier_3"   # 新增功能运行 Tier 3 改动文件验证即可
    # 强制升级条件：即使改动类型为 feature，触及以下关键文件时升级到 Tier 1
    force_upgrade_files:
      - "src/xianyu_hunter/web/startup.py"        # 启动文件
      - "src/xianyu_hunter/container.py"           # 依赖注入容器
      - "src/xianyu_hunter/core/scheduler.py"      # 核心调度器
    force_upgrade_to: "tier_1"

  # === 测试环境隔离（D2 规范）===
  environment_isolation:
    # 测试前必须检查环境资源（CPU/内存/磁盘）
    pre_check_resources: true
    # 长任务必须重定向到日志文件
    long_task_redirect_required: true
    # 测试结果必须保存到指定路径
    result_save_path: "test-results/"
    # 资源检查命令模板（PowerShell）
    resource_check_commands:
      cpu: "Get-Counter '\\Processor(_Total)\\% Processor Time' -SampleInterval 1 -MaxSamples 3 | Select-Object -ExpandProperty CounterSamples | Select-Object -ExpandProperty CookedValue"
      memory: "Get-Counter '\\Memory\\Available MBytes' -SampleInterval 1 -MaxSamples 1 | Select-Object -ExpandProperty CounterSamples | Select-Object -ExpandProperty CookedValue"
      disk: "Get-Counter '\\PhysicalDisk(_Total)\\Avg. Disk sec/Transfer' -SampleInterval 1 -MaxSamples 1 | Select-Object -ExpandProperty CounterSamples | Select-Object -ExpandProperty CookedValue"

  # === 历史失败案例（必须真实引用，用于警示）===
  historical_failures:
    - id: "HF-001"
      date: "2026-07"
      scenario: "完整 pytest 测试集（1621 个测试）在 CPU 99% 过载环境下超时"
      root_cause: "CPU 持续 99% 占用导致 pytest 调度饥饿，无输出超 10 分钟"
      resolution: "改用直接 import 测试 5 个改动文件，5/5 通过"
      lesson: "过载环境下完整测试集不可靠，必须降级到 Tier 2"
    - id: "HF-002"
      date: "2026-07"
      scenario: "PowerShell Tee-Object 缓冲导致日志文件为空"
      root_cause: "Tee-Object 是 sink cmdlet，必须等待所有输入才能输出，长任务下日志文件长时间为空"
      resolution: "改用 Start-Process -RedirectStandardOutput 绕过缓冲"
      lesson: "长任务日志输出禁用 sink cmdlet，详见 long_task_logging 配置段"

# ============== 长任务日志输出规范（B1 规范） ==============
# 对应复盘规范集 B1
# 适用场景：执行时长 > long_task_threshold_sec 的命令（pytest/sonar-scanner/playwright test）
# 不适用场景：执行时长 < long_task_threshold_sec 的短命令（直接输出即可）
long_task_logging:
  _doc: "PowerShell 长任务日志输出规范：避免 sink cmdlet 缓冲导致日志文件为空"

  # 长任务判定阈值（秒）：执行时长超过此值即视为长任务
  long_task_threshold_sec: 30

  # === 禁用模式（B1 规范）===
  # 为什么禁用：sink cmdlet 必须缓冲所有输入才能输出，长任务下日志文件长时间为空
  forbidden_patterns:
    - pattern: "| Select-Object -Last N"
      reason: "Select-Object 是 sink cmdlet，必须缓冲所有输入才能输出最后 N 行"
    - pattern: "Tee-Object"
      reason: "Tee-Object 是 sink cmdlet，必须缓冲所有输入才能输出（历史失败案例 HF-002）"
    - pattern: "| More"
      reason: "More 是分页 sink cmdlet，必须缓冲所有输入"

  # === 推荐模式（B1 规范）===
  recommended_patterns:
    - name: "Start-Process 重定向"
      # 为什么首选：完全绕过 PowerShell 管道缓冲，子进程直接写文件
      command_template: "Start-Process -FilePath '{python}' -ArgumentList '{args}' -RedirectStandardOutput '{output_file}' -RedirectStandardError '{error_file}' -NoNewWindow -Wait"
      use_case: "需要精确控制子进程且避免任何管道缓冲时"
    - name: "Out-File 重定向"
      # 为什么次选：流式写入（非 sink cmdlet），但仍有管道开销
      command_template: "{command} 2>&1 | Out-File -FilePath '{output_file}' -Encoding {output_encoding}"
      use_case: "需要合并 stderr 且控制编码时（避免 CLIXML）"
    - name: "直接重定向"
      # 为什么备选：最简单，但无法控制编码（可能 CLIXML）
      command_template: "{command} > '{output_file}' 2>&1"
      use_case: "对编码无要求且命令简单时"

  # === 日志查看方式（B1 规范）===
  # 为什么用 Get-Content 而非 cat/type：支持 -Tail 和 -Wait 实时跟踪
  view_commands:
    tail: "Get-Content -Tail {n} '{output_file}'"
    follow: "Get-Content -Wait '{output_file}'"

  # === 适用工具列表 ===
  applicable_tools:
    - "pytest"
    - "sonar-scanner"
    - "playwright test"
    - "npm run build"
    - "tsc --noEmit"

# ============== 系统资源过载容错（B2 规范） ==============
# 对应复盘规范集 B2
# 适用场景：长任务执行前的资源检查与过载容错
# 不适用场景：已确定资源充足时的快速测试
system_resource_monitoring:
  _doc: "系统资源过载容错配置：长任务前检查 CPU/内存/磁盘，过载时降级测试档位"

  # === 资源检查项 ===
  checks:
    cpu:
      # CPU 使用率阈值（百分比），超过则视为过载
      threshold_percent: 90
      # 持续时间阈值（秒），超过阈值持续此时长才判定为过载
      duration_sec: 30
      # 检查命令（PowerShell）
      check_command: "Get-Counter '\\Processor(_Total)\\% Processor Time' -SampleInterval 1 -MaxSamples 3 | Select-Object -ExpandProperty CounterSamples | Select-Object -ExpandProperty CookedValue"
      # 过载时的处理策略
      on_overload: "downgrade_to_tier_2"
    memory:
      # 可用内存阈值（MB），低于此值视为过载
      threshold_available_mb: 512
      check_command: "Get-Counter '\\Memory\\Available MBytes' -SampleInterval 1 -MaxSamples 1 | Select-Object -ExpandProperty CounterSamples | Select-Object -ExpandProperty CookedValue"
      on_overload: "downgrade_to_tier_2"
    disk_io:
      # 磁盘 IO 延迟阈值（秒），超过此值视为过载
      threshold_latency_sec: 5
      check_command: "Get-Counter '\\PhysicalDisk(_Total)\\Avg. Disk sec/Transfer' -SampleInterval 1 -MaxSamples 1 | Select-Object -ExpandProperty CounterSamples | Select-Object -ExpandProperty CookedValue"
      on_overload: "downgrade_to_tier_2"

  # === 进程监控（B2 规范）===
  # 为什么监控 Top 10 进程：定位资源占用源头，必要时可建议用户关闭无关进程
  top_processes_command: "Get-Process | Sort-Object CPU -Descending | Select-Object -First 10"
  top_processes_count: 10

  # === 容错策略 ===
  fault_tolerance:
    # 完整测试集超时时改用直接 import 测试验证改动文件
    full_test_timeout_fallback: "direct_import_test"
    # 直接 import 测试失败时改用语法检查（最小验证）
    import_test_failure_fallback: "syntax_check_only"
    # 语法检查命令模板（{changed_file} 占位符）
    syntax_check_command: "{python} -c \"import ast; ast.parse(open(r'{changed_file}', encoding='utf-8').read()); print('SYNTAX OK: {changed_file}')\""

# ============== 模式 Y：前端韧性回归测试（v2.2.0 新增） ==============
# 对应检查点：xianyu-frontend-code-review v4.62.0 F-REVIEW-227~232
# 配套编码规范：coding-standards v1.3 §3.10-3.15
# 适用场景：Markdown 渲染/SSE 流式响应/定时器/可访问性相关代码修改后回归验证
# 不适用场景：纯后端代码修改（应改用模式 Z）；非 React 项目
mode_y_frontend_resilience_test:
  _doc: "前端韧性六项检查点回归测试配置（F-REVIEW-227~232）"

  # === 关键文件（相对 frontend_dir）===
  # 为什么列这些文件：智能客服相关代码集中了所有六项检查点的风险
  key_files:
    - "src/pages/Chatbot/index.tsx"
    - "src/pages/Chatbot/components/AssistantMessage.tsx"
    - "src/pages/Chatbot/components/CodeBlock.tsx"
    - "src/components/MarkdownRenderer.tsx"
    - "src/api/sse.ts"
    - "src/hooks/useSSE.ts"

  # === F-REVIEW-227 Markdown 预处理代码块保护 ===
  markdown_check:
    severity: CRITICAL
    # 检测信号：对 Markdown 字符串直接做 replace
    detection_patterns:
      - "\\.replace\\(.*content"
      - "content\\.replace"
      - "processedContent"
    # 代码块分割正则
    codeblock_split_pattern: '(```[\\s\\S]*?```|`[^`]+`)'
    # 必须先分割再替换
    require_split_before_replace: true

  # === F-REVIEW-228 React render 阶段副作用禁令 ===
  react_render_check:
    severity: CRITICAL
    # 检测信号：函数组件主体内的 .current = 赋值
    detection_patterns:
      - "\\.current\\s*="
    # 必须在 useEffect/useLayoutEffect/事件回调内
    require_in_effect_or_handler: true
    # StrictMode 双调用测试
    require_strict_mode_test: true

  # === F-REVIEW-229 SSE 事件运行时类型校验 ===
  sse_type_check:
    severity: CRITICAL
    # 禁止的 as 断言模式
    forbidden_patterns:
      - "JSON\\.parse.*as\\s"
      - "event\\.data.*as\\s"
      - "\\.follow_ups.*as\\s"
    # 必须用 zod safeParse
    require_zod_safe_parse: true
    # 校验失败时降级返回 fallback 值
    require_fallback_on_invalid: true

  # === F-REVIEW-230 定时器清理与竞态防护 ===
  timer_check:
    severity: HIGH
    # 检测信号：setTimeout/setInterval
    detection_patterns:
      - "setTimeout"
      - "setInterval"
    # 必须有对应 cleanup
    require_cleanup_pair: true
    # 连续触发必须用 useRef 存储 ID
    require_ref_for_consecutive_trigger: true
    # 快速连续触发测试次数
    consecutive_trigger_test_count: 5

  # === F-REVIEW-231 交互元素可访问性 ===
  a11y_check:
    severity: MEDIUM
    # 检测信号：非原生交互元素
    detection_patterns:
      - "<div.*onClick"
      - "<span.*onClick"
      - "<li.*onClick"
    # 必须三件套齐全
    require_three_piecemeal: [tabIndex, role, onKeyDown]
    # 键盘测试键列表
    keyboard_test_keys: [Tab, Enter, Space]
    # 优先用原生 button
    prefer_native_button: true

  # === F-REVIEW-232 流式响应 onComplete 数据完整性 ===
  oncomplete_check:
    severity: HIGH
    # 检测信号：onComplete 回调
    detection_patterns:
      - "onComplete"
      - "content\\.length"
    # 持久化条件必须基于"任一产出非空"
    require_any_output_check: true
    # 禁止仅检查主回答
    forbid_main_only_check: true
    # 测试场景：主回答为空但有 follow_ups
    test_empty_main_with_followups: true

  # === vitest 命令参数 ===
  vitest_args: "tests/chatbot tests/resilience --reporter=verbose"

# ============== 模式 Z：LLM 治理回归测试（v2.2.0 新增） ==============
# 对应检查点：xianyu-backend-code-review v4.62.0 B-REVIEW-291~294
# 配套编码规范：coding-standards v1.3 §2.21-2.24
# 适用场景：rag_engine/orchestrator 等 LLM 多调用代码修改后回归验证
# 不适用场景：纯前端代码修改（应改用模式 Y）；单次 LLM 调用代码
mode_z_llm_governance_test:
  _doc: "LLM 多调用治理四项检查点回归测试配置（B-REVIEW-291~294）"

  # === 关键文件（相对 backend_dir）===
  # 为什么列这些文件：所有 LLM 多调用治理风险点集中在此
  key_files:
    - "modules/chatbot/rag_engine.py"
    - "modules/chatbot/orchestrator.py"
    - "modules/chatbot/budget.py"
    - "modules/chatbot/llm_client.py"

  # === 附加 LLM 调用方法名清单 ===
  # 为什么列这些方法名：grep 命中即触发预算/超时/解析/一致性审查
  aux_call_methods:
    - "generate_follow_ups"
    - "generate_title"
    - "generate_tags"
    - "generate_summary"

  # === B-REVIEW-291 附加调用预算与用量闭环 ===
  budget_check:
    severity: CRITICAL
    # 附加调用前必须有 check_budget
    require_check_budget: true
    # 附加调用后必须有 _record_llm_usage
    require_record_usage: true
    # 必须复用主调用的 BudgetContext
    require_shared_budget_context: true
    # 预算超限测试场景
    test_budget_exceeded: true
    # 预算上下文传递字段
    budget_context_fields: [user_id, session_id, request_id]

  # === B-REVIEW-292 附加调用独立超时 ===
  timeout_check:
    severity: CRITICAL
    # 必须用 asyncio.wait_for
    require_wait_for: true
    # 主调用默认超时（秒）
    main_call_timeout_sec: 30
    # 附加调用默认超时（秒）
    aux_call_timeout_sec: 10
    # 附加超时必须 < 主调用超时
    require_aux_less_than_main: true
    # 超时降级测试
    test_timeout_degrade: true
    # 超时降级返回值
    degrade_return_value: []

  # === B-REVIEW-293 响应结构化解析 ===
  parse_check:
    severity: CRITICAL
    # 禁止的正则提取模式
    forbidden_patterns:
      - "re\\.search.*\\\\\\{.*\\\\\\}"
      - "re\\.findall.*\\\\\\{.*\\\\\\}"
      - "eval\\("
    # 必须用 json.loads 或 pydantic.model_validate_json
    require_json_loads: true
    # 必须做类型校验
    require_type_validation: true
    # 必须剥离代码块
    require_codeblock_strip: true
    # 畸形响应测试场景
    test_malformed_responses:
      - "codeblock_wrapped_json"
      - "nested_json"
      - "malformed_json"
      - "empty_response"

  # === B-REVIEW-294 多调用一致性 ===
  consistency_check:
    severity: WARNING
    # 异常处理必须与主调用一致
    require_consistent_except: true
    # 日志格式必须与主调用一致
    require_consistent_log_format: true
    # 降级策略必须与主调用一致
    require_consistent_degradation: true
    # 附加异常不冒泡到主调用
    require_aux_exception_catch: true
    # 异常冒泡测试
    test_exception_propagation: true

  # === pytest 命令参数 ===
  pytest_args: "tests/test_rag_engine.py tests/test_orchestrator.py tests/test_llm_governance.py -v"

# ============================================================================
# v2.3.0 新增：模式 AA - 资源创建幂等性与状态闭环回归测试（第八轮复盘落地）
# 配套：xianyu-hunter-dev 规范 31-32 + coding-standards v1.3 §2.25-2.26
# 后端联动：xianyu-backend-code-review v4.64.0 B-REVIEW-313~315
# 前端联动：xianyu-frontend-code-review v4.63.0 F-REVIEW-233~235
# ============================================================================

mode_aa_idempotent_resource_creation_test:
  _doc: "资源创建幂等性与状态闭环六项检查点回归测试配置（B-REVIEW-313~315 + F-REVIEW-233~235）"

  # === 关键文件（相对项目根目录）===
  # 为什么列这些文件：所有资源创建幂等性与状态闭环风险点集中在此
  key_files:
    backend:
      - "src/xianyu_hunter/web/routes/api_anticrawl.py"
      - "src/xianyu_hunter/modules/login_orchestrator.py"
    frontend:
      - "frontend/src/api/anticrawl.ts"
      - "frontend/src/api/types.ts"
      - "frontend/src/pages/AntiCrawl/index.tsx"

  # === B-REVIEW-313 资源创建接口幂等性 ===
  backend_idempotent_check:
    severity: CRITICAL
    # 资源创建类路由模式
    route_patterns:
      - "/start"
      - "/create"
      - "/register"
      - "/launch"
    # 适用路由关键字（路由路径必须包含这些关键字才触发检查）
    applicable_route_keywords:
      - "session"
      - "task"
      - "connection"
    # 必须的响应字段
    required_response_fields:
      - "ok"
      - "already_active"
      - "message"
    # 禁止用 ok:False 表达已存在
    forbidden_failure_for_existing: true
    # 必须的测试用例后缀
    required_test_suffixes:
      - "_already_active"
      - "_already_exists"
      - "_idempotent"
    # 检测信号
    detection_signals:
      - "路由返回 ok:False 表达已存在 → 违规"
      - "路由无 already_active 字段 → 违规"
      - "缺少 _already_active 单元测试 → 违规"
    applicable_scenarios:
      - "资源创建/启动/注册接口"
      - "网络重试场景"
      - "前端启动/恢复按钮后端"
    inapplicable_scenarios:
      - "纯查询接口（天然幂等）"
      - "计数器递增"
      - "一次性副作用（如发短信验证码，需用 token 防重）"

  # === B-REVIEW-314 OperationResult 响应结构契约 ===
  operation_result_check:
    severity: HIGH
    # 写操作路由模式
    write_operation_patterns:
      - "/start"
      - "/stop"
      - "/create"
      - "/update"
      - "/delete"
      - "/register"
    # 必填字段
    required_fields:
      - "ok"
    # 可选字段（幂等标志 + 错误信息 + 消息）
    optional_fields:
      - "already_active"
      - "already_exists"
      - "error"
      - "error_code"
      - "detail"
      - "message"
      - "affected_id"
      - "warnings"
    # 禁止的非契约字段
    forbidden_extra_fields:
      - "msg"
      - "success"
      - "result"
    # OperationResult 模型定义路径
    model_definition_path: "src/xianyu_hunter/web/routes/api_anticrawl.py"
    detection_signals:
      - "写操作响应缺 ok 字段 → 违规"
      - "响应包含 msg/success 等非契约字段 → 违规"
    applicable_scenarios:
      - "所有写操作响应"
      - "后端响应结构变更同步检查"
    inapplicable_scenarios:
      - "纯查询接口（用专用 DTO）"
      - "流式响应（SSE/WebSocket，用专用 schema）"

  # === B-REVIEW-315 前端状态刷新闭环（后端侧）===
  frontend_sync_check:
    severity: HIGH
    # 前端 types.ts 文件路径
    frontend_types_file: "frontend/src/api/types.ts"
    # 必须同步检查
    required_sync_check: true
    # 后端响应 grep 模式
    backend_response_grep_patterns:
      - "JSONResponse"
      - "return.*ok.*True"
      - "return.*ok.*False"
    # 前端 usage grep 模式
    grep_frontend_usage_patterns:
      - "interface OperationResult"
      - "type OperationResult"
      - "already_active"
    detection_signals:
      - "后端响应有 already_active 但前端 types.ts 无此字段 → 违规"
      - "API 函数返回类型与后端响应模型不匹配 → 违规"
    applicable_scenarios:
      - "后端响应字段变更同步"
      - "新增 API 端点"
      - "字段重命名/废弃全链路同步"
    inapplicable_scenarios:
      - "前端内部状态类型（无后端对应）"
      - "第三方 SDK 类型"

  # === F-REVIEW-233 前端 async handler 三分支完整性 ===
  async_handler_check:
    severity: CRITICAL
    # async handler 命名模式
    handler_patterns:
      - "handleStart"
      - "handleStop"
      - "handleCreate"
      - "handleUpdate"
      - "handleDelete"
      - "handleResume"
      - "handlePause"
      - "handleLaunch"
      - "handleRegister"
    # 状态刷新函数命名模式
    refresh_function_patterns:
      - "load"
      - "refresh"
      - "mutate"
      - "refetch"
    # 三分支都必须调用 loadXxx 刷新状态
    require_load_in_all_branches: true
    # else 分支禁止固定失败文案
    require_specific_error_in_else: true
    # catch 分支必须用 extractApiError
    require_extract_api_error_in_catch: true
    detection_signals:
      - "else 分支显示 message.error('启动失败') 等固定文案 → 违规"
      - "catch 分支无 loadXxx 调用 → 违规"
      - "success 分支无 loadXxx 刷新 → 违规"
    applicable_scenarios:
      - "所有触发网络请求的前端 async 事件 handler"
      - "资源创建/启动/停止/恢复类按钮 onClick"
      - "表单提交 onFinish handler"
    inapplicable_scenarios:
      - "纯查询的 loadXxx 函数"
      - "不发起网络请求的本地状态变更"
      - "防抖/节流的中间函数"

  # === F-REVIEW-234 API 函数返回类型契约 ===
  api_return_type_check:
    severity: HIGH
    # 资源创建类 API 必须使用的返回类型
    required_return_type: "OperationResult"
    # 资源创建类 API 函数命名模式
    api_function_patterns:
      - "start"
      - "create"
      - "register"
      - "launch"
      - "resume"
    # 必须包含的幂等标志字段（至少一个）
    required_idempotent_fields:
      - "already_active"
      - "already_exists"
    # 禁止使用的返回类型
    forbidden_return_types:
      - "any"
      - "unknown"
      - "Promise<any>"
      - "Promise<unknown>"
    # OperationResult 接口定义位置
    operation_result_interface_path: "frontend/src/api/types.ts"
    detection_signals:
      - "API 函数返回类型为 Promise<any> → 违规"
      - "OperationResult 接口缺少 already_active 字段 → 违规"
      - "调用点使用 as 强制断言 → 违规"
    applicable_scenarios:
      - "所有资源创建/启动/注册类前端 API 函数"
      - "后端响应结构变更时同步检查"
      - "新增 API 端点的类型契约对齐"
    inapplicable_scenarios:
      - "纯查询接口（用专用 DTO 类型）"
      - "SSE/WebSocket 流式响应（用专用 schema）"
      - "第三方 SDK 类型定义"

  # === F-REVIEW-235 UI 与后端状态一致性强制刷新 ===
  ui_state_check:
    severity: CRITICAL
    # 写操作后必须调用 loadXxx 刷新
    require_refresh_after_write: true
    # 三分支都必须刷新
    require_refresh_in_all_branches: true
    # 业务状态必须来自 API 响应
    require_api_source_for_business_state: true
    # loading 状态必须独立于业务状态
    require_independent_loading_state: true
    # 写操作命名模式
    write_operation_patterns:
      - "start"
      - "create"
      - "update"
      - "delete"
      - "stop"
      - "resume"
      - "pause"
    # 状态刷新函数命名模式
    refresh_function_patterns:
      - "load"
      - "refresh"
      - "mutate"
      - "refetch"
    detection_signals:
      - "写操作后无 loadXxx 调用 → 违规"
      - "业务状态用 useState 独立维护 → 违规"
      - "错误分支无 loadXxx 刷新 → 违规"
      - "loading 状态与业务状态耦合 → 违规"
    applicable_scenarios:
      - "所有涉及后端资源状态的前端 UI"
      - "写操作的前端 handler"
      - "网络不稳定或 fire-and-forget 后端调用场景"
    inapplicable_scenarios:
      - "纯前端 UI 状态（Modal 显示/表单输入值）"
      - "防抖/节流的中间状态"
      - "loading 状态本身"

  # === pytest 命令参数 ===
  pytest_args: "tests/test_api_anticrawl.py -v"

  # === vitest 命令参数 ===
  vitest_args: "frontend/src/api/anticrawl.test.ts frontend/src/pages/AntiCrawl/index.test.tsx"

# ============================================================================
# v2.4.0 新增：模式 AB - 搜索服务模板方法模式回归测试（第九轮复盘落地）
# 配套：xianyu-hunter-dev 规范 19 + coding-standards v1.3 §2.27
# 后端联动：xianyu-backend-code-review v4.65.0 B-REVIEW-324~326
# ============================================================================

mode_ab_search_service_template_test:
  _doc: "搜索服务模板方法模式三项检查点回归测试配置（B-REVIEW-324~326）"

  # === 关键文件（相对项目根目录）===
  # 为什么列这些文件：SearchService 基类 + 已有子类实现 + 慢查询日志配置源
  key_files:
    backend:
      - "src/xianyu_hunter/web/services/search_base.py"
      - "src/xianyu_hunter/web/services/search_items.py"
      - "src/xianyu_hunter/web/services/search_sellers.py"
      - "src/xianyu_hunter/web/services/search_logs.py"
      - "src/xianyu_hunter/web/services/search_evaluations.py"
    frontend: []
    config:
      - "config.yaml"

  # === B-REVIEW-324 SEARCH-SERVICE-TEMPLATE 模板方法模式 ===
  template_method_pattern:
    severity: CRITICAL
    # 触发基类抽取的搜索接口数量阈值
    # 为什么默认 2：1 个接口无需抽象，≥2 个接口必须抽取避免重复实现
    min_interfaces_to_extract: 2
    # SearchService 抽象基类文件路径
    base_class_path: "src/xianyu_hunter/web/services/search_base.py"
    # 基类名
    base_class_name: "SearchService"
    # 唯一入口方法名（子类禁止覆写）
    entry_method: "search"
    # 是否禁止子类覆写入口方法
    forbid_override_entry_method: true
    # 5 步流程编排顺序（必须按此顺序调用）
    orchestration_order:
      - "_build_query"
      - "_execute"
      - "_extract_facets"
      - "_paginate"
      - "_maybe_log_slow"
    # 路由 grep 模式（识别搜索接口）
    route_grep_patterns:
      - "@router\\.post.*search"
      - "@router\\.get.*search"
      - "@router\\.post.*query"
      - "@router\\.get.*query"
    # 搜索接口路径关键字（路径包含这些关键字才计入搜索接口计数）
    route_path_keywords:
      - "search"
      - "query"
      - "list"
    # 搜索参数关键字（参数包含这些关键字才计入搜索接口计数）
    search_param_keywords:
      - "keyword"
      - "query"
      - "q"
    detection_signals:
      - "搜索接口数量 ≥ 2 但无 SearchService 基类 → 违规"
      - "搜索服务子类未继承 SearchService → 违规"
      - "子类覆写 search() 入口方法 → 违规"
    applicable_scenarios:
      - "新增搜索接口时验证是否抽取基类"
      - "SearchService 基类重构后回归"
      - "搜索服务子类签名变更后验证"
    inapplicable_scenarios:
      - "单搜索接口（无需抽象）"
      - "纯 CRUD 列表接口（无搜索关键字参数）"
      - "聚合统计接口（用专用 Service）"

  # === B-REVIEW-325 SEARCH-HOOK-METHOD-CONTRACT 4 钩子方法契约 ===
  hook_method_contract:
    severity: CRITICAL
    # 4 个钩子方法定义
    hooks:
      _build_query:
        # 构建 SQLAlchemy Select 或 SearchQuery 对象
        signature: "async def _build_query(self, params: SearchParams) -> Select | SearchQuery"
        return_type: "Select | SearchQuery"
        responsibility: "构建查询语句（WHERE/ORDER BY/JOIN）"
      _execute:
        # 执行查询，返回 ORM 列表
        signature: "async def _execute(self, query: Select) -> list[ORM]"
        return_type: "Result | list[ORM]"
        responsibility: "执行数据库查询"
      _extract_facets:
        # 提取聚合分面（可选，无分面返回 None）
        signature: "async def _extract_facets(self, query: Select) -> dict[str, FacetResult] | None"
        return_type: "dict[str, FacetResult] | None"
        responsibility: "提取聚合分面（如分类/状态/标签）"
      _paginate:
        # 分页处理，返回 PaginationResult
        signature: "async def _paginate(self, items: list[ORM], total: int, page: int, page_size: int) -> PaginationResult"
        return_type: "PaginationResult"
        responsibility: "分页切片与元数据封装"
        pagination_result_fields:
          - "items"
          - "total"
          - "page"
          - "page_size"
    # 签名一致性检查项
    require_signature_match: true
    # 返回类型契约检查项
    require_return_type_match: true
    detection_signals:
      - "子类钩子方法缺失 → 违规"
      - "子类钩子方法签名与基类不一致 → 违规"
      - "_paginate 返回值缺 items/total/page/page_size 字段 → 违规"
    applicable_scenarios:
      - "搜索服务子类实现审查"
      - "钩子方法签名变更时全量子类同步验证"
    inapplicable_scenarios:
      - "基类内部辅助方法（非钩子）"
      - "测试 mock 子类"

  # === B-REVIEW-326 SEARCH-SLOW-QUERY-LOG 慢查询日志 ===
  slow_query_log:
    severity: HIGH
    # 慢查询阈值（毫秒），从 config.yaml 读取禁止硬编码
    # 注意：此处是测试用的阈值，与项目 config.yaml#search_service_template.slow_query_log.threshold_ms 对齐
    threshold_ms: 500
    # 阈值配置源（指向项目 config.yaml 节点）
    threshold_config_source: "config.yaml#search_service_template.slow_query_log.threshold_ms"
    # 必须包含的日志字段
    required_log_fields:
      - "elapsed_ms"
      - "service_class"
      - "query_keywords"
      - "total_count"
    # 日志级别
    log_level: "WARNING"
    # 调用时机约束（必须在 _execute 之后）
    require_call_after_execute: true
    # 禁止调用时机
    forbidden_call_before: "_build_query"
    forbidden_call_after: "_paginate"
    detection_signals:
      - "慢查询阈值硬编码在模块级常量 → 违规"
      - "慢查询日志缺 elapsed_ms/service_class 字段 → 违规"
      - "_maybe_log_slow 在 _build_query 之前调用 → 违规"
      - "_maybe_log_slow 在 _paginate 之后调用 → 违规"
    applicable_scenarios:
      - "SearchService 基类慢查询日志实现验证"
      - "新搜索子类接入慢查询日志验证"
    inapplicable_scenarios:
      - "单元测试 mock 日志"
      - "本地开发环境（可关闭日志）"

  # === 跨技能交叉验证：测试路由一致性 ===
  route_test_consistency:
    severity: HIGH
    # 历史失败案例（用于警示）
    historical_failure_cases:
      - file: "tests/test_chatbot_api_degraded.py"
        issue: "测试路径用复数 /faqs 但路由定义为单数 /faq"
        fix: "改为 /faq 并将 PUT 改为 POST upsert"
    # 路由装饰器 grep 模式
    route_decorator_patterns:
      - "@router\\.(post|get|put|delete|patch)\\("
    # 测试 client 调用 grep 模式
    test_client_patterns:
      - "client\\.(post|get|put|delete|patch)\\("
    detection_signals:
      - "测试 client 调用路径与路由定义不匹配 → 违规"
      - "测试 HTTP 方法与路由装饰器不匹配 → 违规"
      - "单复数路径不一致 → 违规"
    applicable_scenarios:
      - "新增搜索接口测试时验证路由一致性"
      - "路由路径重命名后全量测试同步"
    inapplicable_scenarios:
      - "纯单元测试（不调用 client）"
      - "集成测试 mock 路由"

  # === 测试用例命名约定 ===
  test_case_naming:
    required_suffixes:
      - "test_search_service_template_method_"
      - "test_search_service_hook_contract_"
      - "test_search_service_slow_query_log_"
      - "test_search_service_pagination_"
      - "test_search_route_consistency_"

  # === pytest 命令参数 ===
  pytest_args: "tests/test_search_service_template_method.py tests/test_search_service_hook_contract.py tests/test_search_service_slow_query_log.py -v"

# ============================================================================
# v2.4.0 新增：模式 AC - 搜索 Hook 模式回归测试（第九轮复盘落地）
# 配套：xianyu-hunter-dev step 271/272 + coding-standards v1.3 §3.16-3.20
# 前端联动：xianyu-frontend-code-review v4.65.0 F-REVIEW-236~240
# ============================================================================

mode_ac_search_hook_test:
  _doc: "搜索 Hook 模式六项检查点回归测试配置（F-REVIEW-236~240）"

  # === 关键文件（相对项目根目录）===
  key_files:
    frontend:
      - "frontend/src/hooks/useSearch.ts"
      - "frontend/src/hooks/useSearchHistory.ts"
      - "frontend/src/pages/Items/index.tsx"
      - "frontend/src/pages/Sellers/index.tsx"
      - "frontend/src/pages/Logs/Logs.tsx"
      - "frontend/src/pages/Chatbot/index.tsx"
    backend: []
    test:
      - "frontend/src/hooks/__tests__/useSearch.test.ts"
      - "frontend/src/hooks/__tests__/useSearchHistory.test.ts"

  # === F-REVIEW-236 USE-SEARCH-DEBOUNCE-CONCURRENCY useSearch 防抖与并发保护 ===
  use_search_debounce:
    severity: CRITICAL
    # useSearch Hook 文件路径
    hook_path: "frontend/src/hooks/useSearch.ts"
    # 防抖时间（毫秒）
    # 为什么默认 400：用户输入平均间隔 ~300ms，400ms 防抖可覆盖大部分输入停顿
    debounce_ms: 400
    # requestId 并发保护字段名
    request_id_field: "requestIdRef"
    # 禁止裸 setTimeout/fetch 模式
    forbid_raw_settimeout: true
    # 红旗 grep 模式
    grep_red_flags:
      - "setTimeout\\(.*search"
      - "setTimeout\\(.*fetch"
      - "setTimeout\\(.*query"
    # 搜索接入页面 glob
    search_page_globs:
      - "frontend/src/pages/**/*.tsx"
    # 豁免页面（不接入 useSearch 的页面，因不涉及搜索防抖）
    # 为什么豁免：纯手动搜索按钮、setTimeout 不涉及搜索防抖
    exempt_pages:
      - "frontend/src/pages/TaskDetail.tsx"
      - "frontend/src/pages/Evaluations/index.tsx"
      - "frontend/src/pages/BatchRefresh.tsx"
      - "frontend/src/pages/Logs/Logs.tsx"
      - "frontend/src/pages/Chatbot/index.tsx"
    detection_signals:
      - "useSearch 无 setTimeout/clearTimeout 防抖 → 违规"
      - "useSearch 无 requestIdRef 并发保护 → 违规"
      - "搜索接入页面裸 setTimeout(.*search → 违规"
      - "搜索接入页面裸 setTimeout(.*fetch → 违规"
    applicable_scenarios:
      - "useSearch Hook 实现审查"
      - "新页面接入搜索功能时验证使用 useSearch"
      - "搜索防抖阈值调整后回归"
    inapplicable_scenarios:
      - "纯展示页面（无搜索功能）"
      - "服务端搜索（无前端防抖需求）"
      - "豁免页面（手动搜索按钮模式）"

  # === F-REVIEW-237 USE-SEARCH-ENABLED-CLEANUP useSearch enabled 条件搜索与卸载清理 ===
  use_search_enabled_cleanup:
    severity: CRITICAL
    # 是否必须支持 enabled 参数
    require_enabled_param: true
    # 是否必须清理 setTimeout
    require_clear_timeout_on_unmount: true
    # 是否必须取消进行中请求
    require_cancel_pending_request: true
    # 取消请求机制
    cancel_mechanisms:
      - "AbortController"
      - "requestIdRef"
    detection_signals:
      - "useSearch 无 enabled 参数支持 → 违规"
      - "组件卸载未 clearTimeout → 违规"
      - "组件卸载未取消进行中请求 → 违规"
      - "卸载后 setState 警告 → 违规"
    applicable_scenarios:
      - "useSearch Hook 实现审查"
      - "条件搜索场景（如选择分类后才搜索）"
      - "频繁挂载/卸载的搜索组件"
    inapplicable_scenarios:
      - "全局搜索（永不卸载）"
      - "一次性搜索（无防抖需求）"

  # === F-REVIEW-238 USE-SEARCH-HISTORY-PERSISTENCE useSearchHistory localStorage 持久化与去重 ===
  use_search_history:
    severity: CRITICAL
    # useSearchHistory Hook 文件路径
    hook_path: "frontend/src/hooks/useSearchHistory.ts"
    # localStorage key 前缀
    storage_key_prefix: "xh_search_history"
    # 历史记录上限
    # 为什么默认 20：覆盖常用搜索场景，超过则 LRU 淘汰
    max_items: 20
    # LRU 语义（新搜索将旧记录移到首位，相同关键词只保留一条）
    lru_semantics: true
    # 是否必须持久化到 localStorage
    require_localstorage_persistence: true
    # 是否必须去重
    require_dedup: true
    # 是否必须上限保护
    require_max_items_limit: true
    detection_signals:
      - "useSearchHistory 无 localStorage 持久化 → 违规"
      - "相同关键词出现多条记录 → 违规"
      - "历史记录数量超过 max_items 未淘汰 → 违规"
    applicable_scenarios:
      - "useSearchHistory Hook 实现审查"
      - "搜索框历史下拉功能验证"
      - "刷新页面后历史保留验证"
    inapplicable_scenarios:
      - "无痕模式（localStorage 不可用，需降级内存存储）"
      - "一次性搜索（无需历史）"

  # === F-REVIEW-239 USE-SEARCH-HISTORY-NAMESPACE useSearchHistory 命名空间隔离 ===
  use_search_history_namespace:
    severity: HIGH
    # 是否必须支持 namespace 参数
    require_namespace_param: true
    # 默认命名空间（未指定时使用）
    default_namespace: "default"
    # 常用命名空间示例
    common_namespaces:
      - "items"
      - "sellers"
      - "logs"
      - "chatbot"
      - "evaluations"
    # 是否禁止跨命名空间污染
    forbid_cross_namespace_pollution: true
    # storageKey 格式
    storage_key_format: "{storage_key_prefix}.{namespace}"
    detection_signals:
      - "useSearchHistory 无 namespace 参数 → 违规"
      - "不同命名空间共享同一 localStorage key → 违规"
      - "在 items 命名空间搜索后 sellers 历史被污染 → 违规"
    applicable_scenarios:
      - "多页面搜索功能（每页独立历史）"
      - "多租户场景（每租户独立历史）"
    inapplicable_scenarios:
      - "单页面搜索（无需命名空间）"
      - "全局共享搜索历史（设计上共享）"

  # === F-REVIEW-240 USE-SEARCH-HISTORY-DECLARATION-ORDER useSearchHistory 声明顺序与依赖稳定性 ===
  use_search_history_declaration_order:
    severity: HIGH
    # 是否必须用 useMemo 固定 storageKey
    require_memo_storage_key: true
    # add/clear/remove 是否必须用 useCallback
    require_callback_for_actions: true
    # useCallback 依赖必须为稳定的 storageKey（来自 useMemo）
    require_stable_dependency: true
    # 声明顺序约束（被依赖者先声明）
    require_dependency_first: true
    # 历史失败案例
    historical_failure_cases:
      - file: "frontend/src/pages/Chatbot/index.tsx"
        issue: "addSessionHistory 在 loadSessions 之后声明，但 loadSessions 的 useCallback 依赖了它"
        fix: "将 useSearchHistory 声明移到 loadSessions 之前"
      - file: "frontend/src/hooks/useSearchHistory.ts"
        issue: "storageKey 每次渲染生成新字符串，导致 add/clear/remove 的 useCallback 依赖变化"
        fix: "用 useMemo 固定 storageKey"
    detection_signals:
      - "storageKey 未用 useMemo 固定 → 违规"
      - "add/clear/remove 的 useCallback 依赖为临时字符串 → 违规"
      - "useSearchHistory 在依赖它的 useCallback 之后声明 → 违规"
      - "useCallback 依赖数组缺失 storageKey → 违规"
    applicable_scenarios:
      - "useSearchHistory Hook 实现审查"
      - "Hook 接入页面审查"
      - "React 依赖循环问题排查"
    inapplicable_scenarios:
      - "无 useCallback 的简单场景"
      - "类组件（不使用 Hook）"

  # === 测试用例命名约定 ===
  test_case_naming:
    required_test_files:
      - "frontend/src/hooks/__tests__/useSearch.test.ts"
      - "frontend/src/hooks/__tests__/useSearchHistory.test.ts"
    required_test_suites:
      - "防抖与并发保护"
      - "enabled 条件搜索"
      - "卸载清理"
      - "localStorage 持久化"
      - "LRU 去重"
      - "命名空间隔离"
      - "声明顺序与依赖稳定性"

  # === vitest 命令参数 ===
  vitest_args: "frontend/src/hooks/__tests__/useSearch.test.ts frontend/src/hooks/__tests__/useSearchHistory.test.ts"

# ===== 模式 AD：AI 服务测试连接与预设切换回归测试模式（v2.5.0 新增） =====
# 来源：AI 服务菜单改造经验沉淀（API Key 关联存储、测试接口状态回传、HF cache 轻量检测、UI 状态集中映射、外部链接安全）
# 配套检查点：B-REVIEW-327~329（后端预设切换与状态回传契约）/ F-REVIEW-241~243（前端 UI 状态映射与链接安全）
# 配套编码规范：xianyu-hunter-dev coding-standards v1.3 §2.25（预设切换双步模式与归档加载契约）+ §2.26（敏感数据后端主导原则）
mode_ad_ai_service_test_connection_test:
  _doc: "AI 服务测试连接与预设切换六项检查点回归测试配置（B-REVIEW-327~329 + F-REVIEW-241~243）"

  # === 关键文件（相对项目根目录）===
  key_files:
    frontend:
      - "frontend/src/pages/Config/AIConfig/constants.ts"
      - "frontend/src/pages/Config/AIConfig/index.tsx"
      - "frontend/src/pages/Config/AIConfig/components/ModelConfigForm.tsx"
      - "frontend/src/pages/Config/AIConfig/components/EmbeddingConfigForm.tsx"
      - "frontend/src/api/ai.ts"
      - "frontend/src/api/types.ts"
    backend:
      - "src/xianyu_hunter/web/routes/api_ai.py"
      - "src/xianyu_hunter/infra/secrets.py"
    test:
      - "frontend/src/pages/Config/AIConfig/__tests__/preset-switch.test.ts"
      - "tests/web/test_api_ai_preset.py"

  # === B-REVIEW-327 PRESET-DEFINITION-FRONTEND-ONLY 预设定义前后端分离 ===
  preset_definition_frontend_only:
    severity: ERROR
    # 前端预设定义文件
    frontend_preset_file: "frontend/src/pages/Config/AIConfig/constants.ts"
    # 预设对象变量名
    preset_var_name: "PRESETS"
    # 必须包含的字段
    required_fields:
      - "base_url"
      - "model"
      - "vision_model"
      - "label"
      - "color"
      - "apiKeyUrl"
    # 后端切换预设接口路径
    backend_apply_endpoint: "POST /api/ai/apply-preset"
    # 后端禁止硬编码预设列表
    forbid_backend_preset_table: true
    # 违规 grep 模式
    grep_violation_patterns:
      - "PRESETS\\s*=\\s*\\{"
      - "preset_table\\s*=\\s*\\{"
      - "PRESET_LIST\\s*=\\s*\\["
    detection_signals:
      - "后端代码出现 PRESETS = {...} 字典 → 违反前后端分离"
      - "前端 constants.ts 缺失 apiKeyUrl 字段 → '获取'按钮无法跳转"
      - "后端 apply-preset 接口不接受 from_preset/to_preset 参数 → 违反双步模式"
    applicable_scenarios:
      - "AI 服务预设列表新增/删除/修改"
      - "新增模型供应商接入（如 doubao/qwen）"
      - "apply-preset 接口签名变更"
    inapplicable_scenarios:
      - "前端单字段编辑（无预设概念）"
      - "首次初始化（无 from_preset 可归档）"

  # === B-REVIEW-328 TEST-ENDPOINT-STATUS-ECHO 测试接口回传状态字段 ===
  test_endpoint_status_echo:
    severity: ERROR
    # 强制要求测试接口返回状态字段
    require_status_field: true
    # 测试接口与对应状态字段映射
    test_endpoints:
      - path: "/api/ai/test-connection"
        status_field: "model"
        # 状态字段必须反映实际使用模型，而非配置文件中的模型
        require_runtime_value: true
      - path: "/api/ai/test-embedding"
        status_field: "model_status"
        # 状态字段必须为枚举值
        require_enum_status: true
        enum_values:
          - "downloaded"
          - "not_downloaded"
          - "checking"
          - "unknown"
    # 失败时也必须返回状态字段
    require_status_on_failure: true
    detection_signals:
      - "测试接口只返回 {\"ok\": true} 无状态字段 → 违反"
      - "状态字段为配置文件值而非运行时值 → 误导前端"
      - "失败响应无 model_status → 前端无法更新 UI"
    applicable_scenarios:
      - "测试连接接口实现"
      - "测试 Embedding 接口实现"
      - "其他需要回传状态的测试类接口"
    inapplicable_scenarios:
      - "纯查询接口（非测试类）"
      - "无状态概念的简单接口"

  # === B-REVIEW-329 HF-CACHE-LIGHTWEIGHT-CHECK 模型缓存轻量检测 ===
  hf_cache_lightweight_check:
    severity: ERROR
    # 检测方法：仅检查目录存在性
    check_method: "directory_existence"
    # 禁止实例化模型
    forbid_model_instantiation: true
    # 违规类名
    forbid_class_names:
      - "SentenceTransformer("
      - "AutoModel.from_pretrained("
      - "AutoTokenizer.from_pretrained("
    # HF 缓存根目录环境变量
    cache_root_env_vars:
      - "HF_HOME"
      - "HF_HUB_CACHE"
    # 默认缓存根目录
    default_cache_root: "~/.cache/huggingface/hub"
    # 缓存目录名模式
    dir_name_pattern: "models--{model_name_with_slash_to_dash}"
    # snapshots 子目录必须非空
    require_snapshots_non_empty: true
    # 状态检测接口路径
    status_endpoint: "GET /api/ai/embedding-model-status"
    detection_signals:
      - "状态检测函数内出现 SentenceTransformer( → 违反轻量检测"
      - "未检查 snapshots 目录非空 → 误判已下载但实际未完成"
      - "未支持 HF_HOME 环境变量 → 自定义缓存路径误判"
    applicable_scenarios:
      - "Embedding 模型下载状态检测"
      - "其他 HuggingFace 模型缓存状态检测"
    inapplicable_scenarios:
      - "模型实际加载与推理（必须实例化）"
      - "非 HuggingFace 模型缓存"

  # === F-REVIEW-241 STATUS-DISPLAY-CENTRAL-MAP 状态映射集中配置 ===
  status_display_central_map:
    severity: ERROR
    # 强制要求集中 Record 定义
    require_central_record: true
    # 强制穷举所有枚举值
    require_exhaustive_record: true
    # 必须包含的字段
    required_fields:
      - "text"
      - "color"
      - "icon"
    # 禁止内联状态分支
    forbid_inline_status_branching: true
    # 违规 grep 模式
    grep_violation_patterns:
      - "status\\s*===\\s*['\"].*['\"]\\s*\\?"
      - "status\\s*===\\s*['\"].*['\"]\\s*&&"
    # 状态字段名候选（适配多种业务场景）
    status_field_candidates:
      - "modelStatus"
      - "status"
      - "downloadStatus"
      - "connectionStatus"
    detection_signals:
      - "JSX 中出现 status === 'xxx' ? ... : ... → 违反集中配置"
      - "Record<Status, Display> 缺失 icon 字段 → 显示不一致"
      - "新增状态枚举值未更新 STATUS_DISPLAY → 显示 fallback"
    applicable_scenarios:
      - "Embedding 模型下载状态显示"
      - "连接测试结果状态显示"
      - "其他多状态 UI 显示场景"
    inapplicable_scenarios:
      - "二值状态（如 enabled/disabled，直接用 Switch 即可）"
      - "一次性状态（如 loading，无需 Record）"

  # === F-REVIEW-242 EXTERNAL-LINK-SECURITY 外部链接安全属性 ===
  external_link_security:
    severity: ERROR
    # 强制 rel="noopener noreferrer"
    require_rel_noopener: true
    # 包含 antd Button 组件 href 属性
    include_antd_button_href: true
    # 同源链接豁免
    exempt_same_origin: true
    # 违规 grep 模式（用双引号字符串：正则中的 " 转义为 \"，' 原样保留）
    grep_violation_patterns:
      - "target=[\"']_blank[\"'](?![^>]*rel=[\"'][^\"']*noopener)"
      - "Button[^>]*href=[\"']https?://(?![^>]*rel=[\"'][^\"']*noopener)"
    detection_signals:
      - "target=\"_blank\" 但无 rel=\"noopener\" → 安全漏洞"
      - "antd Button href 指向外链但无 rel → window.opener 风险"
      - "Antd <Button> 用 onClick 跳转外链但未加 rel → 同样风险"
    applicable_scenarios:
      - "'获取 API Key' 等外链跳转按钮"
      - "文档链接、官网链接"
      - "任何 target=_blank 的外链"
    inapplicable_scenarios:
      - "同源链接（站内导航）"
      - "弹窗内链接（不打开新标签）"

  # === F-REVIEW-243 PRESET-SWITCH-ARCHIVE-LOAD 预设切换归档加载双步模式 ===
  preset_switch_archive_load:
    severity: ERROR
    # 强制 from_preset 和 to_preset 双参数
    require_from_and_to_preset: true
    # 禁止前端明文 Key
    forbid_frontend_plaintext_key: true
    # 使用后端返回的脱敏 Key
    use_returned_masked_key: true
    # 强制活跃预设追踪
    require_active_preset_tracking: true
    # 违规 grep 模式
    grep_violation_patterns:
      - "localStorage\\.setItem\\(['\"].*key"
      - "sessionStorage\\.setItem\\(['\"].*key"
      - "applyPreset\\([^,]*\\)$"
    # 归档-加载原子性验证
    require_atomic_archive_load: true
    # 返回脱敏 Key 字段名
    masked_key_field: "api_key"
    # 脱敏格式（保留前3后3）
    mask_format: "{prefix}***...{suffix}"
    mask_prefix_len: 3
    mask_suffix_len: 3
    detection_signals:
      - "前端 applyPreset 只传 to_preset → 当前 key 无法归档"
      - "前端 localStorage.setItem 存储 key → 明文泄漏风险"
      - "后端 apply-preset 未返回脱敏 api_key → 前端无法回显"
      - "切换预设后 activePresetKey 未更新 → '获取'按钮显示错误"
    applicable_scenarios:
      - "AI 服务预设切换（DeepSeek/Doubao/Qwen 等）"
      - "Embedding 预设切换"
      - "通知渠道预设切换"
    inapplicable_scenarios:
      - "单字段直接编辑（无预设概念）"
      - "首次初始化（无 from_preset 可归档）"

  # === 测试用例命名约定 ===
  test_case_naming:
    required_test_files:
      - "frontend/src/pages/Config/AIConfig/__tests__/preset-switch.test.ts"
      - "tests/web/test_api_ai_preset.py"
    required_test_suites:
      - "预设定义前后端分离"
      - "测试接口状态回传"
      - "HF 缓存轻量检测"
      - "UI 状态集中映射"
      - "外部链接安全"
      - "预设切换归档加载"

  # === vitest 命令参数（前端单测）===
  vitest_args: "frontend/src/pages/Config/AIConfig/__tests__/preset-switch.test.ts"

  # === pytest 命令参数（后端单测）===
  pytest_args: "tests/web/test_api_ai_preset.py -v"

# ============================================================
# 模式 AE：类型注解契约对齐回归测试（B-REVIEW-330 + F-REVIEW-244）
# 配套规范：xianyu-hunter-dev meta-rule #110 + step 273 + coding-standards §2.27
# 配置来源：复杂返回类型列表与权威源优先级从 tech-stack.json#hardConstraints.typeAnnotationContract 同步
# ============================================================
type_annotation_contract_test:
  _doc: "类型注解契约对齐回归测试配置：验证后端函数返回类型注解 ↔ Pydantic ResponseModel ↔ 前端 types.ts 三方契约对齐，防止'类型注解 list[str] 但实际返回 list[dict]'导致前端取到 undefined 的 Bug 再次出现（B-REVIEW-330 + F-REVIEW-244）"

  # === 关键文件（相对项目根目录）===
  key_files:
    frontend:
      - "frontend/src/api/types.ts"
      - "frontend/src/pages/Evaluations/index.tsx"
    backend:
      - "src/xianyu_hunter/web/routes/api_ai_deep.py"
    test:
      - "tests/test_ai_deep.py"

  # === B-REVIEW-330 TYPE-ANNOTATION-CONTRACT-ALIGNMENT 后端函数注解与返回结构一致性 ===
  type_annotation_contract_alignment:
    severity: ERROR
    # 触发规范的复杂返回类型列表（从 tech-stack.json 同步，禁止硬编码到流程）
    complex_return_types:
      - "list[dict]"
      - "list[TypedDict]"
      - "list[Pydantic BaseModel]"
      - "dict[str, Any]"
    # 权威源优先级（高 → 低）
    authoritative_source: "pydantic_response_model"
    fallback_authoritative_source: "frontend_types_ts"
    alignment_sources:
      - "pydantic_response_model"
      - "frontend_types_ts"
    # 单元测试断言级别
    test_assertion_level: "full_structure"
    # 违规断言模式（禁止仅断言长度）
    violation_assertion_patterns:
      - "len\\(.*\\)\\s*==\\s*\\d+"  # 仅断言长度
      - "assert\\s+\\w+\\s+is\\s+not\\s+None"  # 仅断言非空
    # 合规断言模式（必须断言完整结构）
    required_assertion_elements:
      - "isinstance\\(.*,.+\\)"  # 类型断言
      - "in\\s+\\w+"  # 字段存在性
      - "isinstance\\(\\w+\\[.+\\]"  # 字段类型断言

  # === F-REVIEW-244 FRONTEND-TYPE-CONTRACT-REVERSE-VALIDATION 前端 types.ts 反向校验 ===
  frontend_type_contract_reverse_validation:
    severity: ERROR
    # 前端类型声明文件
    types_ts_file: "frontend/src/api/types.ts"
    # 字段类型映射（前端 TS ↔ 后端 Python）
    type_mapping:
      string: ["str"]
      number: ["int", "float"]
      boolean: ["bool"]
      Array: ["list", "tuple"]
      object: ["dict", "TypedDict", "BaseModel"]
    # 未声明字段检测
    undeclared_field_detection: true
    # 可选字段标注（?）
    optional_field_marker: "?"

  # === 扫描范围（grep 范围配置）===
  scan_scope:
    # 后端函数扫描目录
    backend_scan_dirs:
      - "src/xianyu_hunter/web/routes/"
      - "src/xianyu_hunter/web/services/"
    # 后端函数扫描正则
    function_signature_regex: "def\\s+\\w+.*->.*(list\\[|dict\\[)"
    # 单元测试扫描目录
    test_scan_dirs:
      - "tests/"

  # === 报告与修复建议 ===
  reporting:
    # 检查点状态分类
    status_categories:
      - "三方一致"
      - "三方不一致"
      - "无前端消费方"
      - "无 Pydantic ResponseModel"
    # 修复建议引用的规范源
    fix_reference_rules:
      - "xianyu-hunter-dev/references/meta-rules.md #110"
      - "xianyu-hunter-dev/assets/guides/coding-rules/type-annotation-contract.md (step 273)"
      - "xianyu-hunter-dev/assets/guides/coding-standards.md §2.27"
    # 跨技能交叉验证
    cross_skill_validation:
      - "xianyu-backend-code-review B-REVIEW-330"
      - "xianyu-frontend-code-review F-REVIEW-244"

  # === experimental 观察期管理 ===
  experimental_governance:
    # 观察期季度数
    observation_period_quarters: 1
    # 观察期截止日期
    observation_end_date: "2026-10-26"
    # 升正阈值（同期出现 N 次同类 Bug 即升正）
    promotion_threshold: 2
    # 待沉淀候选清单（来自 2026-06-29 8 个 P0-P3 修复覆盖分析）
    pending_sedimentation_candidates:
      - "sqlite3.InterfaceError → NullPool"
      - "Playwright TargetClosedError → is_closed()"
      - "端口 8000 冲突 → 端口释放等待"

  # === 适用与不适用场景 ===
  applicable_scenarios:
    - "后端函数返回 list[dict] / list[TypedDict] / 嵌套 Pydantic BaseModel / dict[str, Any] 的端点"
    - "前后端分离项目的 API 契约验证"
    - "单元测试断言复杂结构的端点"
    - "修复'前端显示 undefined'类 Bug 后的回归测试"
  inapplicable_scenarios:
    - "返回基本类型（str/int/bool）的端点"
    - "纯内部 helper 函数（无前端消费方）"
    - "动态结构通用序列化（结构由 DB schema 决定）"
    - "已有 Pydantic ResponseModel 严格校验的端点（ResponseModel 本身即契约源）"

  # === 测试用例命名约定 ===
  test_case_naming:
    required_test_files:
      - "tests/test_ai_deep.py"
    required_test_suites:
      - "类型注解契约对齐"
      - "前端 types.ts 反向校验"
      - "单元测试完整结构断言"
      - "复杂返回结构端点扫描"

  # === vitest 命令参数（前端单测）===
  vitest_args: "frontend/src/api/__tests__/types-contract.test.ts"

  # === pytest 命令参数（后端单测）===
  pytest_args: "tests/test_ai_deep.py -v -k image_hashes"

# ============================================================
# 健康检查端到端测试配置（v4.69.0 新增）
# 规范源：xianyu-hunter-dev/references/dual-data-source-consistency.md
# ============================================================
health_check_e2e_test:
  enabled: true
  # T005: JSON 无效 + 浏览器内存有效 → 健康检查通过
  t005_browser_fallback:
    enabled: true
    # 模拟的浏览器内存 cookie 数据
    mockBrowserCookies:
      - name: "_m_h5_tk"
        value: "valid_token_<future_timestamp>"
        domain: ".goofish.com"
      - name: "_m_h5_tk_enc"
        value: "enc_valid"
        domain: ".goofish.com"
      - name: "unb"
        value: "123456"
        domain: ".goofish.com"
      - name: "cookie2"
        value: "abc"
        domain: ".goofish.com"
    # JSON 失效场景（none/empty/expired）
    jsonInvalidScenario: "none"
  # T006: MTOP Set-Cookie 回写失败 → warning 日志
  t006_sync_failure_warning:
    enabled: true
    expectedLogLevel: "warning"
    forbiddenLogLevel: "debug"
  # T007: 异步检查器兼容验证
  t007_async_checker_compat:
    enabled: true
    requiredFunction: "inspect.isawaitable"
    forbiddenFunction: "asyncio.iscoroutinefunction"
  # 观察期配置
  observationPeriodQuarters: 1
  observationEndDate: "2026-10-26"

# ============================================================
# v2.6.0 新增 - 基于 2026-07-30 调度器静默失败与浏览器连接检测复盘
# 配套规范：xianyu-hunter-dev step 275-279
# 配套审查：xianyu-backend-code-review B-REVIEW-332~336
# ============================================================

# 模式 AG：批量启动容错回归测试（B-REVIEW-332 + step 275）
batch_start_fault_isolation_test:
  _doc: "批量启动容错回归测试配置：验证 start_all/register_all 等批量操作方法容错单个项目失败，单个失败不阻塞其他项目，完成后记录成功/失败统计日志"
  enabled: true
  key_files:
    backend:
      - "src/xianyu_hunter/modules/scheduler.py"
      - "src/xianyu_hunter/web/startup.py"
    test:
      - "tests/test_worker_scheduler.py"
  test_cases:
    t01_single_failure_no_block:
      enabled: true
      scenario: "mock _check_resume_allowed 对 t1 抛 ResumeBlockedError，验证 t2 正常启动"
      assertions:
        - "not sch.is_running('t1')"
        - "sch.is_running('t2')"
      mock_setup:
        target: "_check_resume_allowed"
        side_effect: "对 t1 抛 ResumeBlockedError，对 t2 通过"
    t02_stats_log:
      enabled: true
      scenario: "验证批量操作完成后输出成功/失败统计日志"
      expected_log_pattern: "成功.*失败|failed.*started"
      log_level: "warning"
    t03_no_reraise:
      enabled: true
      scenario: "验证批量操作方法不 re-raise 异常阻断调用方"
      forbidden_pattern: "raise\\s+(ResumeBlockedError|TimeoutError)"
  scan_scope:
    batch_method_grep: "def (start_all|register_all|init_all|resume_all|restart_all|stop_all)"
    missing_try_except_pattern: "for.*in.*(workers|items|tasks).*\\n.*self\\.(start|register|init|resume|restart|stop)\\("
  pytest_args: "tests/test_worker_scheduler.py -v -k start_all_continues_when_one_task_fails"
  cross_skill_validation:
    - "xianyu-backend-code-review B-REVIEW-332"
    - "xianyu-hunter-dev step 275"

# 模式 AH：外部资源活性真异步检测回归测试（B-REVIEW-333 + step 276）
external_resource_async_liveness_test:
  _doc: "外部资源活性真异步检测回归测试配置：验证 is_alive/ensure_alive 方法用真异步 CDP 调用检测连接，禁止用同步 property"
  enabled: true
  key_files:
    backend:
      - "src/xianyu_hunter/infra/browser.py"
    test:
      - "tests/test_browser_ensure_alive.py"
  test_cases:
    t01_pages_cached_but_dead:
      enabled: true
      scenario: "mock_context.pages 返回缓存空列表，mock_context.cookies 抛 Connection closed，验证 is_alive 返回 False"
      assertions:
        - "await manager.is_alive() is False"
      mock_setup:
        context_pages: "[]"
        context_cookies_side_effect: "RuntimeError('Connection closed while reading from the driver')"
    t02_cookies_empty_but_alive:
      enabled: true
      scenario: "mock_context.cookies 返回空列表，验证 is_alive 返回 True（刚重启时 cookies 为空但连接可用）"
      assertions:
        - "await manager.is_alive() is True"
      mock_setup:
        context_cookies_return: "[]"
    t03_real_async:
      enabled: true
      scenario: "验证 is_alive 方法体内含 await 表达式"
      forbidden_pattern: "async def is_alive[^}]*}$"
  scan_scope:
    liveness_method_grep: "def (is_alive|ensure_alive|health_check|check_connection)"
    sync_property_pattern: "\\.(pages|is_connected|is_closed|_alive|_connected)\\b"
  pytest_args: "tests/test_browser_ensure_alive.py -v -k is_alive_detects_closed_connection"
  cross_skill_validation:
    - "xianyu-backend-code-review B-REVIEW-333"
    - "xianyu-hunter-dev step 276"

# 模式 AI：create_task 异常可见性回归测试（B-REVIEW-334 + step 277）
create_task_exception_visibility_test:
  _doc: "create_task 异常可见性回归测试配置：验证 asyncio.create_task 包装的协程用 try/except Exception 兜底，分层捕获 CancelledError → Exception，logger.exception 保 traceback"
  enabled: true
  key_files:
    backend:
      - "src/xianyu_hunter/web/startup.py"
      - "src/xianyu_hunter/modules/scheduler.py"
    test:
      - "tests/test_worker_scheduler.py"
      - "tests/test_startup.py"
  test_cases:
    t01_start_all_exception_logged:
      enabled: true
      scenario: "mock start_all 抛 RuntimeError，验证 _scheduler_loop 用 logger.exception 记录并 re-raise"
      assertions:
        - "logger.exception 被调用"
        - "task 进入 done 状态"
        - "task.exception() 返回 RuntimeError"
      mock_setup:
        target: "container.scheduler.start_all"
        side_effect: "RuntimeError('test error')"
    t02_cancelled_error_handled:
      enabled: true
      scenario: "取消 _scheduler_loop task，验证 CancelledError 被捕获、stop_all 被调用、re-raise 传播取消信号"
      assertions:
        - "container.scheduler.stop_all 被调用"
        - "CancelledError 被重新抛出"
    t03_no_base_exception:
      enabled: true
      scenario: "静态检查：_scheduler_loop 方法体内不含 except BaseException"
      forbidden_pattern: "except BaseException"
    t04_no_error_with_fstring:
      enabled: true
      scenario: "静态检查：关键路径不用 logger.error(f\"...{e}\") 而用 logger.exception"
      forbidden_pattern: "logger\\.(error|warning)\\(f[\"'].*\\{e\\}[\"']"
  scan_scope:
    create_task_grep: "asyncio\\.create_task"
    cancelled_only_grep: "except asyncio\\.CancelledError(?!\\s*\\n\\s*except)"
  pytest_args: "tests/test_startup.py -v -k scheduler_loop_exception"
  cross_skill_validation:
    - "xianyu-backend-code-review B-REVIEW-334"
    - "xianyu-hunter-dev step 277"

# 模式 AJ：容器迭代快照回归测试（B-REVIEW-335 + step 278）
container_iteration_snapshot_test:
  _doc: "容器迭代快照回归测试配置：验证迭代中可能修改的字典/集合用 list()/tuple() 快照，附注释说明快照原因"
  enabled: true
  key_files:
    backend:
      - "src/xianyu_hunter/modules/scheduler.py"
    test:
      - "tests/test_worker_scheduler.py"
  test_cases:
    t01_snapshot_before_iteration:
      enabled: true
      scenario: "验证 start_all 方法用 list(self._workers.keys()) 快照，迭代中 start() 修改字典不触发 RuntimeError"
      assertions:
        - "start_all 完成后所有 worker 都被处理"
        - "无 RuntimeError: dictionary changed size during iteration"
      mock_setup:
        worker_count: 5
        start_side_effect: "部分 worker 的 start 内部修改 self._workers"
    t02_comment_explanation:
      enabled: true
      scenario: "静态检查：list(self._workers.keys()) 后有注释说明快照原因"
      required_pattern: "list\\(self\\.\\w+\\.keys\\(\\)\\)\\s*#"
    t03_lock_required:
      enabled: true
      scenario: "并发场景下迭代共享容器在锁内快照"
      required_pattern: "with self\\._lock:.*list\\(self\\._"
  scan_scope:
    dict_iteration_grep: "for\\s+\\w+\\s+in\\s+.*\\.(keys\\(\\)|values\\(\\)|items\\(\\))"
    self_container_iteration: "for\\s+\\w+\\s+in\\s+self\\.\\w+s\\b"
  pytest_args: "tests/test_worker_scheduler.py -v -k start_all_snapshot"
  cross_skill_validation:
    - "xianyu-backend-code-review B-REVIEW-335"
    - "xianyu-hunter-dev step 278"

# 模式 AK：调度器主循环异常分层回归测试（B-REVIEW-336 + step 279）
scheduler_loop_layered_exception_test:
  _doc: "调度器主循环异常分层回归测试配置：验证 _scheduler_loop/_bus_loop 按 CancelledError → Exception 顺序分层捕获，logger.exception 保 traceback，re-raise 让 task 可查"
  enabled: true
  key_files:
    backend:
      - "src/xianyu_hunter/web/startup.py"
    test:
      - "tests/test_startup.py"
      - "tests/test_worker_scheduler.py"
  test_cases:
    t01_layered_exception:
      enabled: true
      scenario: "静态检查：_scheduler_loop 方法体内含 except asyncio.CancelledError 后跟 except Exception"
      required_pattern: "except asyncio\\.CancelledError[\\s\\S]*except Exception"
    t02_cancelled_cleanup_reraise:
      enabled: true
      scenario: "取消 _scheduler_loop task，验证 CancelledError 块中调用 stop_all 并 re-raise"
      assertions:
        - "container.scheduler.stop_all 被调用"
        - "CancelledError 被重新抛出"
    t03_exception_logger_reraise:
      enabled: true
      scenario: "mock start_all 抛异常，验证 Exception 块中用 logger.exception 记录并 re-raise"
      assertions:
        - "logger.exception 被调用（非 logger.error）"
        - "异常被重新抛出"
        - "task 进入 done 状态"
    t04_startup_log:
      enabled: true
      scenario: "验证 start_all 后记录启动成功日志"
      required_pattern: "logger\\.info.*调度器已启动|logger\\.info.*主循环启动"
    t05_no_base_exception:
      enabled: true
      scenario: "静态检查：_scheduler_loop 不含 except BaseException"
      forbidden_pattern: "except BaseException"
  scan_scope:
    loop_method_grep: "async def (_scheduler_loop|_bus_loop|_health_check_loop|_cookie_sync_loop)"
    cancelled_only_grep: "except asyncio\\.CancelledError(?!\\s*\\n\\s*except)"
    base_exception_grep: "except BaseException"
  pytest_args: "tests/test_startup.py -v -k scheduler_loop_layered"
  cross_skill_validation:
    - "xianyu-backend-code-review B-REVIEW-336"
    - "xianyu-hunter-dev step 279"

# 🆕v4.70.0 模式 AK：源码文件编码完整性（与模式 K DB 脏值诊断正交互补）
# 检测源码文件本体中文→字面量 ? / GBK 误读乱码；所有扫描参数配置化，禁止硬编码路径/阈值/严重级
# 配套：xianyu-hunter-dev step 280 / 前端 F-REVIEW-246 / 后端 B-REVIEW-337
mode_ak_source_file_encoding_integrity:
  enabled: true
  description: "源码文件编码完整性测试：扫描源码文件本体，检测中文被替换为连续 ? / U+FFFD / GBK 误读乱码"
  trigger_keywords: ["源码中文变?", "源码乱码", "GBK误读", "mojibake", "编码损坏", "问号", "源码编码完整性"]
  # 扫描范围全部配置化（glob），不硬编码项目路径
  scan_globs:
    - "src/**/*.py"
    - "scripts/**/*.py"
    - "frontend/src/**/*.{ts,tsx,js,jsx}"
  scan_exclude:
    - "dist/**"
    - "node_modules/**"
    - "**/__pycache__/**"
    - "*.pyc"
  min_consecutive: 3               # 判定违规的连续 ? 最小个数（与前后端审查一致）
  check_fffd: true                 # 是否检测 U+FFFD 替换字符
  check_gbk_misdecode: false       # 是否检测 GBK-as-UTF-8 误读特征（按需开启）
  severity: "high"                 # 违规严重级别（可由业务场景调整）
  gate: true                       # 是否作为 pre-commit / CI 门禁阻断
  # 修复协议（只读扫描 → 人工确认 → 还原 → 语法校验 → 全仓回扫 → 门禁）
  fix_protocol:
    - "S1 分类：源码本体损坏（本模式）还是运行时数据损坏（→ 模式 K）"
    - "S2 按 scan_globs 扫描，输出 file:line 证据（不自动改写）"
    - "S3 匹配信号：连续 ? 非ASCII上下文 / U+FFFD / GBK 误读特征"
    - "S4 人工确认排除合法 ?（URL 模板 / 正则可选匹配 / SQL ? 占位）"
    - "S5 还原中文 + py_compile / tsc --noEmit 校验语法"
    - "S6 全仓复扫确认 0 命中（必要时修正 HEAD 已提交版本）"
    - "S7 接入 pre-commit / CI 门禁"
  cross_skill_validation:
    - "xianyu-hunter-dev step 280"
    - "xianyu-frontend-code-review F-REVIEW-246"
    - "xianyu-backend-code-review B-REVIEW-337"

# ============== 模式 AN：构建与运行时韧性回归测试 ==============
# 对应 xianyu-hunter-dev meta-rules #112~#115；审查 B-REVIEW-291~295 / F-REVIEW-227~228
# 详细操作步骤见 references/build-runtime-resilience-test.md；测试过程复盘见 references/test-process-retrospective.md
mode_an_build_runtime_resilience:
  enabled: true
  description: "构建与运行时韧性回归测试：构建产物资源显式化、构建运行时 Python 钉选、异步清理 shield+取回、脚本编码 BOM/CRLF、修复回归测试生成（配置驱动，无硬编码）"
  trigger_keywords: ["安装包默认图标", "构建产物图标", "SetupIconFile", "打包Python损坏", "venv继承死stdlib", "Could not find platform independent libraries", "TargetClosedError", "Future exception was never retrieved", "unroute超时", "构建脚本编码", "ps1 BOM", "脚本乱码"]
  references_file: "references/build-runtime-resilience-test.md"
  retrospective_file: "references/test-process-retrospective.md"
  # 步骤 1：构建产物资源显式化（#112 / B-REVIEW-291 / F-REVIEW-227）
  build_artifact_resource:
    installer_icon_path_default: "assets/app.ico"   # 品牌 ico，installer.iss 的 SetupIconFile 必须引用（缺失则安装包用默认图标）
    forbid_system_icon_binding: true                 # 禁止引用 shell32.dll / imageres.dll 系统图标（版权风险）
    recommend_size_px: "256x256"                     # 推荐多尺寸 ico
    audit_signals:                                   # grep 信号：缺 SetupIconFile / 引用系统 dll
      - "SetupIconFile"
      - "shell32.dll"
      - "imageres.dll"
  # 步骤 2：构建运行时 Python 钉选（#113 / B-REVIEW-292）
  build_runtime_python:
    pinned_python_path_default: "C:\\Python313\\python.exe"   # 已知完好运行时，前置钉选到 PATH（按本机覆盖）
    health_check_commands:                           # venv home 指向的 Python 健康探测
      - "python -c \"import os; print(os.__file__)\""
      - "python -m pip --version"
    require_fail_soft_pip: true                      # pip/ensurepip 调用须 try/catch fail-soft（返回重建而非硬中止）
  # 步骤 3：异步清理 shield + 取回回归（#114 / B-REVIEW-293）
  async_cleanup_resilience:
    timeout_seconds_default: 2.5                     # 方法真实耗时约 2.5s，无 hang
    require_shield: true                             # 必须 asyncio.shield 保护内部 unroute task
    require_done_callback_retrieve: true             # 必须 add_done_callback 取回异常，抑制 never retrieved
    regression_test_file: "tests/test_unroute_search_api.py"
    regression_test_cases: 5
  # 步骤 4：脚本编码 BOM/CRLF（#112 反模式 / B-REVIEW-280 / B-REVIEW-295）
  encoding_check:
    ps1_require_bom: true                            # .ps1 必须 UTF-8 BOM（编辑后校验首 3 字节 EF BB BF）
    bat_prefer_ascii: true                           # .bat 建议纯 ASCII / 无 BOM（消除 GBK 乱码脆弱性）
    forbidden_hardcoded:                             # grep 扫描：禁止在脚本内硬编码路径/超时/选择器
      audit_signals:
        - 'C:\\'                                     # 硬编码 Windows 绝对路径
        - '(/Users/|/home/)'                         # 硬编码 Unix 绝对路径
        - 'sleep\s+\d+'                              # 硬编码 sleep 超时
  # 步骤 5：修复回归测试生成（通用配置驱动）
  regression_test_generation:
    tests_dir: "tests"
    naming_pattern: "test_{fix}.py"
    mock_style: "MagicMock + __new__() 跳过 __init__"   # 最小 mock，不启动真实浏览器/服务
    require_config_driven_asserts: true                  # 超时/路径/选择器全部从 config.yaml 读取
    index:                                          # 修复回归测试登记（与 references 索引一致）
      - fix: "实时搜索 TargetClosedError"
        test_file: "tests/test_unroute_search_api.py"
        config_node: "async_cleanup_resilience"
      - fix: "安装包默认图标"
        test_file: "(待补充)"
        config_node: "build_artifact_resource"
      - fix: "打包 Python 损坏"
        test_file: "(待补充)"
        config_node: "build_runtime_python"
  cross_skill_validation:
    - "xianyu-hunter-dev meta-rules #112~#115"
    - "xianyu-frontend-code-review F-REVIEW-227~228"
    - "xianyu-backend-code-review B-REVIEW-291~295"


sandbox_test_protocol:
  enabled: true
  # 沙箱(safe-delete 钩子 fail-closed)下测试必须走项目 venv + 禁用 cov
  venv_pytest: ".venv/Scripts/pytest.exe"
  pytest_args: "--no-cov -p no:cacheprovider"
  # flake 测试最小运行次数（排除环境崩溃误判）
  flaky_min_runs: 2
  # 判定标准：以「无 FAILED/AssertionError」为准；exit1 无 summary 视为环境崩溃
  verdict_by: "no_failed_or_assertion"
  meta_rule: "#124"

regression_guard:
  enabled: true
  # 每条修复必须配基线红灯/修复绿灯回归测试
  baseline_red_fix_green: true
  # 验证手法：git checkout 基线 -> 测试应红灯 -> 还原修复 -> 应绿灯
  verify_method: "git_checkout_baseline_then_restore"
  meta_rule: "#125"

# ============== 模式 AO：release 构建路径一致性测试 ==============
# 对应 xianyu-hunter-dev 规范 29/30/33；审查 F-REVIEW-248 / B-REVIEW-342
# 详细操作步骤见 references/release-build-path-test.md
mode_ao_release_build_path:
  enabled: true
  description: "release 构建路径一致性：vite 编译产物集中到 release/spa、SPA 单一来源（无 backend 次级副本/孤儿）、零 dist\\xianyu-hunter 陈旧残留；全部参数走配置、无硬编码"
  trigger_keywords: ["构建产物路径", "release 集中化", "SPA 单一来源", "陈旧 dist 残留", "dist\\xianyu-hunter", "前端白屏旧 chunk", "打包 SPA 不一致"]
  references_file: "references/release-build-path-test.md"
  # 步骤 1：vite outDir 指向唯一产物根
  vite_out_dir_expected: "release/spa"
  vite_base_expected: "/xianyu/"
  # 步骤 2：SPA 单一来源（安装包只含 release/spa 一份）
  spa_single_source:
    authoritative_dir: "release/spa"
    forbid_secondary_copy_dirs:
      - "backend/xianyu_hunter/web/static/spa"
      - "frontend/dist"
    orphan_check: true
  # 步骤 3：零陈旧残留
  residual_scan:
    forbidden_patterns:
      - "dist\\\\xianyu-hunter"
      - "dist\\\\XianyuHunter-Setup"
      - "release/xianyu-hunter/static/spa"
    scan_globs:
      - "scripts/**/*.ps1"
      - "scripts/**/*.bat"
      - "frontend/vite.config.ts"
      - "backend/xianyu_hunter/web/app.py"
  # 步骤 4：七处路径引用对齐（变更输出根时）
  alignment_points:
    - "vite.config.ts outDir"
    - "build-exe.ps1 --distpath / --workpath"
    - "installer.iss OutputDir"
    - "部署复制源"
    - "app.py 伺服路径"
    - "子脚本默认路径"
    - "cleanup + .gitignore"
  cross_skill_validation:
    - "xianyu-hunter-dev 规范 29/30/33"
    - "xianyu-frontend-code-review F-REVIEW-248"
    - "xianyu-backend-code-review B-REVIEW-342"

# ============== 模式 AP：沙箱安全删除范式测试 ==============
# 对应 xianyu-hunter-dev 规范 32；与 B-REVIEW-342 跨技能一致
# 详细操作步骤见 references/sandbox-safe-deletion-test.md
mode_ap_sandbox_safe_deletion:
  enabled: true
  description: "沙箱 safe-delete 守卫下删除范式：构建/清理脚本删除必须用 .NET Directory.Delete / python ctypes 绕过，禁止 rm/del/Remove-Item（fail-closed 中断）；大目录走同卷 os.rename 逃逸或分片批量删除"
  trigger_keywords: ["删除被拦截", "safe-delete", "SAFE_DELETE_FAIL_CLOSED", "删除中断构建", "回收站删除", "批量删除失败", "清理脚本删除"]
  references_file: "references/sandbox-safe-deletion-test.md"
  # 允许的删除实现（绕过 safe-delete 守卫）
  allowed_delete_impls:
    powershell: "[System.IO.Directory]::Delete($p, $true) / [System.IO.File]::Delete($p)"
    python: "ctypes.windll.kernel32.RemoveDirectoryW / DeleteFileW"
  forbidden_delete_cmds:
    - "rm"
    - "del"
    - "Remove-Item"
  # 大目录删除策略（> 阈值文件数走分片或 os.rename 逃逸）
  bulk_delete:
    max_batch_per_process: 120
    min_sleep_seconds: 6
    use_same_volume_rename_escape: true   # os.rename 到项目树外同卷 O(1)
  # 扫描对象：构建/清理脚本
  scan_globs:
    - "scripts/**/*.ps1"
    - "scripts/**/*.bat"
    - "scripts/**/*.py"
  cross_skill_validation:
    - "xianyu-hunter-dev 规范 32"
    - "xianyu-backend-code-review B-REVIEW-342（沙箱安全删除条款）"
