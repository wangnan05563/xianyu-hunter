# ===== F-REVIEW-188~190 配置驱动 (v4.50) =====
# 维度 40: Async Polling Pattern（meta-rule #79 前端侧落地，coding-rules step 228）
async_polling_pattern:
  enabled: true
  _doc: "前端异步轮询模式（meta-rule #79 前端侧）的所有参数集中管理，禁止硬编码"
  # 轮询间隔（毫秒），禁止在组件中硬编码
  interval_ms: 2500
  # 轮询必须处理的四种状态
  states:
    - "waiting"   # 继续轮询，可更新关键信息
    - "success"   # 停止轮询，触发成功回调
    - "failed"    # 停止轮询，展示错误信息
    - "idle"      # 停止轮询，提示用户重新触发（服务端单例已重置）
  # 必须停止轮询并清理定时器的场景
  cleanup_scenarios:
    - "success"             # 状态为 success
    - "failed"              # 状态为 failed
    - "idle"                # 状态为 idle（服务端单例已重置）
    - "component_unmount"   # 组件卸载（useEffect cleanup）
    - "network_error"       # 网络异常
  # 定时器引用存储方式
  timer_ref_storage: "useRef"
  _doc_timer: "setInterval 返回值必须存 useRef，禁止存 useState（每次渲染重新创建）"
  # waiting 状态下更新关键信息的防覆盖策略
  waiting_update_strategy: "prev ?? newValue"
  _doc_update: "使用 prev ?? newValue 避免覆盖已有值（start 时未拿到、轮询时才拿到）"
  # 轮询期间 UI 状态
  ui_during_polling:
    disable_trigger_button: true
    show_loading_icon: true
    display_actionable_info: true
    _doc_ui: "轮询期间禁用触发按钮、展示 loading、显示可操作的关键信息（如授权链接）"
  # 适用场景
  applicable:
    - "两阶段异步操作的前端轮询（外部命令 login/create/route-dns）"
    - "需要用户交互完成后才能获取结果的操作"
    - "服务端使用全局单例保持状态的操作"
  # 不适用场景
  not_applicable:
    - "一次性请求-响应操作（无需轮询）"
    - "WebSocket/SSE 实时推送（服务端主动推送）"
    - "纯前端状态轮询（无服务端交互）"
  # 轮询状态超时展示（F-REVIEW-191, v4.51.0）
  timeout_display:
    enabled: true
    # 同一状态持续超过此阈值（秒）时展示超时提示（前端须早于后端心跳超时 90s，让用户提前感知）
    stale_threshold_sec: 60.0
    # 提示文案模板（{seconds} 占位符替换实际秒数）
    message_template: "登录进程可能无响应（{seconds}s 未更新），建议重试"
    # 超时后提供的操作
    actions:
      - label: "重试"
        type: "retry"
      - label: "取消"
        type: "cancel"
    # 超时提示的 UI 组件（AntD）
    component: "Alert"
    component_props:
      type: "warning"
      showIcon: true
      banner: true

# ===== F-REVIEW-188~190 审查规则 (v4.50) =====
# 维度 40: Async Polling Pattern（meta-rule #79 前端侧落地）
hard_constraints:
  - name: "F-REVIEW-188 SET-INTERVAL-WITHOUT-CLEAR"
    pattern: "setInterval\\("
    check: "must have corresponding clearInterval in cleanup or stop function"
    message: "setInterval 必须有对应 clearInterval，且在组件卸载时清理（meta-rule #79 前端侧）"
    severity: CRITICAL
    auto_fix: false
  - name: "F-REVIEW-189 POLLING-MISSING-IDLE-STATE"
    pattern: "(success|failed)\\s*\\}\\s*(?:else if|\\}|$)"
    check: "polling must handle 4 states: waiting/success/failed/idle, not just success/failed"
    message: "轮询禁止只处理 success/failed 两态，必须含 idle 兜底（服务端单例重置时停止轮询）（meta-rule #79）"
    severity: HIGH
    auto_fix: false
  - name: "F-REVIEW-190 INTERVAL-IN-USESTATE"
    pattern: "useState.*(setInterval|setTimeout)|setInterval.*useState"
    check: "timer return value must be stored in useRef, not useState"
    message: "setInterval 返回值必须存 useRef（禁止 useState），否则每次渲染重新创建定时器（meta-rule #79）"
    severity: HIGH
    auto_fix: false

# ============================================================
# 🆕v4.51.1 前端工具链与代码质量审查（基于 SonarQube 扫描与工具链检查）
# 对应 F-REVIEW-192~196（5 项检查点）
# 复盘来源：SonarQube 扫描与前端工具链检查发现的 5 类代码质量问题
# 所有参数通过本节点管理，禁止硬编码；审查要点按代码模式匹配，不绑定特定文件名
# ============================================================

# ===== F-REVIEW-192 ESLINT-CONFIG-FORMAT-MATCH 配置驱动 (v4.51.1) =====
# 维度 12: SonarQube 合规 / 工具链配置
# ESLint v9+ 必须使用 eslint.config.js（flat config），禁止 .eslintrc.*（legacy config）
# 判断信号：ESLint 启动报错 "couldn't find an eslint.config.(js|mjs|cjs) file"
eslint_config_compatibility:
  enabled: true
  severity: HIGH
  _doc: "ESLint v9+ 必须使用 flat config（eslint.config.js），禁止 legacy config（.eslintrc.*）。按 package.json 中 eslint 版本与项目根目录配置文件模式匹配，不绑定特定项目路径。"
  # ESLint 主版本号阈值（≥ 该值时强制要求 flat config）
  version_threshold: 9
  # 必须存在的 flat config 配置文件名（支持 js/mjs/cjs 三种扩展名）
  required_config_file: "eslint.config.js"
  required_config_file_alternatives: ["eslint.config.mjs", "eslint.config.cjs"]
  # 禁止的 legacy config 文件名模式（存在任一即视为违规）
  legacy_config_patterns: [".eslintrc.js", ".eslintrc.cjs", ".eslintrc.json", ".eslintrc.yml", ".eslintrc.yaml"]
  # ESLint 版本检测来源（package.json dependencies/devDependencies 中的 eslint 字段）
  version_source: "package.json"
  version_field_pattern: "\"eslint\"\\s*:\\s*\"\\^?([0-9]+)"
  # 检测信号（用于自动化扫描与人工审查触发条件）
  detection_signals:
    - "ESLint couldn't find an eslint.config.(js|mjs|cjs) file"
    - "package.json 安装了 eslint@^9+ 但项目根目录只有 .eslintrc.*"
  # 修复建议（按官方迁移指南）
  fix_guidance: "按 ESLint 官方迁移指南将 .eslintrc.* 转为 eslint.config.js（https://eslint.org/docs/latest/use/configure/migration-guide）"
  # 适用场景
  applicable: "使用 ESLint v9+ 的前端项目；CI/CD 流水线中 ESLint 启动失败的场景；新建项目初始化 ESLint 配置"
  not_applicable: "使用 ESLint v8 及以下版本的项目；不使用 ESLint 的项目；仅使用 Biome/Rome 等其他 linter 的项目"

# ===== F-REVIEW-193 PACKAGE-SCRIPTS-COMPLETENESS 配置驱动 (v4.51.1) =====
# 维度 12: SonarQube 合规 / 工程化规范
# package.json 的 scripts 必须包含 test 脚本（即使为占位），支持 CI/CD 流水线调用
package_json_scripts_completeness:
  enabled: true
  severity: MEDIUM
  _doc: "package.json 的 scripts 必须包含必需脚本（test/build/lint），支持 CI/CD 流水线调用。test 脚本缺失会导致 npm test 报错 missing script: test。"
  # 必须存在的脚本列表（任一缺失即视为违规）
  required_scripts: ["test", "build", "lint"]
  # test 脚本缺失时推荐的占位命令（无测试用例时的兜底）
  test_placeholder: "echo \"no tests specified\" && exit 0"
  # 推荐的 test 脚本命令（项目已配置测试框架时）
  test_recommended: "vitest run"
  # 检测来源
  scripts_source: "package.json"
  scripts_field_pattern: "\"scripts\"\\s*:\\s*\\{[^}]*\\}"
  # 检测信号
  detection_signals:
    - "npm test 报错 missing script: test"
    - "package.json scripts 只有 dev/build/preview/lint，缺少 test"
  # 修复建议
  fix_guidance: "添加 \"test\": \"vitest run\" 或 \"test\": \"echo \\\"no tests specified\\\" && exit 0\" 占位"
  # 适用场景
  applicable: "所有前端项目（尤其接入 CI/CD 流水线的项目）；npm/pnpm/yarn 包项目"
  not_applicable: "纯静态资源项目（无 package.json）；monorepo 中不直接运行测试的子包（由根 package.json 统一管理）"

# ===== F-REVIEW-194 TS-STRICT-CHECK 配置驱动 (v4.51.1) =====
# 维度 4: TypeScript 严格规范 / 维度 11: 类型安全
# tsc --noEmit 必须通过，禁止 @ts-ignore / @ts-nocheck
typescript_strict_check:
  enabled: true
  severity: HIGH
  _doc: "tsc --noEmit 必须通过（零类型错误），禁止 @ts-ignore / @ts-nocheck 绕过类型检查。允许 @ts-expect-error（带原因注释）用于已知类型限制。"
  # 是否强制 tsc --noEmit 通过
  strict_check: true
  # 类型检查命令
  check_command: "npx tsc --noEmit"
  # 禁止的 TypeScript 指令（命中即视为违规）
  forbidden_directives: ["@ts-ignore", "@ts-nocheck"]
  # 允许的 TypeScript 指令（需带原因注释）
  allowed_directives: ["@ts-expect-error"]
  # @ts-expect-error 必须带原因注释（禁止裸用）
  require_reason_comment: true
  reason_comment_pattern: "@ts-expect-error\\s*//\\s*\\S+"
  # 检测范围（按代码模式匹配，不绑定特定文件名）
  detect_scope: "frontend/src/**/*.{ts,tsx}"
  # 检测信号
  detection_signals:
    - "tsc --noEmit 报错（存在类型错误）"
    - "grep \"@ts-ignore|@ts-nocheck\" frontend/src/ 命中"
  # 修复建议
  fix_guidance: "修复类型错误；如确需绕过，用 @ts-expect-error 并附原因注释（如 // 类型定义待后端补齐）"
  # 适用场景
  applicable: "所有 TypeScript 前端项目；CI/CD 类型检查门禁；代码审查阶段"
  not_applicable: "纯 JavaScript 项目（无 TypeScript）；迁移中的 JS 文件（临时允许 @ts-check 渐进迁移）"

# ===== F-REVIEW-195 PWA-REGISTER-TYPE 配置驱动 (v4.51.1) =====
# 维度 13: PWA 配置
# vite-plugin-pwa 的 registerType 必须为 'autoUpdate'（避免 SW 死锁导致旧缓存不更新）
pwa_register_type_check:
  enabled: true
  severity: HIGH
  _doc: "vite-plugin-pwa 的 registerType 必须为 'autoUpdate'，避免 SW 死锁导致旧缓存不更新、移动端访问旧版本不刷新。按 VitePWA() 调用模式匹配，不绑定特定配置文件名。"
  # 必须使用的 registerType 值
  required_register_type: "autoUpdate"
  # 禁止的 registerType 值（命中即视为违规）
  forbidden_register_types: ["prompt"]
  # VitePWA 调用检测模式（按代码模式匹配）
  detect_patterns:
    - pattern: "VitePWA\\(\\s*\\{[^}]*registerType\\s*:\\s*['\"]prompt['\"]"
      message: "vite-plugin-pwa registerType 为 'prompt' 会导致 SW 死锁，旧缓存不更新，移动端访问旧版本不刷新"
      severity: HIGH
    - pattern: "VitePWA\\(\\s*\\{[^}]*registerType\\s*:\\s*['\"]autoUpdate['\"]"
      message: "vite-plugin-pwa registerType 正确使用 'autoUpdate'"
      severity: INFO
  # 检测信号
  detection_signals:
    - "vite.config.ts 中 VitePWA({ registerType: 'prompt' })"
    - "移动端访问旧版本不刷新（SW 缓存死锁）"
  # 修复建议
  fix_guidance: "改为 registerType: 'autoUpdate'；如需用户感知更新，配合 autoUpdate + onComplete/onRegisteredSW 回调提示用户刷新"
  # 适用场景
  applicable: "使用 vite-plugin-pwa 的 PWA 项目；移动端 PWA 应用；需要自动更新 SW 缓存的场景"
  not_applicable: "非 PWA 项目；使用 Workbox 原生配置的项目；纯 SSR 项目（无 SW）"

# ===== F-REVIEW-196 MOBILE-DETECT-CLEANLINESS 配置驱动 (v4.51.1) =====
# 维度 10: Hooks 设计模式 / 维度 11: 代码质量
# 移动端检测 Hook 不得包含临时诊断代码（如 debug 参数、console.log 调试输出）
# 按代码模式匹配，不绑定特定文件名（泛化到所有移动端检测相关 hooks）
mobile_detect_cleanliness:
  enabled: true
  severity: MEDIUM
  _doc: "移动端检测 Hook（含 useMobileDetect 及同类移动端/UA 检测 hooks）不得包含临时诊断代码（debug 参数、console.log/console.debug 调试输出）。调试应通过 DevTools 移动模拟器。按 hook 内代码模式匹配，不绑定特定文件名。"
  # 禁止的诊断代码模式（命中即视为违规）
  forbidden_patterns: ["debug", "console.log", "console.debug"]
  # 是否允许在开发环境（NODE_ENV=development）中保留诊断代码
  allowed_in_dev: false
  # 移动端检测 Hook 识别模式（泛化匹配，不绑定特定文件名）
  hook_identify_patterns:
    - "useMobileDetect"
    - "useMediaQuery"
    - "useBreakpoint"
    - "useDeviceDetect"
    - "useUA"
    - "useIsMobile"
  # 检测范围（hooks 目录下所有 .ts 文件，按代码模式匹配）
  detect_scope: "frontend/src/hooks/**/*.ts"
  # 检测信号
  detection_signals:
    - "grep \"debug|console.log|console.debug\" frontend/src/hooks/ 命中（移动端检测相关 hook）"
    - "移动端检测 hook 函数签名包含 debug?: boolean 参数"
  # 修复建议
  fix_guidance: "移除诊断代码（debug 参数、console.log/console.debug 调试输出）；调试通过 DevTools 移动模拟器（Chrome DevTools > Device Toolbar）"
  # 适用场景
  applicable: "所有移动端检测/响应式断点/UA 检测相关 hooks；生产环境代码审查"
  not_applicable: "开发调试阶段（应通过 DevTools 而非代码内诊断）；非移动端检测相关 hooks（普通 hooks 的 console.log 由 F-REVIEW-DEBUG-CODE-CLEANUP 覆盖）"
  # 与现有规则的关系
  related_rules:
    - "debug_code_cleanup（F-REVIEW-DEBUG-CODE-CLEANUP）：通用 DEBUG 代码清理，本规则专注移动端检测 hooks 的诊断代码"

# ===== F-REVIEW-197 / F-REVIEW-198 ui_layout 配置驱动 (v4.52.0) =====
# 维度 46: UI 操作项分级保留与多视图一致性（meta-rule #83 落地）
# 对应 xianyu-hunter-dev step 236/237/238 三条编码规范
# 所有阈值参数通过此节点集中管理，禁止代码硬编码
ui_layout:
  enabled: true
  severity: HIGH
  _doc: "UI 操作项分级保留与多视图一致性审查配置（meta-rule #83 落地）。当单行/单卡操作按钮总数 > action_button_visible_threshold 时，必须按频率分级（高频文字 / 中频图标+Tooltip / 低频 Dropdown/Popover/Drawer 收起）；同时表格视图与卡片视图操作集合必须完全一致。"
  # F-REVIEW-197 操作项分级保留参数
  action_button_visible_threshold: 5
  low_frequency_threshold_per_month: 1
  collapse_container_strategy:
    le3: "Dropdown"
    "3to6": "Popover"
    gt6: "Drawer"
  scroll_fallback: "max-content"
  # F-REVIEW-198 多视图模式一致性参数
  multi_view_sync_required: true
  multi_view_sync_scan_glob: "frontend/src/pages/**/*.tsx"
  table_view_matchers:
    - "<Table"
    - "columns="
    - "scroll="
  card_view_matchers:
    - "<Card"
    - "actions="
    - "cover="
  # 检测信号
  detection_signals:
    - "grep \"<Button\" <page>.tsx 在单个 <Space> / actions= 内计数 > action_button_visible_threshold（默认 5）→ 违规"
    - "grep \"<Button\" <page>.tsx 计数 ≥ 6 且无 <Dropdown / <Popover / <Drawer → 违规"
    - "收起容器内的按钮文案与原文字按钮不一致 → 违规"
    - "grep \"scroll=\" <page>.tsx 无匹配 → 缺少横向滚动 fallback"
    - "grep \"<Table\" <page>.tsx 与 grep \"<Card\" <page>.tsx 同时存在 → 必须做视图一致性检查"
    - "git diff <page>.tsx 仅修改了表格视图的操作列，但卡片视图 <Card actions> 未变 → 违规"
    - "双视图的 handler 函数名相同但定义在不同闭包 → 违规（应提取到 useHandlers Hook）"
  # 修复建议
  fix_guidance: "对操作按钮按使用频率分级（高频保留文字 / 中频转图标+Tooltip / 低频收入 Dropdown/Popover/Drawer）；提取 useActionHandlers Hook 让双视图共享同一 handler 集合；Table 显式声明 scroll={{ x: 'max-content' }} 作为兜底"
  # 适用场景
  applicable: "列表页操作列（任务管理、订单管理、商品管理）；同时存在表格视图 + 卡片视图的列表页；AntD <Table> columns render 中承载多个操作按钮的场景"
  not_applicable: "操作按钮总数 ≤ 阈值；表单提交按钮组（主/次按钮天然分级）；仅有一种视图的页面；详情页无溢出风险的固定操作栏；列数 ≤ 3 的简单表格"
  # 与现有规则的关系
  related_rules:
    - "debug_code_cleanup（F-REVIEW-DEBUG-CODE-CLEANUP）：通用 DEBUG 代码清理，本规则专注 UI 操作项分级"
    - "filter_visibility（F-REVIEW-FILTER-VISIBILITY）：过滤结果可见性，本规则关注操作按钮可见性"
  # 对应规范
  corresponding_steps:
    - "xianyu-hunter-dev step 236（操作项分级保留规范）"
    - "xianyu-hunter-dev step 237（多视图模式一致性规范）"
    - "xianyu-hunter-dev step 238（UI 水平空间溢出诊断与横向滚动容错规范）"
  corresponding_meta_rule: "meta-rule #83 (UI-ACTION-TIER-RETAIN-AND-MULTI-VIEW-CONSISTENCY experimental)"


# --- 前端数据透传与快照职责分离（v4.52.0 新增，meta-rules #83 落地）---
# 对应 F-REVIEW-197 / F-REVIEW-198 检查点的配置参数
# 源自 2026-07-18 卖家评估 Bug 复盘：后端 enrich 用最新值覆盖导致过滤误判
data_propagation_frontend:
  # F-REVIEW-197: 前端快照与最新值职责分离
  snapshot_display_separation:
    # 前端展示价格时需区分"评估时价格"和"最新价格"
    price_display_fields:
      eval_snapshot: "eval_snapshot_price"  # 评估时价格字段名
      latest: "item_price"                   # 最新价格字段名
    # 过滤组件（Select/Slider）应基于评估时价格，展示组件应基于最新价格
    filter_uses_snapshot: true
    display_uses_latest: true
    # 提示文案：当两者不一致时是否展示差异提示
    show_price_diff_hint: true

  # F-REVIEW-198: 多用户上下文传递
  multiuser_context_propagation:
    # 前端调用 API 时必须携带的认证字段
    required_auth_headers:
      - "Cookie"
    # fetch 必须包含 credentials
    fetch_credentials: "include"
    # axios 拦截器仅在 401 且 detail === "Unauthorized" 时重定向
    interceptor_redirect_condition: "status==401 and detail=='Unauthorized'"
    # 业务 440（Cookie 过期）不触发全局登出，走业务逻辑
    business_440_no_redirect: true
    # htmx 请求使用官方 meta 配置传递凭证
    htmx_credentials_meta: true

# --- 实时搜索错误消息与后端状态码对齐（v4.53.0 新增，meta-rules #84 落地）---
# 对应 F-REVIEW-199 检查点的配置参数
# 源自 2026-06-26 FAIL_SYS_ILLEGAL_ACCESS 问题复盘：后端 Cookie 不完整返回 401，前端需正确引导用户重新登录
live_search_error_alignment:
  # F-REVIEW-199: 实时搜索错误消息对齐
  # 为什么需要：后端 _ensure_live_search_cookies 检查 Cookie 不完整时返回 401
  # 前端必须区分"认证 401（未登录）"和"业务 401（Cookie 不完整）"，展示不同的用户引导
  error_message_alignment:
    # 后端返回的业务 401 错误消息特征（用于前端区分认证 401 和业务 401）
    business_401_detail_pattern: "Cookie 不完整"
    # 前端展示的用户引导文案
    user_messages:
      cookie_incomplete: "闲鱼登录 Cookie 不完整，实时搜索不可用，请重新登录闲鱼"
      token_mismatch: "搜索令牌已过期，正在自动刷新中，请稍后重试"
      session_invalid: "闲鱼会话已失效，请重新登录"
    # 前端自动重试配置（token_mismatch 时自动重试）
    auto_retry:
      enabled: true
      max_retries: 1
      retry_delay_ms: 2000
    # 前端跳转登录页的条件（仅在认证 401 且非业务 401 时跳转）
    redirect_login_condition: "status==401 and detail does not contain 'Cookie 不完整'"
    # 检测信号
    detection_signals:
      - "前端 catch 块无 status === 401 分类处理 → 违规"
      - "前端统一显示'操作失败'而非区分 Cookie 不完整 / token 过期 / 会话失效 → 违规"
      - "后端返回 401 但前端未引导用户重新登录 → 违规"
      - "后端返回 FAIL_SYS_ILLEGAL_ACCESS 但前端未提示 token 自动刷新 → 违规"
    # 修复建议
    fix_guidance: "前端 catch 块按 status 和 detail 分类处理：认证 401 跳转登录页，业务 401（Cookie 不完整）提示重新登录闲鱼，FAIL_SYS_ILLEGAL_ACCESS 提示 token 自动刷新"
    # 适用场景
    applicable: "实时搜索页面；反爬健康检查页面；所有涉及闲鱼 Cookie/Token 状态的前端展示"
    not_applicable: "不涉及闲鱼认证的页面；纯管理后台页面（使用管理令牌认证）"
    # 对应规范
    corresponding_steps:
      - "xianyu-hunter-dev step 243（Cookie-Token 一致性保障规范）"
      - "xianyu-hunter-dev step 200（HTTP 状态码精细化映射表）"
    corresponding_meta_rule: "meta-rule #84 (COOKIE-TOKEN-STATE-SEPARATION)"
    corresponding_backend_review: "B-REVIEW-242 (COOKIE-TOKEN-CONSISTENCY)"

# ============== 配置字段全链路覆盖-前端侧（meta-rule #86/#87 落地） ==============
# 对应 xianyu-hunter-dev meta-rule #86（配置字段全链路覆盖检查）和 #87（空值=恢复默认语义）
# 2026-07-11 智能客服新建会话乱码 Bug 复盘
config_field_coverage_frontend:
  _doc: "配置字段全链路覆盖检查前端侧（F-REVIEW-200/201），验证新增配置字段在 types.ts 和 Config.tsx 中有完整覆盖"

  # F-REVIEW-200：配置字段全链路覆盖-前端侧
  full_chain_coverage:
    # 必须覆盖的前端层（与后端 B-REVIEW-238 对齐）
    required_frontend_layers:
      - "types_ts"        # 前端 types.ts 有该字段的类型定义
      - "config_ui"       # 前端 Config.tsx 有该字段的编辑 UI
    # types.ts 检查模式
    types_ts_check:
      # types.ts 文件路径（相对 frontend_dir）
      file_path: "src/pages/Chatbot/types.ts"
      # 检查方式：grep 新增 key 是否在 interface 中声明
      grep_pattern: 'welcome_message|notify_text|contact'
      # 缺失后果：TS 编译报错或类型不匹配
      missing_severity: MAJOR
    # Config.tsx 检查模式
    config_ui_check:
      # Config.tsx 文件路径（相对 frontend_dir）
      file_path: "src/pages/Chatbot/Config.tsx"
      # 检查方式：grep 新增 key 是否有对应的编辑组件（Input/TextArea/Switch/InputNumber）
      grep_pattern: 'welcome_message|notify_text|contact'
      # 编辑组件类型映射（string→TextArea/Input, bool→Switch, int→InputNumber）
      expected_component_types:
        string: ["Input.TextArea", "Input"]
        bool: ["Switch"]
        int: ["InputNumber"]
        float: ["InputNumber"]
      # 缺失后果：脏值无法从界面清除
      missing_severity: MAJOR

  # F-REVIEW-201：空值=恢复默认-前端侧
  empty_means_reset:
    # 适用字段类型
    applicable_types: ["string"]
    # 不适用字段类型
    non_applicable_types: ["int", "float", "bool"]
    # types.ts 字段类型必须为 string | null
    required_ts_type: "string | null"
    # Config.tsx 必须有"恢复默认"按钮
    require_reset_button: true
    # 已为默认时按钮 disabled
    disabled_when_default: true
    # 恢复默认按钮检查模式
    reset_button_check:
      # 按钮文本（可配置，支持多种文案）
      button_texts: ["恢复默认", "重置", "Reset"]
      # 按钮类型
      button_type: "link"
      # 点击行为：发送空 value
      expected_click_behavior: "updateConfig(key, '')"
      # 防抖延迟（ms）
      debounce_ms: 500
    # TextArea 检查
    textarea_check:
      # placeholder 必须提示默认文案
      require_placeholder: true
      # maxLength 限制
      max_length: 200
      # showCount
      show_count: true

# --- 前端副作用兜底提示配置（v4.56.0 新增）---
# F-REVIEW-205 SIDE-EFFECT-FALLBACK-ALERT（meta-rule #89 前端落地）
# 配套规范：xianyu-hunter-dev/assets/guides/coding-rules/concurrency.md step 253
# 所有参数通过此节点管理，不硬编码
side_effect_fallback_alert:
  enabled: true                          # 总开关（false 时跳过 F-REVIEW-205 检查）
  severity: MAJOR                        # 违规严重级别
  # === 兜底提示规范 ===
  alert_type: "warning"                  # Alert 类型（必须为 warning，非 error）
  alert_component: "Alert"               # 使用的组件（antd Alert）
  # === 兜底条件规范 ===
  fallback_conditions:                   # 触发兜底提示的条件
    - field: "session.active"
      operator: "==="
      value: false
    - field: "session.status"
      operator: "!=="
      value: "running"
  # === 手动操作入口规范 ===
  manual_action:
    required: true                       # 必须包含手动操作入口
    button_text_key: "manual_start_session"  # 按钮文案 key（从 i18n 读取）
    api_endpoint: "/api/session/start"   # 手动启动接口
    method: "POST"
  # === 状态轮询规范 ===
  polling:
    enabled: true                        # 登录后是否轮询副作用状态
    interval_ms: 2000                    # 轮询间隔（毫秒）
    timeout_ms: 10000                    # 轮询超时（毫秒），超时后显示兜底提示
    endpoint: "/api/session/status"      # 轮询接口
  # === 文案配置（i18n key）===
  messages:
    fallback_alert_title: "side_effect_fallback_title"
    fallback_alert_content: "side_effect_fallback_content"
    manual_start_button: "manual_start_session"
    polling_timeout_hint: "side_effect_polling_timeout"
  # === 自动扫描规则 ===
  hard_constraints:
    rules:
      - name: "F-REVIEW-205 SIDE-EFFECT-FALLBACK-ALERT-MISSING"
        pattern: "login.*success|登录成功"
        scope: "frontend/src/pages/AntiCrawl/"
        negative_pattern: "Alert|Message|notification"
        message: "登录成功页面必须有副作用兜底提示组件（F-REVIEW-205），不能静默无反馈"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-205 SIDE-EFFECT-FALLBACK-ALERT-TYPE-WRONG"
        pattern: "Alert.*type=.error."
        scope: "frontend/src/pages/AntiCrawl/"
        message: "副作用兜底提示必须用 type=warning（非 error，因主流程已成功）（F-REVIEW-205）"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-205 SIDE-EFFECT-FALLBACK-NO-MANUAL-ACTION"
        pattern: "Alert.*warning"
        scope: "frontend/src/pages/AntiCrawl/"
        negative_pattern: "Button|onClick.*start|手动启动"
        message: "副作用兜底提示必须包含手动操作入口（按钮/链接）（F-REVIEW-205）"
        severity: MAJOR
        auto_fix: false
  # === 适用/不适用场景 ===
  applicable_scenarios:
    - "登录成功后依赖后端副作用的页面（反爬登录管理页）"
    - "副作用失败不影响主功能但影响体验"
  inapplicable_scenarios:
    - "登录主流程失败的错误提示（应用 error 类型）"
    - "无副作用的纯展示页面"
    - "副作用失败会导致数据丢失（应用 error 类型并阻止操作）"
  block_on_violation: true

# --- 回退构造保留关联键配置-前端侧（v4.57.0 新增）---
# F-REVIEW-206 FALLBACK-PRESERVE-KEY-FRONTEND（meta-rule #90 前端落地）
# 配套规范：xianyu-hunter-dev/assets/guides/coding-rules/data-contract.md step 254
# 源自 2026-07-22 price_range 注入 Bug 复盘：前端回退构造对象时也需保留关联键
# 所有参数通过此节点管理，不硬编码
fallback_preserve_key_frontend:
  enabled: true                          # 总开关（false 时跳过 F-REVIEW-206 检查）
  severity: MAJOR                        # 违规严重级别（前端回退构造比后端影响小，定为 MAJOR）
  # === 必须保留的关联键清单 ===
  # 为什么需要：前端回退构造的对象（如伪 item 对象）被下游组件依赖关联键做条件渲染
  # 遗漏关联键会导致条件渲染被跳过，UI 元素静默消失
  required_keys:                        # 前端回退构造必须保留的关联键清单（与后端 B-REVIEW-251 对齐）
    - "task_id"                         # 任务 ID（任务详情跳转、任务筛选依赖）
    - "user_id"                         # 用户 ID（多租户展示依赖）
    - "seller_id"                       # 卖家 ID（卖家评估跳转依赖）
    - "item_id"                         # 商品 ID（前端特有：商品详情跳转依赖）
  # === 扫描范围 ===
  scan_globs:                           # 扫描的文件 glob（覆盖前端回退构造可能出现的位置）
    - "frontend/src/pages/**/*.tsx"     # 页面组件
    - "frontend/src/components/**/*.tsx" # 通用组件
    - "frontend/src/api/**/*.ts"        # API 层回退构造
  # === 前端回退构造识别模式 ===
  # 为什么用这些模式：前端回退构造通常出现在 catch / if-else 的 fallback 分支
  fallback_patterns:
    - "fallback.*item|fallback.*data|默认.*对象|回退.*构造"  # 回退构造的命名特征
    - "catch.*\\n.*return.*\\{"                                # catch 分支返回对象（回退构造）
    - "if.*!.*\\n.*return.*\\{|\\?\\?.*\\{"                     # 空值回退返回对象
  # === 前端特有：条件渲染检查 ===
  # 为什么需要：前端关联键缺失不仅影响数据流，还影响条件渲染
  conditional_render_checks:
    - field: "task_id"
      render_pattern: "\\{.*task_id.*&&|task_id.*\\?\\s*\\("
      missing_impact: "任务相关按钮/链接不渲染"
    - field: "item_id"
      render_pattern: "\\{.*item_id.*&&|item_id.*\\?\\s*\\("
      missing_impact: "商品详情跳转链接不渲染"
    - field: "seller_id"
      render_pattern: "\\{.*seller_id.*&&|seller_id.*\\?\\s*\\("
      missing_impact: "卖家评估跳转链接不渲染"
  # === 日志规范（前端用 console.warn）===
  log_on_missing_key: true              # 关联键缺失时是否记录 console.warn（默认 true）
  log_method: "console.warn"            # 前端日志方法
  log_message_template: "[FALLBACK] 回退构造对象缺少关联键 {missing_key}，条件渲染可能被跳过"
  # === 自动扫描规则 ===
  hard_constraints:
    rules:
      - name: "F-REVIEW-206 FALLBACK-PRESERVE-KEY-FRONTEND-MISSING"
        pattern: "fallback.*item|fallback.*data|默认.*对象|回退.*构造"
        scope: "frontend/src/"
        negative_pattern: "task_id|item_id|seller_id"
        message: "前端回退构造对象必须保留关联键（task_id/item_id/seller_id）（meta-rule #90 / F-REVIEW-206），遗漏会导致条件渲染静默失效"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-206 FALLBACK-NO-CONSOLE-WARN"
        pattern: "fallback.*item|fallback.*data"
        scope: "frontend/src/"
        negative_pattern: "console\\.(warn|error)"
        message: "前端回退构造关联键缺失时必须记录 console.warn（meta-rule #90 / F-REVIEW-206），便于排查条件渲染失效问题"
        severity: MINOR
        auto_fix: false
  # === 适用/不适用场景 ===
  applicable_scenarios:
    - "前端 catch 块回退构造默认对象时"
    - "API 返回数据不完整时前端补全默认值"
    - "前端状态管理中的 fallback state 构造"
  inapplicable_scenarios:
    - "从 API 获取的完整响应对象（已有所有字段）"
    - "纯展示用的 mock 数据（不参与条件渲染）"
    - "测试 fixtures（明确测试特定字段缺失场景）"
  block_on_violation: true

# --- 第四轮复盘新增（v4.39.0）---
# meta-rules #93-#100 前端落地，配套 xianyu-hunter-dev v4.58.0
# 涵盖：外部API结构防御、构建工具链验证、数据流闭环、刷新模式处理

# === F-REVIEW-207 API-RESPONSE-STRUCTURE-FRONTEND（meta-rule #97 前端落地）===
api_response_structure_frontend:
  enabled: true
  severity: HIGH
  description: "前端消费外部 API 响应时必须有结构防御，防止第三方变更导致页面崩溃"
  detection_signals:
    - "直接访问 response.data.item 而无可选链"
    - "API 响应结构变更后页面白屏"
    - "undefined is not an object 错误"
  key_files:
    - "frontend/src/api/*.ts"
    - "frontend/src/pages/Evaluations/*.tsx"
    - "frontend/src/pages/Items/*.tsx"
  hard_constraints:
    rules:
      - name: "F-REVIEW-207 DEEP-NEST-WITHOUT-OPTIONAL-CHAIN"
        pattern: "data\\.\\w+\\.\\w+\\.\\w+"
        scope: "frontend/src/"
        message: "深层嵌套属性访问必须使用可选链（?.）（meta-rule #97 / F-REVIEW-207），外部 API 结构变更会导致 TypeError"
        severity: HIGH
        auto_fix: false
      - name: "F-REVIEW-207 NO-API-RESPONSE-VALIDATION"
        pattern: "const.*=.*await.*fetch|const.*=.*api\\."
        scope: "frontend/src/api/"
        negative_pattern: "\\.catch|if.*!.*data|Array\\.isArray"
        message: "API 响应消费前应验证数据结构（meta-rule #97 / F-REVIEW-207），防止第三方变更导致静默失败"
        severity: WARNING
        auto_fix: false
  applicable_scenarios:
    - "消费第三方/爬虫 API 响应的前端代码"
    - "无 OpenAPI 规范的外部接口"
    - "嵌套较深的响应数据解构"
  inapplicable_scenarios:
    - "内部 API（自有契约，TypeScript 接口已约束）"
    - "有 Zod/Joi schema 验证的接口"
  block_on_violation: false

# === F-REVIEW-208 BUILD-ENVIRONMENT-TOOLCHAIN-FRONTEND（meta-rule #98 前端落地）===
build_environment_toolchain_frontend:
  enabled: true
  severity: MAJOR
  description: "前端构建必须验证工具链版本，旧版 Node.js 不支持新语法导致构建失败"
  required_node_version: "18"          # 最低 Node.js 主版本（与 backend config B-REVIEW-261 对齐）
  detection_signals:
    - "构建报错含 'Unexpected token'（如 ??=、?. 等）"
    - "构建脚本未指定 Node.js 路径"
    - "系统 PATH 中旧版 Node.js 优先"
  key_files:
    - "*.bat"
    - "package.json"
    - "vite.config.ts"
  hard_constraints:
    rules:
      - name: "F-REVIEW-208 BUILD-SCRIPT-NO-NODE-VERSION"
        pattern: "npm run build|npx vite"
        scope: "*.bat"
        message: "前端构建脚本必须验证 Node.js 版本（meta-rule #98 / F-REVIEW-208），旧版不支持 ??= 等语法"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-208 BUILD-SCRIPT-NO-PATH-PRIORITY"
        pattern: "npm run build"
        scope: "*.bat"
        negative_pattern: "set PATH=|PATH%="
        message: "前端构建脚本必须在构建前设置 PATH 优先级（meta-rule #98 / F-REVIEW-208），避免系统旧版 Node.js 优先"
        severity: WARNING
        auto_fix: false
  applicable_scenarios:
    - "前端生产构建脚本"
    - "CI/CD 前端构建流水线"
    - "部署自动化脚本中的前端构建部分"
  inapplicable_scenarios:
    - "开发环境（nvm/fnm 等版本管理器已处理）"
    - "Docker 构建（基础镜像已固定版本）"
  block_on_violation: false

# === F-REVIEW-209 DATA-FLOW-COMPLETENESS-FRONTEND（meta-rule #96 前端落地）===
data_flow_completeness_frontend:
  enabled: true
  severity: HIGH
  description: "前端数据操作（搜索/刷新）的结果必须在刷新后仍然可见（数据持久化闭环）"
  detection_signals:
    - "实时搜索结果刷新后丢失"
    - "API 返回数据但页面刷新后空白"
    - "前端操作未触发后端持久化"
  key_files:
    - "frontend/src/pages/Items/ItemList.tsx"
    - "frontend/src/api/task.ts"
  hard_constraints:
    rules:
      - name: "F-REVIEW-209 REFRESH-BUTTON-NO-PERSIST"
        pattern: "handleRefresh|onRefresh"
        scope: "frontend/src/"
        negative_pattern: "loadItems|fetchData|queryClient"
        message: "刷新按钮操作后必须重新加载持久化数据（meta-rule #96 / F-REVIEW-209），仅依赖内存状态会导致刷新后丢失"
        severity: HIGH
        auto_fix: false
      - name: "F-REVIEW-209 LIVE-MODE-NO-FALLBACK-TO-DB"
        pattern: "loadLive|liveMode|isLive"
        scope: "frontend/src/"
        negative_pattern: "loadItems|fetchList"
        message: "实时模式数据应有持久化回退路径（meta-rule #96 / F-REVIEW-209），live 模式数据刷新后必须能从 DB 重新加载"
        severity: MAJOR
        auto_fix: false
  applicable_scenarios:
    - "搜索/刷新/实时模式等前端数据操作"
    - "新增页面有数据加载功能时"
    - "数据刷新后丢失的问题排查"
  inapplicable_scenarios:
    - "纯前端状态（无需后端持久化）"
    - "调试/预览模式（明确为瞬态）"
  block_on_violation: true

# === F-REVIEW-210 REFRESH-MODE-HANDLING（刷新按钮模式处理）===
refresh_mode_handling:
  enabled: true
  severity: MAJOR
  description: "刷新按钮行为必须根据当前模式（实时/非实时）正确路由到不同 API"
  detection_signals:
    - "刷新按钮点击后数据不一致"
    - "实时模式下刷新未调用 live API"
    - "非实时模式下刷新未调用 refresh API"
  key_files:
    - "frontend/src/pages/Items/ItemList.tsx"
    - "frontend/src/pages/Evaluations/index.tsx"
    - "frontend/src/api/task.ts"
  hard_constraints:
    rules:
      - name: "F-REVIEW-210 REFRESH-IGNORES-MODE"
        pattern: "handleRefresh|onRefresh"
        scope: "frontend/src/pages/"
        negative_pattern: "isLive|liveMode|mode"
        message: "刷新函数必须检查当前模式（live/non-live）路由到不同 API（F-REVIEW-210），实时模式调 live API，非实时模式调 refresh API"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-210 REFRESH-NO-RELOAD-AFTER-REFRESH"
        pattern: "handleRefresh|onRefresh"
        scope: "frontend/src/pages/"
        negative_pattern: "loadItems|fetchData|mutate"
        message: "refresh API 调用成功后必须重新加载列表数据（F-REVIEW-210），否则前端仍显示旧数据"
        severity: HIGH
        auto_fix: false
  applicable_scenarios:
    - "商品列表、评估明细等有实时/非实时模式的页面"
    - "刷新按钮功能开发与审查"
    - "数据一致性问题排查"
  inapplicable_scenarios:
    - "无实时模式的纯列表页面"
    - "自动刷新（定时器驱动，无手动按钮）"
  block_on_violation: true

# === F-REVIEW-211 SSE-PRECHECK-HTTP-ERROR-CODE（meta-rule #93 落地）===
sse_precheck_http_error_code:
  enabled: true
  severity: MAJOR
  description: "SSE 流式响应前置检查必须返回标准 HTTP 错误码，业务阶段错误通过 SSE 事件传递"
  detection_signals:
    - "SSE 流中包含 404/400 等前置检查错误事件"
    - "前端需要解析 SSE 流才能发现资源不存在"
    - "所有错误都通过 SSE 事件传递，无 HTTP 错误码快速失败"
  key_files:
    - "frontend/src/api/task.ts"
    - "frontend/src/pages/Tasks/TaskList.tsx"
  hard_constraints:
    rules:
      - name: "F-REVIEW-211 SSE-PRECHECK-VIA-EVENT"
        pattern: "EventSource|text/event-stream|event_stream|sse"
        scope: "frontend/src/"
        negative_pattern: "HTTPException|raise.*404|raise.*400|response.status"
        message: "SSE 流式响应前置检查（资源存在性/参数合法性）必须返回标准 HTTP 错误码（404/400/403），禁止通过 SSE 事件传递前置错误（meta-rule #93 / F-REVIEW-211）"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-211 SSE-ERROR-STAGE-MISSING"
        pattern: "onEvent|handleSSE|sseEvent"
        scope: "frontend/src/"
        negative_pattern: "stage|error_stage|failed_stage"
        message: "SSE 业务阶段错误事件必须包含 stage 字段标识失败阶段（F-REVIEW-211），便于前端精准提示用户"
        severity: WARNING
        auto_fix: false
  applicable_scenarios:
    - "SSE 流式响应接口（实时搜索、批量处理、长任务进度反馈）"
    - "需要认证 Header 的 SSE 接口"
    - "多阶段任务的进度反馈"
  inapplicable_scenarios:
    - "普通 JSON 响应接口（无需 SSE 错误处理）"
    - "WebSocket 双向通信（错误处理机制不同）"
  block_on_violation: true

# === F-REVIEW-212 LIST-DERIVED-USEMEMO（前端性能优化）===
list_derived_usememo:
  enabled: true
  severity: MAJOR
  description: "列表派生计算（过滤/排序/统计）必须用 useMemo 包裹，避免每次渲染重复计算"
  detection_signals:
    - "列表页面渲染卡顿"
    - "filter/sort/reduce 在渲染路径内直接执行"
    - "大数据量列表无 useMemo 优化"
  key_files:
    - "frontend/src/pages/Tasks/TaskList.tsx"
    - "frontend/src/pages/Items/ItemList.tsx"
    - "frontend/src/pages/Orders/Orders.tsx"
  hard_constraints:
    rules:
      - name: "F-REVIEW-212 FILTER-WITHOUT-USEMEMO"
        pattern: "\\.filter\\(|\\.sort\\(|\\.reduce\\(|\\.map\\("
        scope: "frontend/src/pages/"
        negative_pattern: "useMemo"
        message: "列表派生计算（filter/sort/reduce/map 链式调用）必须用 useMemo 包裹（F-REVIEW-212），禁止在渲染路径内直接执行"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-212 USEMEMO-MISSING-DEPS"
        pattern: "useMemo\\("
        scope: "frontend/src/pages/"
        negative_pattern: "\\[.*\\]"
        message: "useMemo 必须指定完整依赖数组（F-REVIEW-212），依赖项为原始数据 + 过滤条件，禁止空数组或遗漏依赖"
        severity: WARNING
        auto_fix: false
  applicable_scenarios:
    - "列表页面的过滤、排序、统计等派生计算"
    - "大数据量列表（>100 条）的渲染优化"
    - "复杂计算（多步骤链式调用）的结果缓存"
  inapplicable_scenarios:
    - "简单字段访问（无需 memo）"
    - "频繁变更的依赖（会导致频繁重计算，应考虑其他优化方案）"
    - "小数据量列表（<20 条，性能影响可忽略）"
  block_on_violation: true

# === F-REVIEW-213 SSE-FETCH-READABLESTREAM（meta-rule #93 落地）===
sse_fetch_readablestream:
  enabled: true
  severity: MAJOR
  description: "需要自定义 Header 的 SSE 必须用 fetch+ReadableStream 而非 EventSource"
  detection_signals:
    - "EventSource 用于需要认证 token 的 SSE 接口"
    - "EventSource 无法传递 Authorization Header"
    - "SSE 接口认证失败"
  key_files:
    - "frontend/src/api/task.ts"
    - "frontend/src/api/index.ts"
  hard_constraints:
    rules:
      - name: "F-REVIEW-213 EVENTSOURCE-WITH-AUTH"
        pattern: "new EventSource\\("
        scope: "frontend/src/api/"
        negative_pattern: "fetch|ReadableStream|getReader"
        message: "需要自定义 Header（认证 token）的 SSE 必须用 fetch+ReadableStream（F-REVIEW-213），EventSource 不支持自定义 Header"
        severity: MAJOR
        auto_fix: false
      - name: "F-REVIEW-213 FETCH-SSE-NO-READABLESTREAM"
        pattern: "text/event-stream|event-stream"
        scope: "frontend/src/api/"
        negative_pattern: "getReader|ReadableStream"
        message: "fetch SSE 响应必须用 ReadableStream 解析（F-REVIEW-213），禁止用 .text() 一次性读取整个流"
        severity: WARNING
        auto_fix: false
  applicable_scenarios:
    - "需要认证 Header 的 SSE 接口"
    - "需要传递自定义参数的 SSE 接口"
    - "需要 POST 方法的 SSE 接口（EventSource 只支持 GET）"
  inapplicable_scenarios:
    - "无需自定义 Header 的 SSE（用 EventSource 更简单）"
    - "普通 JSON API（非流式响应）"
  block_on_violation: true

# === F-REVIEW-214~219 SPA 白屏修复复盘（v4.59.0，meta-rule #95 落地）===
# 复盘来源：docs/00-待完成/迭代提示词.md#L31-53（2026-07-22 React SPA 间歇性白屏修复）
# 关联技能：xianyu-hunter-dev step 254-261 / xianyu-auto-testing 模式 U
spa_white_screen_resilience:
  enabled: true
  globalErrorBoundary:
    required: true
    wrapperLocation: "App.tsx"
    fallbackType: "antd-result"
    scanCommand: "grep -c \"<ErrorBoundary\" frontend/src/App.tsx"
  lazyRetry:
    required: true
    maxRetries: 3
    retryStorageKeyPrefix: "__retry_"
    chunkErrorPatterns:
      - "Failed to fetch dynamically imported module"
      - "Loading chunk \\d+ failed"
      - "Loading CSS chunk \\d+ failed"
    scanCommand: "grep \"\\blazy(\" frontend/src/ | grep -v lazyRetry"
  routeErrorBoundary:
    required: true
    wrapperLocation: "MainLayout.tsx"
    resetKeyStrategy: "location.pathname"
    scanCommand: "grep \"resetKeys\" frontend/src/components/layout/MainLayout.tsx"
  apiArrayDefense:
    required: true
    arrayFieldPatterns:
      - "items"
      - "tables"
      - "list"
      - "records"
      - "data"
      - "results"
    scanCommand: "grep -E \"\\b(res|data|response)\\.(items|tables|list|records|data|results)\\.\" frontend/src/"
  http401Debounce:
    required: true
    redirectMethod: "replace"
    debounceFlag: "isRedirecting"
    scanCommand: "grep \"401\" frontend/src/api/client.ts"
  resetKeysConstraint:
    allowedTypes:
      - "string"
      - "number"
    forbiddenTypes:
      - "object"
      - "array"
  vitestEnvChecklist:
    required: true
    executablePath: "node_modules/.bin/vitest"
    configFiles:
      - "vitest.config.ts"
      - "src/test-setup.ts"
    tsconfigExcludePatterns:
      - "src/**/__tests__/**"
      - "src/**/*.test.*"
      - "src/**/*.spec.*"
  antdChineseButtonTestRegex:
    required: true
    recommendedPattern: "getByRole('button', { name: /文\\s*案/ })"
    forbiddenPattern: "getByText('文案')"

# === F-REVIEW-UI-PREVIEW-GATE UI视觉变更预确认门控（v4.60.0，12项历史问题复盘提炼）===
# 复盘来源：2026-07-23 12项历史问题四维度复盘
ui_preview_gate:
  enabled: true
  changeLineThreshold: 10
  previewStrategy: single_module_first
  triggerPatterns:
    - "import.*Icon"
    - "colorPrimary"
    - "borderRadius"
  exemptPatterns:
    - "Bug修复"
    - "文案修正"

# === F-REVIEW-STATE-SELECTION React状态选型检查（v4.60.0，12项历史问题复盘提炼）===
# 复盘来源：2026-07-23 12项历史问题四维度复盘
state_selection:
  enabled: true
  preferenceKeywords:
    - autoRefresh
    - viewMode
    - columnConfig
    - density
    - collapsed
    - expandedKeys
    - themePreference
    - recentItems
    - useCdp
  persistenceHookName: usePersistentState
  keyNamingPattern: "xh.<page>.<field>"

# === F-REVIEW-DEFENSIVE-RENDER SPA防御性渲染检查（v4.60.0，12项历史问题复盘提炼）===
# 复盘来源：2026-07-23 12项历史问题四维度复盘
spa_render_resilience:
  enabled: true
  requireGlobalErrorBoundary: true
  requireLazyRetry: true
  requireDefensiveAccess: true
  require401Debounce: true
  checkItems:
    - ErrorBoundary at root
    - lazyRetry wrapping React.lazy
    - optional chaining on API data
    - 401 interceptor debounce

# === F-REVIEW-COMPONENT-REUSE-RESET 组件复用状态重置检查（v4.60.0，12项历史问题复盘提炼）===
# 复盘来源：2026-07-23 12项历史问题四维度复盘
component_reuse_state_reset:
  enabled: true
  reuseContexts:
    - table_render
    - expanded_row_render
    - tab_panel_inactive
    - rowkey_contains_static_field
  resetValueDefaults:
    errored: false
    loading: false
    selected: false
    expanded: false

# ============== 重构安全性检查-前端侧（v4.61.0 新增）==============
# 对应 F-REVIEW-220~226 检查点（复盘规范集 A/B/D 三类前端版本落地）
# 配套规范：references/refactoring-safety-checks.md
# 所有阈值参数（执行时长、变更文件数、引用计数、内存阈值等）通过此节点集中管理，禁止硬编码
# 触发条件：本次变更为重构类操作（重命名/常量迁移/Hook改造/模块拆分/构建脚本变更）时触发
refactoring_safety_checks:
  _doc: "重构安全性检查配置（F-REVIEW-220~226），审查重构过程是否安全，所有阈值参数通过此节点管理不硬编码"

  # === F-REVIEW-220: 常量配置化 5 步法 ===
  # 为什么需要：常量重构最常见的失败是漏改引用点，机械替换无法覆盖所有引用
  constant_config_driven:
    enabled: true
    severity: MAJOR
    require_grep_before_refactor: true           # 重构前必须 grep 引用点
    require_tsc_verify_after: true               # 重构后必须 tsc --noEmit
    require_doc_sync: true                       # 注释/文档必须同步
    file_extensions_to_scan: [".ts", ".tsx"]     # grep 扫描扩展名
    constants_source_file: "src/config/constants.ts"  # 常量集中位置
    # 检测信号
    detection_signals:
      - "改动常量定义但未执行 grep 全量引用扫描 → 违规"
      - "常量已迁移到 constants.ts 但源文件仍保留旧的内联字面量 → 违规"
      - "注释或文档字符串中引用旧常量名未同步更新 → 违规"
      - "常量定义位置变更但未运行 tsc --noEmit 验证 → 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "常量从组件内联字面量迁移到 constants.ts"
      - "常量重命名（如 DEFAULT_INTERVAL → POLL_INTERVAL_MS）"
      - "常量值修改但需要核对所有引用点是否仍然兼容"
    inapplicable_scenarios:
      - "单次性临时变量（仅函数内部使用）"
      - "测试 fixture 中的 mock 数据"
      - "已被 ESLint no-restricted-syntax 规则覆盖的简单字面量替换"
    # 自动扫描规则
    hard_constraints:
      rules:
        - name: "F-REVIEW-220 CONSTANT-WITHOUT-DOC-SYNC"
          pattern: "export const \\w+ ="
          scope: "frontend/src/config/constants.ts"
          message: "常量重构后注释/文档必须同步更新引用的常量名（F-REVIEW-220），禁止遗留旧常量名引用"
          severity: MINOR
          auto_fix: false
    block_on_violation: false

  # === F-REVIEW-221: React Hooks 作用域契约 ===
  # 为什么需要：Hook 改造时混淆组件作用域和模块作用域会导致多实例共享状态
  react_hooks_scope_contract:
    enabled: true
    severity: HIGH
    forbid_module_level_mutable_in_component: true    # 禁止组件内修改模块级可变变量
    require_use_prefix_for_hooks: true                  # Hook 必须保留 use 前缀
    require_persistent_state_for_cross_mount: true      # 跨 mount 状态必须用 usePersistentState
    persistent_state_hook_name: "usePersistentState"    # 持久化 Hook 名称
    # 检测信号
    detection_signals:
      - "组件函数体内 useState/useRef 被改为模块级 let 变量 → 违规"
      - "自定义 Hook useXxx 被改为普通函数（丢失 use 前缀）→ 违规"
      - "模块级常量在组件 useEffect/事件回调中被直接修改 → 违规"
      - "组件 re-mount 后状态未恢复（导航离开再返回，筛选条件被保留）→ 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "Hook 重构（如 useXxx 拆分为多个 Hook 或合并）"
      - "组件状态管理方式变更（useState → Zustand/Context）"
      - "提取自定义 Hook（确认保留 use 前缀 + 内部调用 Hook）"
    inapplicable_scenarios:
      - "纯工具函数（无状态，无 Hook 调用）"
      - "模块级不可变常量（const CONFIG = Object.freeze({...})）"
      - "SSR 场景（需另行评估 hydration 一致性）"
    # 自动扫描规则
    hard_constraints:
      rules:
        - name: "F-REVIEW-221 MODULE-LEVEL-MUTABLE-IN-COMPONENT"
          pattern: "^let\\s+\\w+\\s*[:=]"
          scope: "frontend/src/pages/"
          negative_pattern: "use[A-Z]|useState|useRef"
          message: "组件文件中模块级 let 变量被组件修改会破坏状态隔离（F-REVIEW-221），多实例共享同一状态"
          severity: HIGH
          auto_fix: false
    block_on_violation: true

  # === F-REVIEW-222: 导入名称变更 checklist ===
  # 为什么需要：重命名导出符号时三类调用方修改方式不同，统一查找替换会导致调用方式错误
  import_name_change_checklist:
    enabled: true
    severity: MAJOR
    require_grep_before_rename: true                 # 重命名前必须 grep
    require_tsc_verify_after: true                   # 重命名后必须 tsc --noEmit
    require_lint_verify_after: true                  # 重命名后必须 eslint
    hook_call_patterns: ["use[A-Z]\\w*"]              # Hook 调用识别模式
    component_call_patterns: ["<[A-Z]\\w+"]          # 组件调用识别模式
    verify_command: "npm --prefix frontend run typecheck"
    # 检测信号
    detection_signals:
      - "删除导出名前未执行 grep from '<module>' import <name> 全量引用扫描 → 违规"
      - "Hook 重命名为普通函数后，调用方未同步加 () 调用 → 违规"
      - "函数重命名为组件后，调用方未同步改为 <NewName /> JSX 形式 → 违规"
      - "重命名后 tsc --noEmit 报错但未修复即提交 → 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "重命名导出符号（Hook/函数/组件/类型）"
      - "修改导出方式（export default → export / 反向）"
      - "拆分模块（如将 utils.ts 拆为 utils/format.ts + utils/date.ts）"
    inapplicable_scenarios:
      - "仅修改实现细节（不改变导出名）"
      - "内部私有变量重命名（不涉及外部引用）"
      - "自动生成的代码（由工具负责同步）"
    block_on_violation: false

  # === F-REVIEW-223: 长任务前端构建日志输出 ===
  # 为什么需要：PowerShell sink cmdlet 缓冲整个输出流，长任务执行时终端无反馈，开发者误以为卡死
  long_task_build_log_redirect:
    enabled: true
    severity: MAJOR
    long_task_threshold_seconds: 30        # 执行时长阈值（秒），超过即视为长任务
    forbidden_sink_cmdlets:                # 禁止的 sink cmdlet 清单
      - "Select-Object"
      - "Out-Host"
      - "Out-String"
      - "more"
      - "less"
    recommended_redirect_strategy: "Start-Process -RedirectStandardOutput"
    log_file_pattern: "build-{timestamp}.log"
    require_timeout: true                  # 长任务必须设置超时
    default_timeout_seconds: 300           # 默认超时 5 分钟
    long_task_commands:                    # 长任务命令清单
      - "npm run build"
      - "npm run typecheck"
      - "tsc --noEmit"
      - "vitest run"
      - "playwright test"
    # 检测信号
    detection_signals:
      - "构建脚本中使用 | Select-Object -Last N / | Out-Host -Paging / | more → 违规"
      - "构建命令未重定向输出到文件，超长输出无法回溯 → 违规"
      - "长任务脚本未设置超时（依赖人工中断）→ 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "PowerShell 终端执行前端构建/类型检查/测试"
      - "CI/CD 流水线中的长任务步骤"
      - "本地开发时运行 vitest/playwright"
    inapplicable_scenarios:
      - "bash/zsh/Git Bash 环境（管道行为不同）"
      - "短任务（执行时长 < 阈值，无需重定向）"
      - "IDE 内置终端的交互式命令（如 npm run dev 需实时输出）"
    # 自动扫描规则
    hard_constraints:
      rules:
        - name: "F-REVIEW-223 POWERSHELL-SINK-CMDLET"
          pattern: "\\|\\s*(Select-Object|Out-Host|Out-String|more|less)"
          scope: "*.ps1"
          message: "PowerShell 长任务禁止使用 sink cmdlet（F-REVIEW-223），会缓冲整个输出流导致终端无反馈，改用 Start-Process -RedirectStandardOutput"
          severity: MAJOR
          auto_fix: false
    block_on_violation: false

  # === F-REVIEW-224: 系统资源过载容错 ===
  # 为什么需要：大型 TypeScript 项目全量 tsc 检查内存占用可达 4GB+，触发 V8 堆内存限制导致崩溃
  system_resource_overload_tolerance:
    enabled: true
    severity: WARNING
    node_memory_threshold_mb: 4096                # Node 进程内存阈值（MB）
    long_task_threshold_seconds: 60              # 长任务判定阈值（秒）
    fallback_to_single_file: true                 # 卡住时 fallback 单文件检查
    single_file_check_command: "tsc --noEmit --skipLibCheck <file>"
    node_options_env: "--max-old-space-size=8192"  # Node 堆内存上限
    require_memory_monitor: true                  # 长任务必须监控 Node 内存
    oom_recovery_strategy: "single_file_check"   # OOM 后恢复策略
    # 检测信号
    detection_signals:
      - "tsc --noEmit 全量检查超过 long_task_threshold_seconds 仍无输出 → 违规"
      - "Node 进程内存占用超过 node_memory_threshold_mb → 违规"
      - "脚本未提供单文件检查 fallback 选项 → 违规"
      - "长任务未监控 Node 进程内存 → 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "大型 TypeScript 项目全量类型检查"
      - "CI/CD 流水线中 tsc 卡住无响应"
      - "本地开发时 vitest 执行大量测试用例"
    inapplicable_scenarios:
      - "小型项目（tsc 执行 < 30 秒）"
      - "非构建类任务（如纯 lint 检查）"
      - "已使用 SWC/esbuild 等快速类型检查工具"
    block_on_violation: false

  # === F-REVIEW-225: 跨文件引用同步校验 ===
  # 为什么需要：前端重构失败最高频根因是跨文件引用未同步，仅靠 IDE 重命名无法覆盖动态导入和字符串引用
  cross_file_contract_sync:
    enabled: true
    severity: CRITICAL
    require_grep_before_export_change: true      # 修改导出前必须 grep
    require_tsc_verify_after: true                # 重构后必须 tsc --noEmit
    require_lint_verify_after: true               # 重构后必须 eslint
    require_test_verify_after: true               # 重构后必须运行测试
    require_build_verify_after: true              # 重构后必须运行构建
    verify_commands:                              # 验证命令清单
      - "npm --prefix frontend run typecheck"
      - "npm --prefix frontend run lint"
      - "npm --prefix frontend test"
      - "npm --prefix frontend run build"
    scan_file_extensions: [".ts", ".tsx"]        # grep 扫描扩展名
    dynamic_import_patterns: ["import\\(", "require\\("]  # 动态导入识别模式
    # 检测信号
    detection_signals:
      - "修改导出符号（重命名/删除/改签名）前未 grep 所有引用点 → 违规"
      - "重构后未运行 tsc --noEmit 验证（catch ImportError/NameError）→ 违规"
      - "删除导出符号但未检查 import * as / require / 动态 import() 引用 → 违规"
      - "修改函数签名（参数数量/类型）但未同步更新所有调用方 → 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "删除/重命名导出符号（函数/类/类型/常量）"
      - "修改函数签名（参数数量/类型/顺序）"
      - "修改模块路径（如 @/utils/format → @/utils/currency）"
      - "拆分/合并模块文件"
    inapplicable_scenarios:
      - "仅修改实现细节（不改变导出 API）"
      - "测试代码内部重构（不影响生产代码）"
      - "自动生成的代码（由工具负责同步）"
    block_on_violation: true

  # === F-REVIEW-226: 状态持久化统一入口 ===
  # 为什么需要：业务参数硬编码导致修改需改代码重新部署，localStorage key 无命名空间导致跨页面冲突
  state_persistence_unified_entry:
    enabled: true
    severity: HIGH
    forbid_hardcoded_business_params: true        # 禁止业务参数硬编码
    require_namespace_for_localstorage: true      # localStorage key 必须有命名空间
    require_type_guard_for_state_read: true       # 状态读取必须有类型守卫
    namespace_prefix: "xh"                        # 命名空间前缀
    namespace_pattern: "xh\\.<page>\\.<field>"    # 命名空间正则
    business_params_source: "config"              # 业务参数来源（config/env/api）
    persistent_state_hook: "usePersistentState"   # 持久化 Hook 名称
    forbidden_hardcoded_patterns:                 # 禁止硬编码模式
      - "setInterval\\([^,]+,\\s*\\d+\\)"
      - "setTimeout\\([^,]+,\\s*\\d+\\)"
      - "localStorage\\.setItem\\(['\"][^'\".]+['\"]"  # 无命名空间的 key
    # 检测信号
    detection_signals:
      - "业务参数（轮询间隔/timeout/阈值）硬编码在组件内 → 违规"
      - "localStorage key 无命名空间（如 columns 而非 xh.orders.columns）→ 违规"
      - "状态读取无类型守卫（JSON.parse 不校验类型）→ 违规"
      - "不同页面的 localStorage key 命名风格不一致 → 违规"
    # 适用/不适用场景
    applicable_scenarios:
      - "业务参数（轮询间隔/timeout/阈值/重试次数）"
      - "用户偏好持久化（列配置/筛选条件/视图模式）"
      - "localStorage 状态管理"
      - "跨页面共享的状态"
    inapplicable_scenarios:
      - "一次性临时变量（无需持久化）"
      - "服务端状态（由 API 管理，使用 React Query/SWR）"
      - "临时 UI 状态（如 Modal open/close，无需持久化）"
    # 自动扫描规则
    hard_constraints:
      rules:
        - name: "F-REVIEW-226 HARDCODED-BUSINESS-PARAM"
          pattern: "setInterval\\([^,]+,\\s*\\d+\\)|setTimeout\\([^,]+,\\s*\\d+\\)"
          scope: "frontend/src/pages/"
          negative_pattern: "POLL_INTERVAL|TIMEOUT|constants"
          message: "业务参数（轮询间隔/timeout）禁止硬编码在组件内（F-REVIEW-226），必须从 config/constants 读取"
          severity: HIGH
          auto_fix: false
        - name: "F-REVIEW-226 LOCALSTORAGE-NO-NAMESPACE"
          pattern: "localStorage\\.setItem\\(['\"][^'\".]+['\"]"
          scope: "frontend/src/"
          message: "localStorage key 必须有命名空间（F-REVIEW-226），格式 xh.<page>.<field>，禁止无命名空间 key 导致跨页面冲突"
          severity: HIGH
          auto_fix: false
    block_on_violation: true

# ===== F-REVIEW-227~232 前端韧性 Review（v4.62.0 新增）=====
# 配套规范：coding-standards v1.3 §3.10-3.15
# 配套文件：references/frontend-resilience-checks.md
# 设计目标：治理 Markdown 预处理/React render 副作用/SSE 类型校验/定时器/可访问性/流式数据完整性六类前端韧性场景
# 所有阈值/正则/检测信号通过本节点管理，禁止硬编码
# 历史失败案例：AssistantMessage Markdown 替换破坏代码块 / Chatbot index.tsx render 阶段写 ref
frontend_resilience:
  enabled: true
  _doc: "前端韧性参数集中管理（F-REVIEW-227~232），覆盖 Markdown 预处理/React 副作用/SSE 类型/定时器/可访问性/数据完整性六类场景"

  # --- A 类：Markdown 预处理代码块保护 ---

  # F-REVIEW-227 MARKDOWN-PREPROCESS-CODEBLOCK-PROTECT
  markdown_preprocess_codeblock_protect:
    enabled: true
    severity: CRITICAL
    # 禁止直接对原始 Markdown 字符串做 replace
    forbid_direct_replace_on_markdown: true
    # 替换前必须分割代码块和行内代码
    require_codeblock_split: true
    # 代码块分割正则（匹配 ```...``` 和 `...`）
    codeblock_split_pattern: '(```[\s\S]*?```|`[^`]+`)'
    # 仅对非代码段（偶数索引）执行替换
    apply_replace_to_non_code_only: true
    # 检测信号
    detection_signals:
      - "对 content/processedContent 变量直接调用 .replace → 违规"
      - "Markdown 渲染前未做代码块分割 → 违规"
    applicable_scenarios:
      - "对 Markdown 字符串做脚注/公式/链接替换"
      - "自定义 Markdown 预处理流水线"
      - "富文本渲染前的内容清洗"
    inapplicable_scenarios:
      - "仅渲染 Markdown 不做替换"
      - "对纯文本（非 Markdown）的替换"

  # --- B 类：React render 阶段副作用禁令 ---

  # F-REVIEW-228 REACT-RENDER-SIDEFFECT-BAN
  react_render_sideffect_ban:
    enabled: true
    severity: CRITICAL
    # 禁止在函数组件主体内写 ref.current
    forbid_ref_write_in_render: true
    # ref 写入必须在 useEffect/useLayoutEffect 中
    require_use_effect_for_ref: true
    # 事件回调中写 ref 是合法的（不在 render 阶段）
    allow_ref_write_in_event_handler: true
    # 派生状态用 useMemo 而非 ref 缓存
    require_use_memo_for_derived_state: true
    # 检测信号
    detection_signals:
      - "函数组件主体内出现 .current = 赋值 → 违规"
      - "render 阶段修改外部变量/调用订阅 API → 违规"
    applicable_scenarios:
      - "所有 React 函数组件"
      - "自定义 Hook 的主体"
      - "使用 ref 的场景"
    inapplicable_scenarios:
      - "类组件的 constructor"
      - "事件处理函数内部"
      - "useEffect/useLayoutEffect 内部"

  # --- C 类：SSE 事件运行时类型校验 ---

  # F-REVIEW-229 SSE-EVENT-RUNTIME-TYPE-VALIDATION
  sse_event_runtime_type_validation:
    enabled: true
    severity: CRITICAL
    # 禁止用 as 强制断言 SSE 数据
    forbid_as_assertion: true
    # 必须用 zod schema 校验
    require_zod_schema: true
    # 必须用 safeParse 而非 parse（校验失败不抛错）
    require_safe_parse: true
    # 校验失败时降级返回 fallback 值
    require_fallback_on_invalid: true
    # schema 必须与后端 Pydantic 模型对齐
    require_backend_contract_alignment: true
    # 允许的校验库
    allowed_validation_libs:
      - zod
      - valibot
      - "@hookform/resolvers"
    # 检测信号
    detection_signals:
      - "JSON.parse(event.data) as XxxType → 违规"
      - "data.follow_ups as string[] → 违规"
      - "SSE 事件处理无 safeParse → 违规"
    applicable_scenarios:
      - "所有 SSE 事件数据处理"
      - "WebSocket 消息处理"
      - "从外部源读取的不可信数据"
    inapplicable_scenarios:
      - "内部纯函数间传递的数据"
      - "测试代码中的 mock 数据"

  # --- D 类：定时器清理与竞态防护 ---

  # F-REVIEW-230 TIMER-CLEANUP-RACE-GUARD
  timer_cleanup_race_guard:
    enabled: true
    severity: HIGH
    # 卸载时必须清理定时器
    require_cleanup_on_unmount: true
    # 重设前必须清除旧定时器
    require_clear_before_reset: true
    # 用 useRef 存储定时器 ID
    require_ref_for_timer_id: true
    # 禁止在 render 中创建定时器
    forbid_timer_in_render: true
    # 定时器类型与清理函数映射
    timer_cleanup_mapping:
      setTimeout: clearTimeout
      setInterval: clearInterval
    # 检测信号
    detection_signals:
      - "setTimeout/setInterval 无对应 cleanup → 违规"
      - "连续触发未清除旧定时器 → 违规"
      - "render 阶段创建定时器 → 违规"
    applicable_scenarios:
      - "所有使用 setTimeout/setInterval 的组件"
      - "防抖/节流实现"
      - "动画/过渡定时器"
      - "轮询场景"
    inapplicable_scenarios:
      - "一次性 Promise（配合 Promise.race 取消）"
      - "Web Worker 中的定时器"

  # --- E 类：交互元素可访问性 ---

  # F-REVIEW-231 INTERACTIVE-ELEMENT-A11Y
  interactive_element_a11y:
    enabled: true
    severity: MEDIUM
    # 非原生交互元素必须三件套齐全
    require_tabindex_role_keydown: true
    # 优先用语义化原生元素
    prefer_native_button: true
    # 焦点可见性
    require_focus_visible_style: true
    # 键盘事件必须处理 Enter 和 Space
    require_enter_and_space: true
    # 非原生交互元素标签
    non_native_interactive_tags:
      - "div"
      - "span"
      - "li"
      - "p"
    # 检测信号
    detection_signals:
      - "<div onClick> 无 tabIndex/role/onKeyDown → 违规"
      - "<span onClick> 无 role='button' → 违规"
      - "tabIndex > 0 但无 :focus-visible 样式 → 违规"
    applicable_scenarios:
      - "所有非原生交互元素（div/span/li 加 onClick）"
      - "自定义可点击组件"
      - "拖拽交互"
    inapplicable_scenarios:
      - "原生 button/a/input 等语义化元素"
      - "纯展示元素（无交互行为）"

  # --- F 类：流式响应 onComplete 数据完整性 ---

  # F-REVIEW-232 SSE-ONCOMPLETE-DATA-INTEGRITY
  sse_oncomplete_data_integrity:
    enabled: true
    severity: HIGH
    # 持久化判断基于"任一产出非空"
    require_any_output_check: true
    # 禁止仅检查主回答非空
    forbid_main_only_check: true
    # 所有产出字段都应传递给 onComplete
    require_all_outputs_passed: true
    # 所有产出为空时记录 WARNING
    require_warning_on_all_empty: true
    # 持久化条件示例（任一非空即持久化）
    persistence_condition_template: "content.length > 0 || followUps.length > 0 || title?.length > 0"
    # 检测信号
    detection_signals:
      - "if (content.length > 0) 仅检查主回答 → 违规"
      - "onComplete 未接收 followUps/title 参数 → 违规"
      - "所有产出为空但未记录 WARNING → 违规"
    applicable_scenarios:
      - "SSE 流式响应的完成回调"
      - "WebSocket 消息聚合的完成回调"
      - "多产出字段的持久化判断"
    inapplicable_scenarios:
      - "单一字段的持久化"
      - "临时缓存（不涉及持久化）"

  # 硬约束（违反则 P0 阻塞）
  hard_constraints:
    - '禁止对 Markdown 字符串直接做 replace 不分割代码块'
    - '禁止在 React 函数组件主体内写 ref.current'
    - '禁止用 as 强制断言 SSE 事件数据'
    - '禁止 setTimeout/setInterval 未在 useEffect cleanup 中清理'
    - '禁止非原生交互元素无 tabIndex/role/onKeyDown'

  # ========================================================================
  # v4.63.0 新增：资源创建幂等性与前端状态闭环（第八轮复盘落地）
  # 配套：xianyu-hunter-dev 规范 31-32 + coding-standards v1.3 §2.25-2.26
  # 后端联动：xianyu-backend-code-review v4.64.0 B-REVIEW-313~315
  # auto-testing 联动：xianyu-auto-testing 模式 AA
  # ========================================================================

  idempotent_resource_creation_frontend:

    # --- F-REVIEW-233 ASYNC-HANDLER-THREE-BRANCH ---
    # 前端 async handler 三分支完整性（success/else/catch 必须显示具体错误 + 调用 loadXxx 刷新状态）
    async_handler_three_branch:
      enabled: true
      severity: CRITICAL
      # 三分支都必须调用 loadXxx 刷新状态
      require_load_in_all_branches: true
      # else 分支禁止固定失败文案，必须显示后端 error/detail/message 字段
      require_specific_error_in_else: true
      # catch 分支必须用 extractApiError(e) 提取错误
      require_extract_api_error_in_catch: true
      # async handler 命名模式（可扩展）
      handler_patterns:
        - "handleStart"
        - "handleStop"
        - "handleCreate"
        - "handleUpdate"
        - "handleDelete"
        - "handleResume"
        - "handlePause"
        - "handleLaunch"
        - "handleRegister"
      # 状态刷新函数命名模式
      refresh_function_patterns:
        - "load"
        - "refresh"
        - "mutate"
        - "refetch"
      # 检测信号
      detection_signals:
        - "else 分支显示 message.error('启动失败') 等固定文案 → 违规"
        - "catch 分支无 loadXxx 调用 → 违规"
        - "success 分支无 loadXxx 刷新 → 违规"
      applicable_scenarios:
        - "所有触发网络请求的前端 async 事件 handler"
        - "资源创建/启动/停止/恢复类按钮 onClick"
        - "表单提交 onFinish handler"
      inapplicable_scenarios:
        - "纯查询的 loadXxx 函数（本身就是刷新函数）"
        - "不发起网络请求的本地状态变更"
        - "防抖/节流的中间函数（最终调用方仍需满足三分支要求）"

    # --- F-REVIEW-234 API-RETURN-TYPE-CONTRACT ---
    # API 函数返回类型契约（资源创建类 API 必须返回 OperationResult 接口）
    api_return_type_contract:
      enabled: true
      severity: HIGH
      # 资源创建类 API 必须使用的返回类型
      required_return_type: "OperationResult"
      # 资源创建类 API 函数命名模式
      api_function_patterns:
        - "start"
        - "create"
        - "register"
        - "launch"
        - "resume"
      # OperationResult 必须包含的幂等标志字段（至少一个）
      required_idempotent_fields:
        - "already_active"
        - "already_exists"
      # 禁止使用的返回类型
      forbidden_return_types:
        - "any"
        - "unknown"
        - "Promise<any>"
        - "Promise<unknown>"
      # OperationResult 接口定义位置
      operation_result_interface_path: "frontend/src/api/types.ts"
      # 必填字段
      required_fields:
        - "ok"
      # 可选字段
      optional_fields:
        - "already_active"
        - "already_exists"
        - "error"
        - "error_code"
        - "detail"
        - "message"
        - "affected_id"
        - "warnings"
      # 检测信号
      detection_signals:
        - "API 函数返回类型为 Promise<any> → 违规"
        - "OperationResult 接口缺少 already_active 字段 → 违规"
        - "调用点使用 as 强制断言 → 违规"
      applicable_scenarios:
        - "所有资源创建/启动/注册类前端 API 函数"
        - "后端响应结构变更时同步检查"
        - "新增 API 端点的类型契约对齐"
      inapplicable_scenarios:
        - "纯查询接口（用专用 DTO 类型）"
        - "SSE/WebSocket 流式响应（用专用 schema）"
        - "第三方 SDK 类型定义（无法控制）"

    # --- F-REVIEW-235 UI-BACKEND-STATE-CONSISTENCY ---
    # UI 与后端状态一致性强制刷新（写操作三分支必须刷新 + 业务状态必须来自 API）
    ui_backend_state_consistency:
      enabled: true
      severity: CRITICAL
      # 写操作后必须调用 loadXxx 刷新
      require_refresh_after_write: true
      # 三分支都必须刷新
      require_refresh_in_all_branches: true
      # 业务状态必须来自 API 响应，禁止前端 useState 独立维护
      require_api_source_for_business_state: true
      # loading 状态必须独立于业务状态
      require_independent_loading_state: true
      # 写操作命名模式
      write_operation_patterns:
        - "start"
        - "create"
        - "update"
        - "delete"
        - "stop"
        - "resume"
        - "pause"
      # 状态刷新函数命名模式
      refresh_function_patterns:
        - "load"
        - "refresh"
        - "mutate"
        - "refetch"
      # 检测信号
      detection_signals:
        - "写操作后无 loadXxx 调用 → 违规"
        - "业务状态用 useState 独立维护 → 违规"
        - "错误分支无 loadXxx 刷新 → 违规"
        - "loading 状态与业务状态耦合 → 违规"
      applicable_scenarios:
        - "所有涉及后端资源状态的前端 UI（会话/任务/连接状态）"
        - "写操作（创建/启动/停止/恢复）的前端 handler"
        - "网络不稳定或 fire-and-forget 后端调用场景"
      inapplicable_scenarios:
        - "纯前端 UI 状态（Modal 显示/表单输入值）"
        - "防抖/节流的中间状态"
        - "loading 状态本身（不需要从后端拉取）"

# ===== v4.65.0 新增（2026-07-25 第九轮复盘：搜索 Hook 模式 useSearch/useSearchHistory） =====

# 维度 48：搜索 Hook 模式（F-REVIEW-236~240，配套 xianyu-hunter-dev 规范 271-272 + coding-standards v1.3 §2.27）
search_hook_patterns:
  enabled: true
  severity: ERROR

  # Hook 文件位置（与 xianyu-hunter-dev/config/tech-stack.json#searchHookDebounce/searchHistoryPersistence 对齐）
  use_search_hook_file: "frontend/src/hooks/useSearch.ts"
  use_search_history_hook_file: "frontend/src/hooks/useSearchHistory.ts"

  # F-REVIEW-236 USE-SEARCH-DEBOUNCE-CONCURRENCY useSearch 防抖与并发保护
  use_search_debounce:
    # 默认防抖间隔 400ms（从 config 读取，禁止硬编码）
    debounce_ms: 400
    # 必须实现 requestId 并发保护（递增 requestIdRef.current，过期响应丢弃）
    require_request_id: true
    # 禁止在组件中直接 setTimeout(() => searchApi(keyword), 400)
    forbid_raw_settimeout: true
    # 防抖定时器清理：每次新输入触发时清除上一个 setTimeout
    require_clear_previous_timer: true
    # 检测信号
    grep_red_flags:
      - "setTimeout\\(.*search"
      - "setTimeout\\(.*fetch"
    # 适用场景
    applicable_scenarios:
      - "所有实时搜索场景（输入框搜索、下拉筛选、自动补全）"
      - "防抖+并发保护的列表查询"
    inapplicable_scenarios:
      - "按钮触发的搜索（无防抖需求）"
      - "分页跳转（无并发风险）"
      - "静态数据过滤（无 API 调用）"

  # F-REVIEW-237 USE-SEARCH-ENABLED-CLEANUP useSearch enabled 条件搜索与卸载清理
  use_search_enabled_cleanup:
    # 必须支持 enabled 参数控制是否发起请求
    require_enabled_param: true
    # useEffect cleanup 中必须清除 setTimeout
    require_cleanup_clearTimeout: true
    # useEffect cleanup 中必须递增 requestIdRef.current 丢弃进行中的请求
    require_cleanup_request_id_increment: true
    # enabled 从 false→true 时应自动触发首次搜索
    auto_trigger_on_enabled_change: true
    applicable_scenarios:
      - "条件搜索（如选择数据源后才允许搜索）"
      - "组件可能在请求完成前卸载的场景"
      - "Tab 切换时暂停搜索"
    inapplicable_scenarios:
      - "始终启用的搜索（enabled 永远为 true）"
      - "同步搜索（无异步请求）"

  # F-REVIEW-238 USE-SEARCH-HISTORY-PERSISTENCE useSearchHistory localStorage 持久化与去重
  use_search_history:
    # 必须实现 localStorage 持久化
    require_persistence: true
    # 必须实现去重（相同关键词只保留一条，LRU 语义）
    require_dedup: true
    # 历史记录上限（从 config 读取，禁止硬编码）
    max_items: 20
    # 空关键词不记录
    forbid_empty_keyword: true
    # JSON.parse 必须用 try/catch 包裹
    require_json_parse_try_catch: true
    applicable_scenarios:
      - "所有搜索场景的历史记录"
      - "用户可能重复搜索的关键词输入"
      - "跨会话保留的搜索偏好"
    inapplicable_scenarios:
      - "一次性搜索（如验证码输入）"
      - "敏感关键词（不应持久化）"
      - "临时筛选（如分页跳转）"

  # F-REVIEW-239 USE-SEARCH-HISTORY-NAMESPACE useSearchHistory 命名空间隔离与 storageKey useMemo 稳定
  use_search_history_namespace:
    # 必须支持 namespace 隔离
    require_namespace_isolation: true
    # storageKey 必须用 useMemo 固定，避免每次渲染生成新字符串
    require_storage_key_usememo: true
    # localStorage key 格式
    key_format: "search_history:{namespace}"
    # 禁止硬编码 namespace（应从 config 读取或作为 Hook 参数）
    forbid_hardcoded_namespace: true
    applicable_scenarios:
      - "多业务场景的搜索历史（商品搜索/卖家搜索/订单搜索等）"
      - "需要隔离不同页面搜索历史的场景"
    inapplicable_scenarios:
      - "单一搜索场景（无需 namespace）"
      - "服务端搜索历史（用 API 而非 localStorage）"

  # F-REVIEW-240 USE-SEARCH-HISTORY-DECLARATION-ORDER useSearchHistory Hooks 依赖顺序与声明顺序
  use_search_history_declaration_order:
    # storageKey useMemo 必须在 useCallback 之前声明
    require_usememo_before_usecallback: true
    # loadSessions useCallback 必须在依赖它的 addSession/removeSession 之前声明
    require_loadsessions_before_dependents: true
    # 初始化 useEffect 必须在所有 useCallback 之后声明
    require_useeffect_last: true
    # 禁止前向引用（引用尚未声明的 useCallback）
    forbid_forward_reference: true
    applicable_scenarios:
      - "所有使用 useSearchHistory 的组件"
      - "自定义 Hook 内部有 useCallback 依赖链的场景"
    inapplicable_scenarios:
      - "无依赖关系的并行 Hooks"
      - "纯 useState/useEffect 的简单 Hook"

# ===== 维度 49：UI 状态映射与外部链接安全（F-REVIEW-241~243，v4.66 新增） =====
# 来源：AI 服务菜单改造经验沉淀（状态映射集中配置、外部链接安全、预设切换归档加载）
# 配套 xianyu-hunter-dev/coding-standards §2.25（预设切换双步模式）+ §2.26（敏感数据后端主导原则）+ tech-stack.json#presetSwitchContract
ui_state_and_link_safety:
  enabled: true
  severity: ERROR

  # F-REVIEW-241 STATUS-DISPLAY-CENTRAL-MAP 状态映射集中配置
  # 设计原因：状态枚举→(文本/颜色/图标)映射散落 JSX 时，新增状态需多处修改，
  # 集中到 Record<Status, Display> 后只需改一处，且 TypeScript 会强制覆盖所有状态
  status_display_central_map:
    # 状态映射必须用 Record<Status, Display> 集中定义，禁止散落三元/switch
    require_central_record: true
    # Record 强制穷举所有枚举值（TypeScript 编译期检查）
    require_exhaustive_record: true
    # 映射对象必须包含：text（显示文本）、color（颜色）、icon（图标）
    required_fields: ["text", "color", "icon"]
    # 禁止在 JSX 中硬编码状态文本/颜色（如 {status === 'ok' ? '成功' : '失败'}）
    forbid_inline_status_branching: true
    grep_violation_patterns:
      - "status\\s*===\\s*['\"].*['\"]\\s*\\?"
      - "model_status\\s*===\\s*['\"].*['\"]\\s*\\?"
    # 适用：所有有"状态枚举+显示属性"的 UI（下载状态、连接状态、健康状态、任务状态）
    # 不适用：仅 2 个状态的简单布尔（如 enabled/disabled，可直接三元）；无枚举的自由文本
    applicable_scenarios:
      - "模型下载状态（downloaded/not_downloaded/remote/unknown）"
      - "连接测试结果（success/failure/timeout）"
      - "任务执行状态（pending/running/completed/failed）"
    inapplicable_scenarios:
      - "仅 2 个状态的简单布尔（enabled/disabled）"
      - "无枚举的自由文本展示"

  # F-REVIEW-242 EXTERNAL-LINK-SECURITY 外部链接安全属性
  # 设计原因：target="_blank" 不带 rel="noopener noreferrer" 时，新页面可通过 window.opener
  # 访问原页面，存在钓鱼/重定向攻击风险
  external_link_security:
    # 所有 target="_blank" 的链接必须带 rel="noopener noreferrer"
    require_rel_noopener: true
    # Antd Button href 模式也必须遵守（不只是 <a> 标签）
    include_antd_button_href: true
    # 内部路由链接（react-router Link to=）可豁免（同源无风险）
    exempt_same_origin: true
    # 用双引号字符串：正则中的 " 转义为 \"，' 原样保留
    grep_violation_patterns:
      - "target=[\"']_blank[\"'](?![^>]*rel=[\"'][^\"']*noopener)"
    # 适用：所有指向外部站点的链接（API Key 申请页、文档链接、官网）
    # 不适用：内部路由（react-router Link to="/..."）；下载链接（download 属性）
    applicable_scenarios:
      - "API Key 申请页跳转按钮"
      - "官方文档链接"
      - "外部服务官网"
    inapplicable_scenarios:
      - "内部路由（react-router Link to='/...'）"
      - "下载链接（<a download>）"

  # F-REVIEW-243 PRESET-SWITCH-ARCHIVE-LOAD 预设切换归档加载双步模式
  # 设计原因：切换预设时需归档当前 key 到旧预设 slot + 加载新预设 key，
  # 前端传 from_preset + to_preset 让后端原子完成，避免前端分别调两个接口
  preset_switch_archive_load:
    # 切换预设必须传 from_preset（归档源）+ to_preset（加载目标）
    require_from_and_to_preset: true
    # 前端禁止直接操作明文 key（只有脱敏值），所有 key 操作走后端
    forbid_frontend_plaintext_key: true
    # 切换后用后端返回的脱敏 key 更新输入框，禁止前端保留旧明文
    use_returned_masked_key: true
    # activePresetKey 状态管理：初始通过 base_url 反推，切换后更新
    require_active_preset_tracking: true
    # 适用：LLM/Embedding 预设切换；任何"多预设+独立凭证"场景
    # 不适用：单一配置（无预设概念）；前端纯展示无 key 操作
    applicable_scenarios:
      - "AI 服务 LLM 预设切换（OpenAI/DeepSeek/智谱等）"
      - "Embedding 服务预设切换（本地/OpenAI/Jina）"
      - "通知渠道预设切换（Server酱/PushPlus/Bark等）"
    inapplicable_scenarios:
      - "单一配置（无预设概念）"
      - "前端纯展示无 key 操作"

# ============================================================
# F-REVIEW-244 FRONTEND-TYPE-CONTRACT-REVERSE-VALIDATION 前端 types.ts 反向校验（v4.67.0 experimental）
# 配套规范：xianyu-hunter-dev meta-rule #110 + step 273 + coding-standards §2.27
# 配套后端检查点：B-REVIEW-330 TYPE-ANNOTATION-CONTRACT-ALIGNMENT
# 配置来源：复杂返回类型列表与权威源优先级从 tech-stack.json#hardConstraints.typeAnnotationContract 同步
# 设计原因：后端返回 list[dict] 但 types.ts 声明 Array<{url,hash}> 时，前端按 types.ts 取 .url/.hash 得到 undefined
# ============================================================
type_annotation_contract:
  enabled: true
  severity: HIGH
  experimental: true

  # 前端类型声明文件（前端权威源）
  types_ts_file: "frontend/src/api/types.ts"

  # 触发规范的复杂返回类型列表（从 tech-stack.json 同步）
  complex_return_types:
    - "list[dict]"
    - "list[TypedDict]"
    - "list[Pydantic BaseModel]"
    - "dict[str, Any]"

  # 权威源优先级（无后端 ResponseModel 时 types.ts 升级为权威源）
  authoritative_source: "pydantic_response_model"
  fallback_authoritative_source: "frontend_types_ts"

  # 字段类型映射（前端 TS ↔ 后端 Python）
  type_mapping:
    string: ["str"]
    number: ["int", "float"]
    boolean: ["bool"]
    Array: ["list", "tuple"]
    object: ["dict", "TypedDict", "BaseModel"]

  # 未声明字段检测（后端响应字段必须在 types.ts 中声明，除非可选）
  undeclared_field_detection: true
  optional_field_marker: "?"

  # 扫描范围
  scan_scope:
    frontend_scan_dirs:
      - "frontend/src/api/"
      - "frontend/src/pages/"
    type_declaration_regex: "(interface|type)\\s+\\w+\\s*[=:{]"

  # experimental 观察期管理
  experimental_governance:
    observation_period_quarters: 1
    observation_end_date: "2026-10-26"
    promotion_threshold: 2

  # 适用与不适用场景
  applicable_scenarios:
    - "前后端分离项目的前端类型层"
    - "后端函数返回复杂结构的端点"
    - "修复'前端显示 undefined'类 Bug 后的回归验证"
  inapplicable_scenarios:
    - "返回基本类型（str/int/bool）的端点"
    - "纯内部 helper 函数（无前端消费方）"
    - "动态结构通用序列化"
    - "已有 Pydantic ResponseModel 严格校验的端点（ResponseModel 本身即契约源，前端 types.ts 仅作参考）"

# ============================================================
# 健康状态展示与后端实际状态一致性（v4.68.0 新增）
# 规范源：xianyu-hunter-dev/references/dual-data-source-consistency.md
# ============================================================
health_display_consistency:
  enabled: true
  # cookie_valid=false 时是否区分"真失效"与"检查异常但功能可用"
  distinguishRealFailureFromCheckError: true
  # cookie_valid=false 时是否禁用功能入口（false=不禁用，仅提示）
  disableFeatureOnInvalid: false
  # 用户重新登录后是否立即刷新健康状态
  refreshAfterRelogin: true
  # 健康状态提示文案模板
  messageTemplates:
    cookieValid: "Cookie 状态正常"
    cookieRealFailure: "Cookie 已失效，请重新登录"
    tokenRenewing: "Token 过期，正在续期..."
    checkErrorButFunctional: "健康检查异常，但功能可能仍可用，建议刷新 Cookie"
  # 观察期配置
  observationPeriodQuarters: 1
  observationEndDate: "2026-10-26"
  promotionThreshold: 2

# ============== SPA 部署子路径（与 xianyu-auto-testing spa 节点对齐，禁止硬编码 /xianyu/） ==============
spa:
  # SPA 部署子路径（对应 vite.config.ts base 与 BrowserRouter basename；维度 41 / F-REVIEW-SPA-* 单一可信源）
  basename: "/xianyu"
  # API 前缀（对应前端 API_BASE 与后端双挂载前缀 /xianyu/api）
  api_prefix: "/xianyu/api"

# ===== F-REVIEW-227~228 构建产物图标与部署缓存（v4.70.0 新增）=====
# 配套：xianyu-hunter-dev meta-rule #112 + 复盘 retrospective-2026-08-12
# 设计目标：构建产物图标品牌一致性 / 部署缓存失效一致性
# 所有图标路径/尺寸/严重级通过本节点管理，技能本身不含硬编码值

build_artifact_icon:
  enabled: true
  brand_icon_path_default: "assets/xianyu-hunter.ico"
  forbid_system_icon_binding: true
  recommend_size_px: 256
  audit_signals:
    missing_installer_icon: 'SetupIconFile'
    missing_spec_icon: 'icon='
    system_icon_ref: 'shell32\.dll|imageres\.dll'
    manifest_icon_brand: 'manifest.webmanifest'

deploy_cache_invalidation:
  enabled: true
  require_sw_version_bump: true
  require_basename_consistency: true
  audit_signals:
    sw_no_version: 'serviceWorker|registration'
    basename_mismatch: 'location\.replace\([''""'']?[''""'']\)|start "".*/(app/)?'

proxy_redirect_safety:
  enabled: true
  # 是否经反向代理剥离前缀（Funnel 等）；true 时禁止 / -> /xianyu/ 类重定向
  strip_prefix_deployment: true
  # 新增全局重定向/中间件前必须核查这些约束关键词
  constraint_keywords:
    - "Funnel"
    - "proxy"
    - "redirect"
    - "loop"
  # 禁止的重定向模式（会造成前缀剥离回环）
  forbidden_redirect_patterns:
    - "root_to_subpath_redirect"
  meta_rule: "#120"
