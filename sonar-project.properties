# ===== SonarQube Multi-Component Project Configuration =====
# Project: Xianyu Hunter (闲鱼自动捡漏与抢单系统)
# Tech Stack: Python 3.10+ FastAPI backend + React 18 TypeScript frontend
# Generated: 2026-06-28
# Scanner: sonar-scanner-cli 8.0.1.6346
# Server: SonarQube 26.1.0.118079 (http://localhost:9000)

# --- Project Identity ---
sonar.projectKey=xianyu_hunter
sonar.projectName=Xianyu Hunter
sonar.projectVersion=0.1.0
sonar.projectDescription=Multi-component project: Python FastAPI backend + React TypeScript frontend

# --- Source Directories ---
# Backend (Python): backend/xianyu_hunter/
# Frontend (TypeScript/React): frontend/src/
sonar.sources=backend/xianyu_hunter,frontend/src

# --- Test Directories & Patterns ---
# Backend tests: tests/
# Frontend tests (nested in src/__tests__/): matched via test.inclusions
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/test_*.py,**/*_test.py

# --- Exclusions ---
# Skip dependencies, caches, build artifacts, static assets, generated files
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/*.pyc,**/dist/**,**/build/**,**/.venv/**,**/venv/**,**/coverage/**,**/test-setup.ts,**/vite-env.d.ts,**/*.svg,**/*.ico,**/*.html,**/*.css

# --- Coverage Exclusions ---
# Test files excluded from coverage metrics
sonar.coverage.exclusions=**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx,tests/**,frontend/src/**/__tests__/**

# --- Duplication Exclusions ---
# Config and template files are expected to share structural patterns
sonar.cpd.exclusions=**/*.yaml,**/*.yml,**/*.json,**/package-lock.json

# --- Language-Specific Settings ---
sonar.python.version=3.10
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# --- Coverage Report Paths ---
# Python coverage.py 生成的 Cobertura XML 报告
# 为什么显式声明：sonar-scanner 默认查找 .coverage 但不识别 coverage.xml，
# 必须显式指定 reportPaths 才能让 new_coverage 指标有数据
sonar.python.coverage.reportPaths=coverage.xml
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Encoding ---
sonar.sourceEncoding=UTF-8
