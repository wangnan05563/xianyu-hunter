{% extends "base.html" %}
{% block content %}
<div x-data="maintenancePage()" x-init="init()">
  <div class="page-header">
    <div>
      <h1>系统维护</h1>
      <div class="subtitle">缓存清理 · 数据库清理 · 日志清理</div>
    </div>
    <button class="btn btn-sm" @click="loadStatus()">↻ 刷新状态</button>
  </div>

  <!-- 存储状态概览 -->
  <div class="card mb-16" x-show="status">
    <h3 style="margin-bottom: 12px;">存储状态</h3>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
      <div>
        <div class="muted" style="font-size: 12px;">数据库</div>
        <div style="font-size: 24px; font-weight: 600;" x-text="(status?.db?.db_size_mb ?? 0) + ' MB'"></div>
        <div class="muted" style="font-size: 12px;" x-text="
          (status?.db?.tasks ?? 0) + ' 任务 · ' +
          (status?.db?.items ?? 0) + ' 商品 · ' +
          (status?.db?.events ?? 0) + ' 事件'
        "></div>
      </div>
      <div>
        <div class="muted" style="font-size: 12px;">日志文件</div>
        <div style="font-size: 24px; font-weight: 600;" x-text="(status?.logs?.total_size_mb ?? 0) + ' MB'"></div>
        <div class="muted" style="font-size: 12px;" x-text="(status?.logs?.file_count ?? 0) + ' 个文件' + (status?.logs?.oldest ? ' · 最早 ' + status.logs.oldest : '')"></div>
      </div>
      <div>
        <div class="muted" style="font-size: 12px;">缓存</div>
        <div style="font-size: 24px; font-weight: 600;" x-text="((status?.cache?.browser_data_mb ?? 0) + (status?.cache?.pycache_mb ?? 0)).toFixed(2) + ' MB'"></div>
        <div class="muted" style="font-size: 12px;" x-text="
          '浏览器 ' + (status?.cache?.browser_data_mb ?? 0) + 'MB · ' +
          'Py缓存 ' + (status?.cache?.pycache_count ?? 0) + '个/' + (status?.cache?.pycache_mb ?? 0) + 'MB'
        "></div>
      </div>
    </div>
  </div>

  <!-- 三个清理卡片 -->
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">

    <!-- 缓存清理 -->
    <div class="card">
      <h3>缓存清理</h3>
      <p class="muted" style="font-size: 13px; margin-bottom: 12px;">清理浏览器数据目录和 Python 缓存文件</p>
      <div style="margin-bottom: 12px;">
        <label class="muted" style="font-size: 12px;">清理范围</label>
        <select x-model="cacheForm.target" style="width: 100%; margin-top: 4px;">
          <option value="all">全部缓存</option>
          <option value="browser_data">浏览器数据</option>
          <option value="temp">临时文件</option>
        </select>
      </div>
      <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
        <input type="checkbox" x-model="cacheForm.dry_run"> 仅预览（不实际执行）
      </label>
      <button class="btn btn-sm" @click="cleanupCache()" :disabled="cacheLoading"
              style="width: 100%;">
        <span x-show="!cacheLoading">清理缓存</span>
        <span x-show="cacheLoading">清理中...</span>
      </button>
      <div x-show="cacheResult" x-cloak style="margin-top: 12px; font-size: 13px;">
        <div x-show="cacheResult?.cleaned?.length" style="color: var(--green);">
          <div x-text="'完成 ' + (cacheResult?.count ?? 0) + ' 项'"></div>
          <template x-for="item in (cacheResult?.cleaned || [])">
            <div class="muted" style="font-size: 12px;" x-text="item"></div>
          </template>
        </div>
        <div x-show="cacheResult?.errors?.length" style="color: var(--red);">
          <template x-for="err in (cacheResult?.errors || [])">
            <div style="font-size: 12px;" x-text="err"></div>
          </template>
        </div>
      </div>
    </div>

    <!-- 数据库清理 -->
    <div class="card">
      <h3>数据库清理</h3>
      <p class="muted" style="font-size: 13px; margin-bottom: 12px;">清理冗余数据并压缩数据库</p>
      <div style="margin-bottom: 12px;">
        <label class="muted" style="font-size: 12px;">清理范围</label>
        <select x-model="dbForm.target" style="width: 100%; margin-top: 4px;">
          <option value="all">全部清理</option>
          <option value="old_events">旧事件记录</option>
          <option value="old_items">旧未关联商品</option>
          <option value="sold_items">已售商品关联</option>
          <option value="vacuum">VACUUM 压缩</option>
        </select>
      </div>
      <div style="margin-bottom: 12px;">
        <label class="muted" style="font-size: 12px;">保留天数</label>
        <input type="number" x-model.number="dbForm.days" min="1" max="365" style="width: 100%; margin-top: 4px;">
      </div>
      <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
        <input type="checkbox" x-model="dbForm.dry_run"> 仅预览（不实际执行）
      </label>
      <button class="btn btn-sm" @click="cleanupDatabase()" :disabled="dbLoading"
              style="width: 100%;">
        <span x-show="!dbLoading">清理数据库</span>
        <span x-show="dbLoading">清理中...</span>
      </button>
      <div x-show="dbResult" x-cloak style="margin-top: 12px; font-size: 13px;">
        <div x-show="dbResult?.cleaned?.length" style="color: var(--green);">
          <div x-text="'删除 ' + (dbResult?.total_deleted ?? 0) + ' 条'"></div>
          <template x-for="item in (dbResult?.cleaned || [])">
            <div class="muted" style="font-size: 12px;" x-text="item"></div>
          </template>
        </div>
        <div x-show="dbResult?.errors?.length" style="color: var(--red);">
          <template x-for="err in (dbResult?.errors || [])">
            <div style="font-size: 12px;" x-text="err"></div>
          </template>
        </div>
      </div>
    </div>

    <!-- 日志清理 -->
    <div class="card">
      <h3>日志清理</h3>
      <p class="muted" style="font-size: 13px; margin-bottom: 12px;">清理旧日志文件释放磁盘空间</p>
      <div style="margin-bottom: 12px;">
        <label class="muted" style="font-size: 12px;">清理规则</label>
        <select x-model="logForm.target" style="width: 100%; margin-top: 4px;">
          <option value="old_logs">按天数清理</option>
          <option value="large_logs">大文件清理 (>10MB)</option>
          <option value="all">全部清理</option>
        </select>
      </div>
      <div style="margin-bottom: 12px;" x-show="logForm.target === 'old_logs' || logForm.target === 'all'">
        <label class="muted" style="font-size: 12px;">保留天数</label>
        <input type="number" x-model.number="logForm.days" min="1" max="365" style="width: 100%; margin-top: 4px;">
      </div>
      <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
        <input type="checkbox" x-model="logForm.dry_run"> 仅预览（不实际执行）
      </label>
      <button class="btn btn-sm" @click="cleanupLogs()" :disabled="logLoading"
              style="width: 100%;">
        <span x-show="!logLoading">清理日志</span>
        <span x-show="logLoading">清理中...</span>
      </button>
      <div x-show="logResult" x-cloak style="margin-top: 12px; font-size: 13px;">
        <div x-show="logResult?.cleaned?.length" style="color: var(--green);">
          <div x-text="'释放 ' + (logResult?.total_freed_mb ?? 0) + ' MB'"></div>
          <template x-for="item in (logResult?.cleaned || [])">
            <div class="muted" style="font-size: 12px;" x-text="item"></div>
          </template>
        </div>
        <div x-show="logResult?.errors?.length" style="color: var(--red);">
          <template x-for="err in (logResult?.errors || [])">
            <div style="font-size: 12px;" x-text="err"></div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function maintenancePage() {
  return {
    status: null,
    cacheForm: { target: 'all', dry_run: true },
    dbForm: { target: 'all', days: 30, dry_run: true },
    logForm: { target: 'old_logs', days: 7, dry_run: true },
    cacheLoading: false,
    dbLoading: false,
    logLoading: false,
    cacheResult: null,
    dbResult: null,
    logResult: null,

    async init() {
      await this.loadStatus();
    },

    async loadStatus() {
      try {
        const r = await fetch('/api/maintenance/status', { credentials: 'include' }).then(r => r.json());
        this.status = r;
      } catch (e) {
        console.error('加载状态失败', e);
      }
    },

    async cleanupCache() {
      if (!this.cacheForm.dry_run && !confirm('确认清理缓存？此操作不可撤销。')) return;
      this.cacheLoading = true;
      this.cacheResult = null;
      try {
        const r = await fetch('/api/maintenance/cache', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(this.cacheForm),
        }).then(r => r.json());
        this.cacheResult = r;
        if (!this.cacheForm.dry_run) await this.loadStatus();
      } catch (e) {
        this.cacheResult = { errors: [String(e)] };
      } finally {
        this.cacheLoading = false;
      }
    },

    async cleanupDatabase() {
      if (!this.dbForm.dry_run && !confirm('确认清理数据库？建议先备份数据。此操作不可撤销。')) return;
      this.dbLoading = true;
      this.dbResult = null;
      try {
        const r = await fetch('/api/maintenance/database', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(this.dbForm),
        }).then(r => r.json());
        this.dbResult = r;
        if (!this.dbForm.dry_run) await this.loadStatus();
      } catch (e) {
        this.dbResult = { errors: [String(e)] };
      } finally {
        this.dbLoading = false;
      }
    },

    async cleanupLogs() {
      if (!this.logForm.dry_run && !confirm('确认清理日志文件？此操作不可撤销。')) return;
      this.logLoading = true;
      this.logResult = null;
      try {
        const r = await fetch('/api/maintenance/logs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(this.logForm),
        }).then(r => r.json());
        this.logResult = r;
        if (!this.logForm.dry_run) await this.loadStatus();
      } catch (e) {
        this.logResult = { errors: [String(e)] };
      } finally {
        this.logLoading = false;
      }
    },
  };
}
</script>
{% endblock %}
