{% extends "base.html" %}
{% block content %}
<div x-data="timelinePage()" x-init="init()">
  <div class="page-header">
    <div>
      <h1>事件中心</h1>
      <div class="subtitle">统一时间线 · 订单 · 事件（评估/日志子集）</div>
    </div>
    <div>
      <button class="btn btn-sm" @click="refresh()">↻ 刷新</button>
    </div>
  </div>

  <!--
    过滤区：3 个独立维度，组合生效
    - 数据源：orders / events（评估/日志在 events 子集里）
    - 时间窗：1h / 24h / 7d / 全部
    - 任务：下拉选具体 task_id
    设计取舍：不做"按事件类型"二级过滤——避免界面元素爆炸；先用关键词搜索补足
  -->
  <div class="card mb-16 tl-filter">
    <div class="tl-filter-row">
      <div class="tl-filter-grp">
        <label>数据源</label>
        <div class="tl-pills">
          <button class="tl-pill" :class="filters.types.includes('orders') ? 'on' : ''" @click="toggleType('orders')">📦 订单</button>
          <button class="tl-pill" :class="filters.types.includes('events') ? 'on' : ''" @click="toggleType('events')">📡 事件</button>
        </div>
      </div>
      <div class="tl-filter-grp">
        <label>时间窗</label>
        <div class="tl-pills">
          <template x-for="r in timeRanges" :key="r.value">
            <button class="tl-pill" :class="filters.range === r.value ? 'on' : ''" @click="filters.range = r.value; refresh()">
              <span x-text="r.label"></span>
            </button>
          </template>
        </div>
      </div>
      <div class="tl-filter-grp tl-filter-grow">
        <label>搜索</label>
        <input type="search" x-model="filters.q" @input.debounce.300ms="applyFilter()" placeholder="关键词（订单标题 / 事件 payload）">
      </div>
    </div>
    <div class="tl-filter-row" style="margin-top: 8px;">
      <!-- P2-UX-12：严重度多选过滤
        - 设计动机：日常 info 量级很大（每条 evaluate / heartbeat），用户排障时只想看 warn/err
        - 多选而非单选：info+err 组合也常见（"我想看 error 但保留评估 info"）
        - 默认全选：保留"看到全部"这条最短路径，不强制用户先点 4 次
        - "全部 / 清除"快捷按钮：全空（隐藏所有事件）这种边界操作比 3 次点 on/off 顺手
        - orders 不受 level 过滤影响（订单有自己的 status 维度，不应被 level 概念覆盖）
      -->
      <div class="tl-filter-grp">
        <label>严重度 <span class="muted" style="font-weight: 400;">· 仅事件</span></label>
        <div class="tl-pills">
          <button class="tl-pill" :class="(filters.levels.length === 1 && filters.levels[0] === 'all') ? 'on' : ''" @click="setAllLevels()">全部</button>
          <button class="tl-pill" :class="filters.levels.length === 0 ? 'on' : ''" @click="clearLevels()">清除</button>
          <span class="tl-pill-sep"></span>
          <button class="tl-pill level-info" :class="filters.levels.includes('info') ? 'on' : ''" @click="toggleLevel('info')">ℹ️ info</button>
          <button class="tl-pill level-warn" :class="filters.levels.includes('warn') ? 'on' : ''" @click="toggleLevel('warn')">⚠️ warn</button>
          <button class="tl-pill level-err" :class="filters.levels.includes('err') ? 'on' : ''" @click="toggleLevel('err')">🔴 err</button>
        </div>
      </div>
    </div>
    <div class="tl-filter-row" style="margin-top: 8px;">
      <!-- 事件类型过滤：与通知订阅规则联动 -->
      <div class="tl-filter-grp">
        <label>事件类型 <button class="btn btn-ghost btn-xs" @click="syncFromNotifier()" title="从通知配置同步订阅规则" style="font-size: 10px; padding: 0 4px;">↻ 同步订阅</button></label>
        <div class="tl-pills" style="flex-wrap: wrap; max-width: 600px;">
          <button class="tl-pill" :class="filters.eventTypes.length === 0 ? 'on' : ''" @click="clearEventTypes()">全部</button>
          <span class="tl-pill-sep"></span>
          <template x-for="et in allEventTypeOptions" :key="et.value">
            <button class="tl-pill" :class="filters.eventTypes.includes(et.value) ? 'on' : ''"
                    @click="toggleEventType(et.value)" style="font-size: 11px;"
                    :title="et.label">
              <span x-text="et.label"></span>
            </button>
          </template>
        </div>
      </div>
    </div>
    <div class="tl-filter-row" style="margin-top: 8px;">
      <div class="tl-filter-grp tl-filter-grow">
        <label>任务</label>
        <select x-model="filters.taskId" @change="refresh()">
          <option value="">全部任务</option>
          <template x-for="t in tasks" :key="t.id">
            <option :value="t.id" x-text="(t.name || t.keyword || t.id) + '  (' + t.id + ')'"></option>
          </template>
        </select>
      </div>
      <div class="tl-meta muted" x-show="items.length > 0">
        共 <span x-text="items.length"></span> 条 · <span x-text="filteredCount"></span> 条匹配 ·
        <span x-show="levelTotal > 0">事件 <span x-text="levelMatched"></span>/<span x-text="levelTotal"></span> · </span>
        <span x-text="dataTs || '加载中...'"></span>
      </div>
    </div>
  </div>

  <!-- 时间线本体 -->
  <div class="card tl-list" x-ref="list">
    <template x-for="(it, idx) in filteredItems" :key="idx">
      <div class="tl-item" :class="it._kind + ' ' + (it.status || '')">
        <div class="tl-rail">
          <div class="tl-dot" :class="tlKindClass(it)"></div>
          <div class="tl-line" x-show="idx < filteredItems.length - 1"></div>
        </div>
        <div class="tl-body">
          <div class="tl-1">
            <span class="tl-time mono" x-text="fmtTime(it._ts)"></span>
            <span class="tl-kind-pill" :class="tlKindClass(it)" x-text="tlKindLabel(it)"></span>
            <span class="tl-status-pill" x-show="it.status" :class="'st-' + (it.status || 'unknown')" x-text="it.status"></span>
            <span class="tl-task muted mono" x-show="it.task_id" x-text="taskLabel(it.task_id)"></span>
          </div>
          <div class="tl-2" x-text="tlTitle(it)"></div>
          <div class="tl-3 muted" x-show="it.amount || it.score !== undefined || tlPayloadText(it)">
            <span x-show="it.amount">¥<span x-text="it.amount"></span></span>
            <span x-show="it.score !== undefined && it.score !== null"> · 评分 <span x-text="it.score"></span></span>
            <span x-show="tlPayloadText(it)" x-text="' · ' + tlPayloadText(it)"></span>
          </div>
        </div>
      </div>
    </template>
    <div class="empty" x-show="!loading && filteredItems.length === 0">
      <div class="ico">▱</div>
      <h3>暂无匹配项</h3>
      <p class="muted">调整上方过滤条件，或点击 ↻ 刷新</p>
    </div>
    <div class="loading-state" x-show="loading">
      <div class="spinner"></div>
      <span>加载中...</span>
    </div>
  </div>
</div>

<script>
function timelinePage() {
  return {
    items: [],
    filteredItems: [],
    tasks: [],
    loading: true,
    dataTs: '',
    timeRanges: [
      { value: '1h', label: '最近 1 小时' },
      { value: '24h', label: '最近 24 小时' },
      { value: '7d', label: '最近 7 天' },
      { value: 'all', label: '全部' },
    ],
    filters: {
      // 默认两个都开；时间窗 24h（与方案对齐："异常高发时段"重点关注）
      types: ['orders', 'events'],
      range: '24h',
      q: '',
      taskId: '',
      // P2-UX-12：严重度多选，'all' = 不限；默认全选 = 保留"看到全部"最短路径
      levels: ['all'],
      // 事件类型过滤：空数组 = 不过滤（显示全部）；非空 = 只显示匹配的事件类型
      eventTypes: [],
    },
    // 所有事件类型选项（与 domain/events.py EventType 对齐）
    allEventTypeOptions: [
      { value: 'item.discovered', label: '发现商品' },
      { value: 'eval.passed', label: '评估通过' },
      { value: 'eval.rejected', label: '评估拒绝' },
      { value: 'buy.requested', label: '请求购买' },
      { value: 'buy.succeeded', label: '购买成功' },
      { value: 'buy.failed', label: '购买失败' },
      { value: 'notify.sent', label: '通知已发送' },
      { value: 'waf.triggered', label: '风控触发' },
      { value: 'login.expired', label: '登录过期' },
      { value: 'task.started', label: '任务启动' },
      { value: 'task.paused', label: '任务暂停' },
      { value: 'task.error', label: '任务异常' },
    ],
    // 范围对应小时数；0 = 不限（用于 ?range=all）
    get rangeHours() {
      const m = { '1h': 1, '24h': 24, '7d': 24 * 7, 'all': 0 };
      return m[this.filters.range] ?? 24;
    },
    get filteredCount() { return this.filteredItems.length; },
    async init() {
      // 任务列表先行（用于 filter 下拉）
      try {
        const r = await fetch('/api/tasks', { credentials: 'include' }).then(r => r.json());
        this.tasks = (r.items || []).filter(t => t.status !== 'deleted');
      } catch (_) {}
      // 从通知配置读取事件订阅规则，作为事件类型过滤的初始状态
      // 这样用户在通知配置页勾选的事件类型，在时间线中会自动高亮过滤
      try {
        const cfg = await fetch('/api/config', { credentials: 'include' }).then(r => r.json());
        const subscribed = cfg?.notifier?.subscribed_events || [];
        // 将大写枚举名（如 EVAL_PASSED）转为小写点分格式（如 eval.passed）
        const enumToDot = {
          'ITEM_DISCOVERED': 'item.discovered',
          'EVAL_PASSED': 'eval.passed',
          'EVAL_REJECTED': 'eval.rejected',
          'BUY_REQUESTED': 'buy.requested',
          'BUY_SUCCEEDED': 'buy.succeeded',
          'BUY_FAILED': 'buy.failed',
          'NOTIFY_SENT': 'notify.sent',
          'WAF_TRIGGERED': 'waf.triggered',
          'LOGIN_EXPIRED': 'login.expired',
          'TASK_STARTED': 'task.started',
          'TASK_PAUSED': 'task.paused',
          'TASK_ERROR': 'task.error',
        };
        const mapped = subscribed.map(e => enumToDot[e]).filter(Boolean);
        if (mapped.length > 0 && mapped.length < this.allEventTypeOptions.length) {
          // 只订阅了部分事件 → 用订阅列表作为过滤条件
          this.filters.eventTypes = mapped;
        }
        // 全部订阅或空订阅 → 不过滤（显示全部）
      } catch (_) {}
      // 如果 URL 带 ?ref=o123 高亮定位（其他页跳过来用）
      const params = new URLSearchParams(location.search);
      const ref = params.get('ref');
      if (ref) this.filters.q = ref;
      // P2-UX-12：?levels=warn,err 从 URL 恢复（深链 / 分享场景）
      const levelsRaw = params.get('levels');
      if (levelsRaw !== null) {
        const valid = ['info', 'warn', 'err'];
        const parsed = levelsRaw.split(',').map(s => s.trim()).filter(s => valid.includes(s));
        this.filters.levels = parsed.length ? parsed : ['all'];
      }
      // ?event_types=eval.passed,buy.succeeded 从 URL 恢复事件类型过滤
      const evtTypesRaw = params.get('event_types');
      if (evtTypesRaw !== null) {
        const validValues = this.allEventTypeOptions.map(o => o.value);
        const parsed = evtTypesRaw.split(',').map(s => s.trim()).filter(s => validValues.includes(s));
        this.filters.eventTypes = parsed;
      }
      await this.refresh();
    },
    async refresh() {
      this.loading = true;
      try {
        const types = this.filters.types.join(',');
        const url = new URL('/api/timeline', location.origin);
        url.searchParams.set('types', types || 'orders,events');
        url.searchParams.set('limit', '300');
        if (this.filters.taskId) url.searchParams.set('task_id', this.filters.taskId);
        const r = await fetch(url, { credentials: 'include' }).then(r => r.json());
        this.items = r.items || [];
        this.dataTs = r.ts || '';
        this.applyFilter();
      } catch (e) {
        this.items = [];
        this.filteredItems = [];
      } finally {
        this.loading = false;
      }
    },
    toggleType(t) {
      const i = this.filters.types.indexOf(t);
      if (i >= 0) this.filters.types.splice(i, 1);
      else this.filters.types.push(t);
      // 至少保留一个数据源
      if (this.filters.types.length === 0) this.filters.types.push(t);
      this.refresh();
    },
    // 纯客户端过滤：时间窗 + 关键词 + 严重度 + 事件类型
    applyFilter() {
      const q = (this.filters.q || '').trim().toLowerCase();
      const hours = this.rangeHours;
      const cutoff = hours > 0 ? Date.now() - hours * 3600 * 1000 : 0;
      const levels = this.filters.levels;
      const levelFilterOn = !(levels.length === 1 && levels[0] === 'all');
      const eventTypes = this.filters.eventTypes;
      const eventTypeFilterOn = eventTypes.length > 0;
      this.filteredItems = this.items.filter(it => {
        // 时间窗
        const ts = Date.parse((it._ts || '').replace(' ', 'T'));
        if (cutoff > 0 && (isNaN(ts) || ts < cutoff)) return false;
        // 严重度（仅对 events 生效，orders 始终通过）
        if (levelFilterOn && it._kind === 'event') {
          const lvl = this.tlKindClass(it);
          if (!levels.includes(lvl)) return false;
        }
        // 事件类型过滤（仅对 events 生效，orders 始终通过）
        if (eventTypeFilterOn && it._kind === 'event') {
          if (!eventTypes.includes(it.type)) return false;
        }
        // 关键词（不输入就放过）
        if (!q) return true;
        const hay = [
          it.title, it.item_title, it.payload, it.message, it.type, it.status, it.task_id,
        ].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
    },
    // 事件类型过滤交互
    toggleEventType(evtType) {
      const i = this.filters.eventTypes.indexOf(evtType);
      if (i >= 0) {
        this.filters.eventTypes.splice(i, 1);
      } else {
        this.filters.eventTypes.push(evtType);
      }
      this.applyFilter();
    },
    clearEventTypes() {
      this.filters.eventTypes = [];
      this.applyFilter();
    },
    // 从通知配置同步事件订阅规则到时间线过滤
    async syncFromNotifier() {
      try {
        const cfg = await fetch('/api/config', { credentials: 'include' }).then(r => r.json());
        const subscribed = cfg?.notifier?.subscribed_events || [];
        const enumToDot = {
          'ITEM_DISCOVERED': 'item.discovered', 'EVAL_PASSED': 'eval.passed',
          'EVAL_REJECTED': 'eval.rejected', 'BUY_REQUESTED': 'buy.requested',
          'BUY_SUCCEEDED': 'buy.succeeded', 'BUY_FAILED': 'buy.failed',
          'NOTIFY_SENT': 'notify.sent', 'WAF_TRIGGERED': 'waf.triggered',
          'LOGIN_EXPIRED': 'login.expired', 'TASK_STARTED': 'task.started',
          'TASK_PAUSED': 'task.paused', 'TASK_ERROR': 'task.error',
        };
        const mapped = subscribed.map(e => enumToDot[e]).filter(Boolean);
        if (mapped.length > 0 && mapped.length < this.allEventTypeOptions.length) {
          this.filters.eventTypes = mapped;
        } else {
          this.filters.eventTypes = [];
        }
        this.applyFilter();
      } catch (_) {}
    },
    // P2-UX-12：严重度 pill 交互
    // 全部 / 清除 / 单选 三个动作的差异化：
    // - setAllLevels：清空再设 ['all']（"全部"是显式标记，渲染时识别为不过滤）
    // - clearLevels：清空再设 []（"清除"会隐藏所有 events，orders 仍显示）
    // - toggleLevel：把 'all' 切掉再切换具体值，避免"全选 + 1 个具体值"的歧义
    setAllLevels() {
      this.filters.levels = ['all'];
      this.syncLevelsToUrl();
      this.applyFilter();
    },
    clearLevels() {
      this.filters.levels = [];
      this.syncLevelsToUrl();
      this.applyFilter();
    },
    toggleLevel(lv) {
      const i = this.filters.levels.indexOf(lv);
      // 切到具体值前先把 'all' 标记拿掉，否则会出现 ['all', 'err'] 这种情况，
      // 渲染时 'all' 会"短路"覆盖具体值，行为反直觉
      if (this.filters.levels.includes('all')) {
        this.filters.levels = [lv];
      } else if (i >= 0) {
        this.filters.levels.splice(i, 1);
        // 全空时落回 'all'（不切到 []，否则会"无 events 显示但 pill 全 off" 困惑）
        if (this.filters.levels.length === 0) this.filters.levels = ['all'];
      } else {
        this.filters.levels.push(lv);
      }
      this.syncLevelsToUrl();
      this.applyFilter();
    },
    // 把严重度选择同步到 URL（深链 / 分享）
    // - 用 replaceState 不污染浏览器历史栈（pill 切换不该让"返回"键卡住）
    // - 'all' 不写入 URL（默认值，分享链接里没必要带"无过滤"这个冗余参数）
    syncLevelsToUrl() {
      const lv = this.filters.levels;
      if (lv.length === 1 && lv[0] === 'all') {
        this._stripLevelsFromUrl();
        return;
      }
      const u = new URL(location.href);
      u.searchParams.set('levels', lv.join(','));
      history.replaceState(history.state, '', u.toString());
    },
    _stripLevelsFromUrl() {
      const u = new URL(location.href);
      u.searchParams.delete('levels');
      history.replaceState(history.state, '', u.toString());
    },
    // 严重度命中数（仅对 events 统计），用于顶部"匹配 / 总数"展示
    // 设计：显示数字让用户知道"我刚点了 err，命中 0 条" ≠ "系统坏了"
    get levelMatched() {
      const lv = this.filters.levels;
      if (lv.length === 1 && lv[0] === 'all') {
        return this.items.filter(it => it._kind === 'event').length;
      }
      return this.items.filter(it => it._kind === 'event' && lv.includes(this.tlKindClass(it))).length;
    },
    get levelTotal() {
      return this.items.filter(it => it._kind === 'event').length;
    },
    // 颜色编码：order 用订单颜色，event 按 level/type 区分
    tlKindClass(it) {
      if (it._kind === 'order') {
        if (it.status === 'failed') return 'err';
        if (it.status === 'succeeded') return 'ok';
        if (['pending', 'submitting', 'paying'].includes(it.status)) return 'warn';
        return 'info';
      }
      // event
      const lvl = (it.level || '').toLowerCase();
      if (lvl === 'error' || it.type === 'order.failed' || it.status === 'failed') return 'err';
      if (lvl === 'warning' || lvl === 'warn') return 'warn';
      return 'info';
    },
    // 事件类型映射为中文标签
    _typeLabels: {
      'task.search_done': '搜索完成',
      'eval.scored': '商品评分',
      'eval.passed': '通过筛选',
      'eval.rejected': '已过滤',
      'order.created': '创建订单',
      'order.paid': '支付成功',
      'order.failed': '订单失败',
      'dep_triggered': '依赖激活',
    },
    tlKindLabel(it) {
      if (it._kind === 'order') return '订单';
      // 优先从映射表取中文标签
      if (it.type && this._typeLabels[it.type]) return this._typeLabels[it.type];
      // 兜底：将 eval.scored 转为 "评分" 等简短描述
      if (it.type) {
        const parts = it.type.split('.');
        return parts.length >= 2 ? parts[1] : it.type;
      }
      return '事件';
    },
    // 格式化时间为本地化日期时间
    fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts.replace(' ', 'T'));
      if (isNaN(d.getTime())) return ts.slice(0, 19);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    },
    // 任务ID显示为任务名
    taskLabel(taskId) {
      if (!taskId) return '';
      const t = this.tasks.find(t => t.id === taskId);
      return t ? (t.name || t.keyword || taskId) : '#' + taskId.slice(-6);
    },
    // 将 payload（可能是 JSON 字符串或对象）解析为可读文本
    tlPayloadText(it) {
      if (it._kind === 'order') return '';
      let payload = it.payload;
      // payload 可能是 JSON 字符串，需要解析
      if (typeof payload === 'string') {
        try { payload = JSON.parse(payload); } catch (_) { /* 不是JSON则保留原文 */ }
      }
      if (typeof payload === 'object' && payload !== null) {
        // 评估事件：提取关键信息
        if (payload.score !== undefined) {
          const parts = [`评分 ${payload.score}`];
          if (payload.risk_level) parts.push(`风险 ${payload.risk_level === 'low' ? '低' : payload.risk_level === 'medium' ? '中' : payload.risk_level === 'high' ? '高' : '极高'}`);
          if (payload.is_passed !== undefined) parts.push(payload.is_passed ? '通过' : '未通过');
          return parts.join(' · ');
        }
        // 搜索完成事件：提取关键信息
        if (payload.found !== undefined) {
          const parts = [`找到 ${payload.found}`];
          if (payload.evaluated) parts.push(`评估 ${payload.evaluated}`);
          if (payload.passed) parts.push(`通过 ${payload.passed}`);
          if (payload.linked) parts.push(`关联 ${payload.linked}`);
          return parts.join(' · ');
        }
        // 其他对象：提取前3个键值对
        const entries = Object.entries(payload).slice(0, 3);
        return entries.map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ');
      }
      // 纯文本或 message 字段
      return payload || it.message || '';
    },
    // 主体第一行：订单显示商品标题，事件显示描述性文本
    tlTitle(it) {
      if (it._kind === 'order') {
        return it.title || it.item_title || ('订单 #' + (it.id || ''));
      }
      // 事件：优先用 message（已包含可读描述），否则用 payload 解析
      if (it.message) return it.message;
      const pText = this.tlPayloadText(it);
      return pText || it.type || ('事件 #' + (it.id || ''));
    },
  };
}
</script>
{% endblock %}
