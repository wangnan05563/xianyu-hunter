# XianyuHunter Docker Compose 一键部署
#
# 使用方式：
#   docker compose up -d          # 启动（后台）
#   docker compose logs -f        # 查看日志
#   docker compose down           # 停止
#
# 数据持久化：
#   ./data 目录挂载到容器 /app/data，包含 SQLite 数据库、日志、prompts
#
# 环境变量：
#   通过 .env 文件配置（自动加载），或直接在 environment 中设置

services:
  xianyu-hunter:
    build: .
    container_name: xianyu-hunter
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 数据持久化：SQLite + 日志 + prompts
      - ./data:/app/data
      # 配置文件（.env 自动加载）
      - ./.env:/app/.env:ro
    environment:
      - XH_WITH_SCHEDULER=1
      - PYTHONUNBUFFERED=1
    # Playwright 需要共享内存
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
