# ============================================================================
# Xianyu 性能回归压测配置 —— 由 jmeter-performance-test 技能驱动（全参数外置）
# ----------------------------------------------------------------------------
# 本文件为「真实业务配置」示例：复制 jmeter-config.yml 模板后，仅改本文件即可
# 适配任意项目，无需改动 skills/jmeter-performance-test/scripts/python_replay_engine.py。
# 引擎会按本配置：自动拉起沙箱实例 -> 探针 -> 跑读/写阶段 -> 回收实例 -> 出报告。
# ============================================================================

mode: python_replay          # 本环境无 Java/JMeter，强制 Python 回放

jmeter:
  bin: ""
  java_home: ""
  jvm_args: []
  properties_file: ""
  cli_extra_args: ""

# 沙箱隔离：引擎自动拉起独立实例，压测结束自动回收（不触碰生产 8001）
sandbox:
  enabled: true
  cwd: "D:/code/otherProjects/17_xianyu/test_results/jmeter/run3_sandbox"
  startup_cmd: "{python} -m {pkg} web --port {port} --no-with-scheduler"
  pkg: "xianyu_hunter"
  port: 8011
  health_path: "/api/stats"
  health_retries: 30

target:
  base_url: "http://127.0.0.1:8011"
  default_timeout_sec: 30
  ramp_stagger: true
  fixed_headers: {}
  auth:
    type: bearer
    header_name: "Authorization"
    token_source: env          # 运行引擎前需 export WEB_TOKEN=...（与沙箱 .env 中 web_token 一致）
    token_env: "WEB_TOKEN"
    token_file: ""
    token_literal: ""
    cookie_name: "token"
    udv_names: ["WEB_TOKEN", "web_token"]

phases:
  - name: "reads"
    jmx: "D:/code/otherProjects/17_xianyu/test_results/jmeter/scripts/xianyu_load_test_reads.jmx"
    enabled: true
    threads_override: null     # 使用 JMX ThreadGroup 内值（10 线程 / 60s）
    duration_override: null
  - name: "writes"
    jmx: "D:/code/otherProjects/17_xianyu/test_results/jmeter/scripts/xianyu_load_test_writes.jmx"
    enabled: true
    threads_override: null     # 使用 JMX 内值（20 线程 / 120s）

defect_rules:
  defect_codes: ["000", "405"]   # 000=连接失败/重置，405=路由未挂载
  defect_prefixes: ["5"]         # 5xx 服务端错误
  expected_codes: ["404"]        # 占位资源不存在，业务预期内，不计入真实缺陷
  assertion_mismatch_is_defect: false

comparison:
  enabled: false                 # 本环境基线 JTL 与当前 JMX 不同构，不强行对比
  baseline_jtl: ""
  key_endpoints:
    - { title: "订单详情(P0-1)",   method: "GET",  path_substr: "/api/orders/" }
    - { title: "商品批量(P0-3)",   method: "GET",  path_substr: "/api/items/batch" }
    - { title: "偏好UPSERT(P0-2)", method: "PUT",  path_substr: "/api/preferences" }
    - { title: "维护状态(P1-1)",   method: "GET",  path_substr: "/api/maintenance/status" }
    - { title: "向量库状态(P1-6)", method: "GET",  path_substr: "/api/vector-admin/status" }
  baseline_integrity:
    enforce_same_endpoints: true
    doc_fallback_allowed: true

report:
  formats: ["markdown"]
  output_dir: "D:/code/otherProjects/17_xianyu/test_results/jmeter/runs_engine_final"
  percentiles: [50, 95, 99]
  endpoint_table: true
  group_label_prefixes: []

results:
  output_dir: "D:/code/otherProjects/17_xianyu/test_results/jmeter/runs_engine_final"
  format: csv
  keep_count: 10

logging:
  level: INFO
  file: ""
  verbose: false
