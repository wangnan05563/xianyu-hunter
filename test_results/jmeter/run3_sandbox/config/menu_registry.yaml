# 菜单元数据单一事实源（前后端共享）
# 设计文档：docs/07-权限模块/2026-07-01-登录模块优化概要设计.md §3.4 / §7.2
# 新增菜单只需改此文件，无需改后端代码；前端通过 /api/menu 动态拉取
# 分组结构：overview/data_view/config/maintenance/other（与 docs/ 文档目录结构对齐）
version: 1

menus:
