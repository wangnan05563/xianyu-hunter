task_scheduler:
  default_interval_seconds: 60
  auto_search_enabled: false
  auto_search_concurrency: 1
  error_retry_wait_seconds: 300
  scheduler_runtime_toggle:
    enabled: true
    require_enabled_field: true
    require_update_config_method: true
    require_remove_job_on_disable: true
    target_schedulers:
    - BatchRefreshScheduler
    - CookieSyncScheduler
  time_param_config_driven:
    enabled: true
    forbidden_hardcoded_patterns:
    - time.sleep(300)
    - asyncio.sleep(300)
    - await asyncio.sleep(300)
    require_config_key: true
    scan_modules:
    - modules/scheduler.py
    - modules/batch_refresh_scheduler.py
    - modules/cookie_sync_scheduler.py
  lifecycle_resource_cleanup:
    enabled: true
    require_drop_method: true
    target_state_holders:
    - _resume_cooldown
    - _task_states
    - _active_tasks
    audit_interval_seconds: 3600
  cron_min_interval_check:
    enabled: true
    experimental: true
    min_interval_seconds: 60
    blocked_patterns:
    - '* * * * *'
    - '*/1 * * * *'
    require_parser_library: true
    require_submit_revalidate: true
cookie_management:
  key_cookies:
  - _m_h5_tk
  - _m_h5_tk_enc
  - unb
  - sgcookie
  - cookie2
  - lg2
  cache_ttl_sec: 30
  test_cookie_values:
    unb:
    - '123456'
    - '123'
    cookie2:
    - abc
    _m_h5_tk:
    - abc
    _m_h5_tk_enc:
    - enc
    - enc_123
    - abc123enc456
    sgcookie:
    - sg
    - sg_token
  cookie_format_patterns:
    _m_h5_tk: ^[0-9a-fA-F]{32}_\d{13}$
    unb: ^\d{8,}$
    cookie2: ^[0-9a-fA-F]{32,}$
    sgcookie: ^.{20,}$
    _m_h5_tk_enc: ^.{16,}$
  layer_definitions:
    identity:
      cookies:
      - unb
      - cookie2
      - sgcookie
      - t
      - _tb_token_
      - lg2
      ttl: session
      depends_on: null
    session:
      cookies:
      - _m_h5_tk
      - _m_h5_tk_enc
      ttl: 15-22min
      depends_on: identity
    tracking:
      cookies:
      - cna
      - tfstk
      - xlly_s
      - ali_aplus_v3
      - utdid
      ttl: dynamic
      depends_on: null
  domains:
  - .goofish.com
  - goofish.com
  - .taobao.com
  - taobao.com
  - .alipay.com
  - alipay.com
  - login.taobao.com
  - .login.taobao.com
  import_full: true
token_renewer:
  renew_before_expiry_sec: 600
  check_interval_sec: 120
  token_ttl_sec: 1200
  max_renew_attempts: 3
  retry_interval_sec: 30
  timestamp_api: mtop.taobao.mtop.common.getTimestamp
login_orchestrator:
  renew_fail_threshold: 2
  auto_relogin_cooldown_sec: 600
mtop_sync:
