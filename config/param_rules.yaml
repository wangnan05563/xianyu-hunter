# 参数计算器规则配置
#
# 本文件定义参数校验规则的元数据与阈值，支持热更新：
# - 修改后调用 POST /api/param-calculator/reload 即可生效，无需重启服务
# - 规则代码（code）必须与 BaseRule 子类的 code 类属性一一对应
#
# 段落说明：
# - rules: 规则元数据（启用状态、优先级、适用场景）
# - thresholds: 规则阈值（可调参数，禁止硬编码到代码中）

rules:
  # ===== 任务参数规则 =====
  TASK_PRICE_RANGE_INVALID:
    name: 价格区间合法性
    category: accuracy
    scenarios: [task_create, task_edit]
    priority: 200
    enabled: true
    description: min_price 必须 <= max_price，且均为正数
  TASK_INTERVAL_TOO_SHORT:
    name: 调度间隔合理性
    category: stability
    scenarios: [task_create, task_edit, config_update]
    priority: 180
    enabled: true
    description: 任务间隔应 >= 全局默认间隔，避免触发反爬
  TASK_CRON_INVALID:
    name: cron 表达式合法性
    category: stability
    scenarios: [task_create, task_edit]
    priority: 190
    enabled: true
    description: cron 表达式必须合法且间隔 >= 60s
  TASK_KEYWORD_INVALID:
    name: 关键词合法性
    category: accuracy
    scenarios: [task_create, task_edit]
    priority: 210
    enabled: true
    description: 关键词不能为空且长度 >= 2
  TASK_AUTO_BUY_NO_PRICE_LIMIT:
    name: 自动下单价格保护
    category: stability
    scenarios: [task_create, task_edit]
    priority: 170
    enabled: true
    description: auto 模式下必须设置价格上限

  # ===== 搜索参数规则 =====
  SEARCH_PAGE_SIZE_INVALID:
    name: 搜索页大小合理性
    category: efficiency
    scenarios: [config_update]
    priority: 160
    enabled: true
    description: page_size 应在 10-100 之间
  SEARCH_TIMEOUT_INVALID:
    name: 搜索超时合理性
    category: efficiency
    scenarios: [config_update]
    priority: 150
    enabled: true
    description: timeout 应在 30-180 秒之间
  ANTIDETECT_DELAY_MISMATCH:
    name: 反爬延迟一致性
    category: stability
    scenarios: [config_update]
    priority: 140
    enabled: true
    description: min_delay_ms < max_delay_ms 且 QPS 与延迟换算一致
  CACHE_TTL_MISMATCH:
    name: 缓存TTL对齐
    category: efficiency
    scenarios: [config_update]
    priority: 180
    enabled: true
    description: live_search_ttl 应 >= 调度间隔，避免缓存形同虚设

  # ===== 评估参数规则 =====
  EVAL_WEIGHTS_SUM_INVALID:
    name: 评估权重总和
    category: accuracy
    scenarios: [config_update]
    priority: 170
    enabled: true
    description: 四项权重总和应为 100（允许 ±5 浮动）
  EVAL_SCORE_THRESHOLD_INVALID:
    name: 评估分数阈值
    category: stability
    scenarios: [config_update]
    priority: 180
    enabled: true
    description: pass_score 应 <= auto_buy_score
  EVAL_CREDIT_THRESHOLD_INVALID:
    name: 信用阈值范围
    category: accuracy
    scenarios: [config_update]
    priority: 190
    enabled: true
    description: credit_score_min 应在 0-100 范围内

  # ===== 系统配置规则 =====
  CACHE_EMPTY_RESULT_SKIP_INVALID:
    name: 空结果缓存策略
    category: stability
    scenarios: [config_update]
    priority: 170
    enabled: true
    description: empty_result_skip 应为 false，避免掩盖实时数据恢复
  AUTO_SEARCH_CONCURRENCY_INVALID:
    name: 自动搜索并发
    category: efficiency
    scenarios: [config_update]
    priority: 150
    enabled: true
    description: auto_search_concurrency 应在 1-3 之间
  BATCH_REFRESH_RESOURCE_INVALID:
    name: 批量刷新资源
    category: efficiency
    scenarios: [config_update]
    priority: 140
    enabled: true
    description: batch_size 与 max_items_per_run 应在合理范围
  ERROR_RETRY_WAIT_INVALID:
    name: 错误重试等待
    category: stability
    scenarios: [config_update]
    priority: 130
    enabled: true
    description: error_retry_wait_seconds 应 >= 60s

# 阈值配置：所有可调参数集中管理，禁止硬编码到代码中
thresholds:
  task:
    min_price_span: 10           # 价格区间最小宽度（元）
    min_keyword_length: 2         # 关键词最小长度
    max_keyword_length: 100       # 关键词最大长度
    min_interval_seconds: 60      # 调度间隔建议最小值（与全局默认对齐）
    hard_min_interval_seconds: 30 # 调度间隔硬性最小值（低于此值触发反爬）
  search:
    min_page_size: 10             # page_size 最小值
    max_page_size: 100            # page_size 最大值
    min_timeout: 30              # timeout 最小值（秒）
    max_timeout: 180             # timeout 最大值（秒）
  antidetect:
    qps_tolerance: 0.2           # QPS 与延迟换算的允许偏差（20%）
  cache:
    max_ttl_ratio: 3             # TTL 超过调度间隔的倍数上限
  eval:
    weight_sum_tolerance: 5      # 权重总和允许偏差
    min_score: 0                  # 评分最小值
    max_score: 100               # 评分最大值
    credit_score_hard_min: 0     # 信用分硬性最小值
    credit_score_hard_max: 100   # 信用分硬性最大值
    credit_score_warning: 80     # 信用分过高预警阈值
  scheduler:
    max_auto_search_concurrency: 3  # 自动搜索最大并发
    min_error_retry_wait: 60        # 错误重试最小等待（秒）
  batch_refresh:
    max_batch_size: 100             # 批量刷新单批最大数
    max_max_items_per_run: 500      # 批量刷新单次最大商品数
