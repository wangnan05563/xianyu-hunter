# 卖家评估配置模板
#
# 使用方式：
#   copy config\eval.example.yaml config\eval.yaml
#   然后按需修改 eval.yaml
#
# 说明：
# - eval.yaml 控制卖家评估阈值与权重
# - 权重之和必须为 100
# - pass_score 不能大于 auto_buy_score

eval:
  weights:
    professional: 30   # 职业卖家识别权重
    credit: 30         # 信用与资质权重
    dispute: 25        # 历史纠纷与黑名单权重
    price: 15          # 价格与竞价异常权重

  thresholds:
    on_sale_count: 30            # 在售商品超过此值视为职业卖家
    post_count_30d: 15           # 30 天内发布超过此值视为职业
    top_category_ratio: 0.8      # 单一类目占比超过 80% 视为职业
    credit_score_min: 600        # 信用分低于此值一票否决
    bad_review_max: 3            # 差评超过此值一票否决
    register_days_min: 30        # 注册不满此天数加风险分

  # 职业卖家关键词（命中任一即加分）
  professional_keywords:
    - 批发
    - 代理
    - 代购
    - 大量
    - 店铺
    - 厂家
    - 直发
    - 一手
    - 现货
    - 大量有货

  pass_score: 60       # >= 此分数推送通知
  auto_buy_score: 80   # >= 此分数全自动拍下
