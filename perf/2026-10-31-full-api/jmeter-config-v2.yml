phases:
- name: baseline_write
  jmx: jmeter/writes_idem.jmx
  enabled: true
  threads_override: 1
  duration_override: 180
- name: baseline_light
  jmx: jmeter/reads_light.jmx
  enabled: true
  threads_override: 1
  duration_override: 180
- name: stress_light_t16
  jmx: jmeter/reads_light.jmx
  enabled: true
  threads_override: 16
  duration_override: 60
- name: stress_light_t48
  jmx: jmeter/reads_light.jmx
  enabled: true
  threads_override: 48
  duration_override: 60
- name: stress_light_t96
  jmx: jmeter/reads_light.jmx
  enabled: true
  threads_override: 96
  duration_override: 60
- name: stress_write_t4
  jmx: jmeter/writes_idem.jmx
  enabled: true
  threads_override: 4
  duration_override: 60
- name: stress_write_t8
  jmx: jmeter/writes_idem.jmx
  enabled: true
  threads_override: 8
  duration_override: 60
- name: stress_write_t16
  jmx: jmeter/writes_idem.jmx
  enabled: true
  threads_override: 16
  duration_override: 60
- name: soak_mixed
  jmx: jmeter/mixed_biz.jmx
  enabled: true
  threads_override: 12
  duration_override: 1800
defect_rules:
  defect_codes:
  - '000'
  - '405'
  defect_prefixes:
  - '5'
  expected_codes:
  - '404'
  - '422'
  assertion_mismatch_is_defect: false
comparison:
  enabled: false
  baseline_jtl: ''
  key_endpoints: []
  baseline_integrity:
    enforce_same_endpoints: true
    doc_fallback_allowed: true
report:
  formats:
  - markdown
  output_dir: D:\tmp\xh-perf\output
  percentiles:
  - 50
  - 90
  - 95
  - 99
  endpoint_table: true
  group_label_prefixes: []
results:
  output_dir: D:\tmp\xh-perf\output
  format: csv
  keep_count: 40
logging:
  level: INFO
  file: D:\tmp\xh-perf\output\perf_v2.log
  verbose: false
