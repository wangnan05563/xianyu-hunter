mode: python_replay
sandbox:
  enabled: true
  cwd: D:\tmp\xh-perf\sandbox
  startup_cmd: ''
  pkg: ''
  port: 8011
  health_path: /healthz
  health_retries: 60
  port_kill_retries: 0
  require_new_instance: false
  env_overrides: {}
  preflight:
    enabled: true
    rate_limit_burst: 120
    burst_path: /healthz
    abort_on_rate_limit: true
    login_warmup: false
    login_url: ''
    login_method: POST
    login_body: ''
    login_max_retries: 0
  min_output_lines: 20
  process_match:
    mode: pid_file
    pid_file: D:\tmp\xh-perf\sut.pid
    name: ''
    cmd_substr: ''
  lifecycle:
    never_global_kill: true
    kill_tree: false
    kill_retries: 3
    kill_wait_ms: 500
resource_monitor:
  enabled: true
  match:
    mode: pid_file
    pid_file: D:\tmp\xh-perf\sut.pid
    name: ''
    cmd_substr: ''
  sample_interval_sec: 2
  duration_samples: 0
  metrics:
  - rss_mb
  - private_mb
  - cpu_percent
  - handles
  - threads
  output_csv: D:\tmp\xh-perf\output\sut_resource.csv
  alert:
    enabled: true
    max_rss_mb: 1800
    on_exceed: warn
target:
  base_url: http://127.0.0.1:8011
  default_timeout_sec: 60
  ramp_stagger: true
  fixed_headers:
    Accept: application/json
  auth:
    type: bearer
    header_name: Authorization
    token_source: file
    token_env: WEB_TOKEN
    token_file: D:\tmp\xh-perf\token.txt
    token_literal: ''
    cookie_name: xh_token
    udv_names:
    - WEB_TOKEN
    - web_token
